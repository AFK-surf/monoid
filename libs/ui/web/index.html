<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="">
<title>MoonBit UI</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F5F7;
               overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  /* the app's own presses: no selecting, no callout, no browser gesture over it */
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block;
       user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* receives the input method; sits at the caret, invisible */
  #ime { position: fixed; left: 0; top: 0; width: 2px; height: 20px; opacity: 0; padding: 0; border: 0;
         resize: none; overflow: hidden; font-size: 16px; caret-color: transparent; color: transparent;
         background: transparent; outline: none; }

  /* What shows where this browser gives no WebGL 2 (hardware acceleration turned off, a browser too old): the app
     draws with it, so it is never loaded there; the page says how to turn it on instead, in plain HTML, the app not
     being there to draw it. Its colours and shapes are the ones the apps on mbui draw with (a warm ground, a card on
     it): the card's corner is 26; the steps' panel sits 6 in from its edge, so its corner is 20, and Retry, a
     capsule 32 high, sits 10 in from the card's foot and side, its half 16 and those 10 the card's 26. Only #nogl
     is styled: the page the app draws on is as it was. */
  #nogl {
    --ground: #F5F3EF; --card: #FFFFFF; --panel: #F6F5F1; --ink: #24272B; --muted: #565B62; --line: #322D2424;
    --badge: #24272B13; --hover: #26211711; --primary: #24272B; --primary-hover: #41464C; --on-primary: #FFFFFF;
    --focus: #DC5929; --shadow: #13161B1A;
    position: fixed; inset: 0; z-index: 1; overflow: auto; display: flex; box-sizing: border-box;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--ground); color: var(--ink);
    font: 400 14px/20px "Inter", system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    #nogl {
      --ground: #1F2023; --card: #26272B; --panel: #2C2D31; --ink: #E9E9EA; --muted: #A8AAAE; --line: #E9E9EA19;
      --badge: #E9E9EA0E; --hover: #FFFFFF0D; --primary: #ECEDED; --primary-hover: #D3D4D6; --on-primary: #1F2023;
      --focus: #E97342; --shadow: #00000040;
    }
  }
  #nogl[hidden] { display: none; }
  #nogl *, #nogl *::before { box-sizing: border-box; }
  #nogl .card {
    margin: auto; width: 100%; max-width: 440px; padding: 6px; display: flex; flex-direction: column; gap: 6px;
    background: var(--card); border-radius: 26px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px var(--shadow);
  }
  #nogl .head { padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 8px; }
  #nogl h1 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  #nogl .lead { margin: 0; color: var(--muted); text-wrap: pretty; }
  #nogl ol { list-style: none; margin: 0; padding: 14px 18px; background: var(--panel); border-radius: 20px; display: grid; row-gap: 12px; }
  /* a step's number sits on its first line, as tall as that line, never in the middle of a step of several */
  #nogl li { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 12px; align-items: start; padding: 0; }
  #nogl .n { width: 20px; height: 20px; border-radius: 999px; background: var(--badge); color: var(--muted);
             font-size: 12px; line-height: 20px; font-weight: 500; text-align: center; font-variant-numeric: tabular-nums; }
  #nogl .say { min-width: 0; overflow-wrap: anywhere; }
  /* a setting's or a button's name kept whole: Chinese is not broken inside one (a long one still breaks before it would
     overflow, .say's anywhere) */
  #nogl b { font-weight: 500; word-break: keep-all; }
  /* an address to open and its copy, two pills of one height side by side */
  #nogl .addr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  #nogl .addr code {
    font: 400 13px/20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 4px 10px; border-radius: 999px;
    background: var(--card); box-shadow: 0 0 0 1px var(--line); overflow-wrap: anywhere; min-width: 0;
    user-select: all; -webkit-user-select: all;
  }
  #nogl .note { margin: 0; padding: 6px 18px 2px; color: var(--muted); font-size: 12px; line-height: 18px; text-wrap: pretty; }
  #nogl .note b { color: var(--ink); overflow-wrap: anywhere; }
  #nogl button {
    font: inherit; font-weight: 500; cursor: pointer; border: 0; margin: 0; border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
  }
  #nogl button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #nogl .copy { height: 28px; padding: 0 12px; font-size: 12px; line-height: 28px; color: var(--ink);
                background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  #nogl .foot { display: flex; justify-content: flex-end; padding: 0 4px 4px; }
  #nogl .retry { height: 32px; padding: 0 16px; font-size: 13px; line-height: 32px; color: var(--on-primary); background: var(--primary); }
  @media (hover: hover) {
    #nogl .copy:hover { background: var(--hover); }
    #nogl .retry:hover { background: var(--primary-hover); }
  }
  @media (prefers-reduced-motion: no-preference) {
    #nogl button { transition: background-color 150ms ease-out, transform 100ms ease-out; }
    #nogl button:active { transform: scale(0.97); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<textarea id="ime" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
<div id="nogl" hidden>
  <main class="card" aria-labelledby="nogl-h">
    <div class="head">
      <h1 id="nogl-h"></h1>
      <p class="lead" id="nogl-lead"></p>
    </div>
    <ol id="nogl-steps"></ol>
    <p class="note" id="nogl-note"></p>
    <div class="foot"><button type="button" class="retry" id="nogl-retry"></button></div>
  </main>
</div>
<script>
// The app draws with WebGL 2 (host.js): where this browser gives none it is not loaded (a whole bundle fetched only to
// stop at its first draw on a blank page); the page says how to turn it on instead. The context asked for to know is
// let go at once: a browser keeps only a few of them.
(function () {
  var ok = !!globalThis.__mbrender;
  if (!ok) {
    try {
      var gl = document.createElement('canvas').getContext('webgl2');
      if (gl) {
        ok = true;
        var lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      }
    } catch (e) {}
  }
  if (ok) {
    // in the order written, as the two tags were (async false: each run in turn, not as each comes)
    ['host.js', 'demo.js'].forEach(function (src) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      document.body.appendChild(s);
    });
    return;
  }

  var ua = navigator.userAgent || '';
  var zh = /^zh/i.test(navigator.language || '');
  // The browser as far as its steps differ: Chromium's on a computer by the scheme of its own pages (Edge's, Opera's
  // and Brave's say Chrome/ as well); a phone's has no such page, nor a phone's Firefox its preferences.
  var phone = /Android|iPhone|iPad|iPod|Mobile/.test(ua) || !!(navigator.userAgentData && navigator.userAgentData.mobile);
  var kind = 'other', scheme = null, name = null;
  if (/Firefox\/|FxiOS\//.test(ua)) { if (!phone) { kind = 'firefox'; name = 'Firefox'; } }
  else if (!phone && /Edg\//.test(ua)) { kind = 'chromium'; scheme = 'edge'; name = 'Edge'; }
  else if (!phone && /OPR\//.test(ua)) { kind = 'chromium'; scheme = 'opera'; name = 'Opera'; }
  else if (!phone && /Chrome\//.test(ua)) {
    kind = 'chromium'; scheme = navigator.brave ? 'brave' : 'chrome'; name = navigator.brave ? 'Brave' : 'Chrome';
  }
  else if (/Safari\//.test(ua) && !/Chrome\/|CriOS\/|EdgiOS\//.test(ua)) { kind = 'safari'; name = 'Safari'; }

  // (WebGL\u00a02: never broken between its two words)
  var page = (document.title || '').trim() || (zh ? '当前页面' : 'This page');
  var say = {
    title: zh ? '打开浏览器的硬件加速' : 'Turn on hardware acceleration',
    lead: zh
      ? page + ' 用显卡绘制界面，需要 WebGL\u00a02。' + (name ? name + ' ' : '这个浏览器') + '现在没有开启图形硬件加速，界面画不出来。按下面的步骤打开后，点「重试」。'
      : page + ' draws with your graphics card and needs WebGL\u00a02. ' + (name || 'This browser') + ' has graphics acceleration turned off, so nothing can be drawn. Turn it on as below, then press Retry.',
    retry: zh ? '重试' : 'Retry',
    copy: zh ? '复制' : 'Copy',
    copied: zh ? '已复制' : 'Copied',
    copyBy: zh ? '选中地址后手动复制' : 'Select the address to copy it',
  };
  // a step: its words (a string, or {b} the name of a setting or a button), and an address to open where it has one
  var steps, note, open = zh ? '在新标签页的地址栏打开：' : 'Open this address in a new tab:';
  if (kind === 'chromium') {
    var setting = zh
      ? scheme === 'edge' ? '在可用时使用图形加速' : scheme === 'opera' ? '可用时使用硬件加速' : '使用图形加速功能（如果可用）'
      : scheme === 'opera' ? 'Use hardware acceleration when available' : 'Use graphics acceleration when available';
    steps = [
      { words: [open], address: scheme + '://settings/system' },
      { words: zh ? ['打开', { b: '「' + setting + '」' }, '。'] : ['Turn on ', { b: setting }, '.'] },
      { words: zh ? ['点设置旁出现的', { b: '「重新启动」' }, '，再回到这里点「重试」。']
                  : ['Press ', { b: 'Relaunch' }, ', then come back here and press Retry.'] },
    ];
    note = zh
      ? ['已经打开了？在地址栏打开 ', { b: scheme + '://gpu' }, '，看 WebGL2 一项是否为 Hardware accelerated；若是 Disabled，更新显卡驱动或浏览器后再试。']
      : ['Already on? Open ', { b: scheme + '://gpu' }, ' and check that WebGL2 says Hardware accelerated. If it says Disabled, update your graphics driver or the browser.'];
  } else if (kind === 'firefox') {
    steps = [
      { words: [open], address: 'about:preferences#general' },
      { words: zh
          ? ['在', { b: '「性能」' }, '里取消勾选', { b: '「使用推荐的性能设置」' }, '，再勾选', { b: '「自动启用硬件加速」' }, '。']
          : ['Under ', { b: 'Performance' }, ', clear ', { b: 'Use recommended performance settings' }, ', then turn on ',
             { b: 'Use hardware acceleration when available' }, '.'] },
      { words: [zh ? '重新启动 Firefox，再回到这里点「重试」。' : 'Restart Firefox, then come back here and press Retry.'] },
    ];
    note = zh
      ? ['已经打开了？在地址栏打开 ', { b: 'about:support' }, '，看 WebGL\u00a02 的渲染器一项是否写着你的显卡。']
      : ['Already on? Open ', { b: 'about:support' }, ' and check that WebGL\u00a02 Driver Renderer names your graphics card.'];
  } else if (kind === 'safari') {
    steps = [
      { words: [zh ? '把系统和 Safari 更新到最新版本。' : 'Update your system and Safari to the latest version.'] },
      { words: zh
          ? ['若在', { b: '「开发」›「功能标志」' }, '里改过设置，确认', { b: '「WebGL\u00a02.0」' }, '是打开的。']
          : ['If you changed ', { b: 'Develop › Feature Flags' }, ', check that ', { b: 'WebGL\u00a02.0' }, ' is on.'] },
      { words: [zh ? '退出 Safari 再打开，回到这里点「重试」。' : 'Quit and reopen Safari, then come back here and press Retry.'] },
    ];
    note = [zh ? 'Safari 15 起都支持 WebGL\u00a02。' : 'Safari has WebGL\u00a02 from version 15.'];
  } else {
    steps = [
      { words: [zh ? '把浏览器更新到最新版本。' : 'Update the browser to its latest version.'] },
      { words: zh ? ['在浏览器的设置里打开', { b: '「硬件加速」' }, '或', { b: '「图形加速」' }, '。']
                  : ['Turn on ', { b: 'hardware acceleration' }, ' or ', { b: 'graphics acceleration' }, ' in its settings.'] },
      { words: [zh ? '重新启动浏览器，再回到这里点「重试」。' : 'Restart the browser, then come back here and press Retry.'] },
    ];
    note = [zh ? 'Chrome、Edge、Firefox 和 Safari 的新版本都支持 WebGL\u00a02。' : 'Recent Chrome, Edge, Firefox and Safari all have WebGL\u00a02.'];
  }

  var el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  };
  var words = function (into, parts) {
    parts.forEach(function (w) { into.appendChild(typeof w === 'string' ? document.createTextNode(w) : el('b', null, w.b)); });
  };
  // The address onto the clipboard: the browser's way, else the old one (a page not served securely has no
  // navigator.clipboard); told whether it went.
  var copyOld = function (text) {
    var t = el('textarea');
    t.value = text;
    t.setAttribute('readonly', '');
    t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(t);
    t.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t);
    return done;
  };
  var copyTo = function (text, then) {
    var c = navigator.clipboard;
    if (c && c.writeText) c.writeText(text).then(function () { then(true); }, function () { then(copyOld(text)); });
    else then(copyOld(text));
  };
  // an address to open in a new tab (a browser's own pages cannot be linked to), with a button that copies it, which
  // says it did till the pointer or the focus leaves it: no timer
  var address = function (url) {
    var code = el('code', null, url);
    var b = el('button', 'copy', say.copy);
    b.type = 'button';
    b.setAttribute('aria-live', 'polite');
    b.addEventListener('click', function () {
      copyTo(url, function (ok) {
        if (!ok) {
          // the address selected for the person to copy themselves
          var r = document.createRange(), sel = getSelection();
          r.selectNodeContents(code);
          sel.removeAllRanges();
          sel.addRange(r);
        }
        b.textContent = ok ? say.copied : say.copyBy;
      });
    });
    var back = function () { b.textContent = say.copy; };
    b.addEventListener('pointerleave', back);
    b.addEventListener('blur', back);
    var row = el('div', 'addr');
    row.appendChild(code);
    row.appendChild(b);
    return row;
  };

  var nogl = document.getElementById('nogl');
  nogl.lang = zh ? 'zh-CN' : 'en';
  document.getElementById('nogl-h').textContent = say.title;
  document.getElementById('nogl-lead').textContent = say.lead;
  var ol = document.getElementById('nogl-steps');
  steps.forEach(function (s, i) {
    var body = el('div', 'say');
    words(body, s.words);
    if (s.address) body.appendChild(address(s.address));
    var li = el('li');
    li.appendChild(el('span', 'n', String(i + 1)));
    li.appendChild(body);
    ol.appendChild(li);
  });
  words(document.getElementById('nogl-note'), note);
  var retry = document.getElementById('nogl-retry');
  retry.textContent = say.retry;
  retry.addEventListener('click', function () { location.reload(); });
  document.getElementById('c').style.display = 'none';
  document.getElementById('ime').style.display = 'none';
  nogl.hidden = false;
})();
</script>
</body>
</html>
