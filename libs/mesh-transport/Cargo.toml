[package]
name = "mesh-transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["native"]
native = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:noq", "tokio/rt-multi-thread", "tokio/time", "tokio/signal", "tokio/process", "iroh/default"]

[dependencies]
n0-future = "0.3"

bytes = "1"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
serde_json = "1"
blake3 = "1"
iroh = { version = "=1.0.3", default-features = false, features = ["unstable-custom-transports"] }
iroh-base = "=1.3.0"
n0-watcher = "1"
noq-udp = { version = "=1.3.0", default-features = false }
noq = { version = "=1.3.0", optional = true, default-features = false }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "macros", "io-util"] }

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["test-util"] }

[workspace]

[patch.crates-io]
iroh = { git = "https://github.com/zzj3720/iroh", rev = "8ac61479436aa1006cf7a74bee96874e26162005" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "8ac61479436aa1006cf7a74bee96874e26162005" }
noq-proto = { git = "https://github.com/CommaBot/noq", rev = "63b8fad9d5c2ea2c2939aaca5ca81f7ece506b58" }
noq-udp = { path = "../../vendor/noq-udp" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
