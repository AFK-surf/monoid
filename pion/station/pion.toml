  "packages/host_shim",
  "packages/sqlite_ffi",
  "packages/smoke",
]

[workspace.dependencies]
base64 = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "base64-v0.1.0", subdir = "packages/base64" }
