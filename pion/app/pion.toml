[workspace]
members = [
  "packages/app_state",
]

[workspace.dependencies]
# Official AFK-surf/pion-packages release tags
base64 = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "base64-v0.1.0", subdir = "packages/base64" }
effect = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "effect-v0.1.0", subdir = "packages/effect" }
crypto = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "crypto-v0.2.0", subdir = "packages/crypto" }
flate = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "flate-v0.1.0", subdir = "packages/flate" }
url = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "url-v0.1.0", subdir = "packages/url" }
time = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "time-v0.1.0", subdir = "packages/time" }
http1 = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "http1-v0.1.0", subdir = "packages/http1" }
json5 = { git = "https://github.com/AFK-surf/pion-packages.git", tag = "json5-v0.1.0", subdir = "packages/json5" }

# Official AFK-surf/invar pinned main rev (headless reactive & frame-wake primitives only)
signals = { git = "https://github.com/AFK-surf/invar.git", rev = "ae44931399a65d6ce68c59544216e359cc29b8db", subdir = "packages/signals" }
view = { git = "https://github.com/AFK-surf/invar.git", rev = "ae44931399a65d6ce68c59544216e359cc29b8db", subdir = "packages/view" }
ui = { git = "https://github.com/AFK-surf/invar.git", rev = "ae44931399a65d6ce68c59544216e359cc29b8db", subdir = "packages/ui" }

# Local monoid pure-Pion workspaces
base_codec = { path = "../base/packages/base_codec" }
wire = { path = "../base/packages/wire" }
shell = { path = "../base/packages/shell" }
sql = { path = "../base/packages/sql" }
mesh = { path = "../base/packages/mesh" }
form = { path = "../rules/packages/form" }
fork = { path = "../rules/packages/fork" }
history = { path = "../rules/packages/history" }
role = { path = "../rules/packages/role" }
lock = { path = "../rules/packages/lock" }
vault = { path = "../rules/packages/vault" }
outbox = { path = "../client-core/packages/outbox" }
store = { path = "../client-core/packages/store" }
protocol = { path = "../client-core/packages/protocol" }
sync = { path = "../client-core/packages/sync" }
