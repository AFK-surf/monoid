[package]
name = "station-load"
edition = "2024"
version = "0.1.0"
publish = false
description = "For testing a station: a test workspace's keys for a station, and a member's client that asks it things over iroh, timed"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
iroh = { version = "=1.0.3" }
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]

[patch.crates-io]
noq-proto = { git = "https://github.com/CommaBot/noq", rev = "63b8fad9d5c2ea2c2939aaca5ca81f7ece506b58" }
swarm-discovery = { path = "../../../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../../../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../../../vendor/noq-udp" }
iroh = { git = "https://github.com/zzj3720/iroh", rev = "0d8d64f82289a6726cd7edb1671d38a1ce56d0fc" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "0d8d64f82289a6726cd7edb1671d38a1ce56d0fc" }
