[package]
name = "station-load"
edition = "2024"
version = "0.1.0"
publish = false
description = "For testing a station: a test workspace's keys for a station, and a member's client that asks it things over iroh, timed"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
iroh = { version = "=1.0.3" }
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]

[patch.crates-io]
noq-proto = { git = "https://github.com/zzj3720/noq", rev = "76344e6eab7ae651ce524e4f329a2f283f69d7ab" }
swarm-discovery = { path = "../../../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../../../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../../../vendor/noq-udp" }
iroh = { git = "https://github.com/zzj3720/iroh", rev = "3a2d9ebb23e8f27fef2fa2aa321f98bc36ec03e3" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "3a2d9ebb23e8f27fef2fa2aa321f98bc36ec03e3" }
