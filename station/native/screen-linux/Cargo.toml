[package]
name = "stillfail-screen-linux"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "stillfail-screen-linux"
path = "src/main.rs"

[dependencies]
jpeg-encoder = "0.6"
libc = "0.2"
openh264 = { version = "0.9", default-features = false, features = ["source"] }
openh264-sys2 = "0.9"
png = "=0.18.1"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["damage", "randr", "shm", "xfixes", "xtest"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
