[package]
name = "stillfail-mesh"
edition = "2024"
version = "0.1.0"
publish = false
description = "The station's iroh and its image codecs (thumbnails, ThumbHashes), for the station in TypeScript (station/src): built once per release of it, shipped prebuilt as mesh.node"

[lib]
crate-type = ["cdylib"]

[dependencies]
mesh-transport = { path = "../../../libs/mesh-transport" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The archive lock (archive.rs `file_lock`) and local links (local_links.rs), as mesh/app has them.
libc = "=0.2.189"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
url = "=2.5.8"
anyhow = "1"
base64 = "0.22"
# A datagram that asks whether a connection's other end is still there (`Connection::answers`).
bytes = "1"
hex = "0.4"
iroh = { version = "=1.0.3", features = ["unstable-custom-transports"] }
iroh-mdns-address-lookup = "=0.4.0"
iroh-mainline-address-lookup = "=0.5.0"
# Its DHT, for the nodes it starts from (`dht` in src/lib.rs).
n0-mainline = "=0.6.0"
# The type of what an address lookup resolves (`Unmade`), as iroh names it.
n0-future = "0.3"
napi = { version = "3", features = ["async", "tokio_rt", "serde-json"] }
napi-derive = "3"
noq-proto = { version = "1", default-features = false }
# Its datagrams marked with a DSCP (`set_dscp`, src/dscp.rs): the vendored one ([patch.crates-io]), iroh's own.
noq-udp = { version = "=1.3.0", default-features = false }
sha2 = "0.10"
# Signatures checked by formally verified implementations (src/verify.rs), as a native app's shell checks them.
libcrux-ed25519 = { version = "=0.0.10", default-features = false }
libcrux-ecdsa = { version = "=0.0.9", default-features = false }
# Thumbnails (src/thumbs.rs): exactly as mesh/app builds them (mesh/Cargo.lock), so both stations make the same bytes;
# the codecs under `image` pinned too (Cargo.lock is not kept here).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
thumbhash = "=0.1.0"
png = "=0.18.1"
fdeflate = "=0.3.7"
flate2 = "=1.1.10"
miniz_oxide = "=0.8.9"
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"
image-webp = "=0.2.4"
moxcms = "=0.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# The test's clock (`start_paused`): what a dial sends over ten minutes, counted in no time.
tokio = { version = "1", features = ["test-util"] }
# Relays on this machine, what each was sent counted (the side run's tests of a station's disabled relays).
iroh = { version = "=1.0.3", features = ["test-utils"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "test-utils"] }

# A workspace of its own: not part of mesh/ or client/.
[workspace]

# As mesh/ has them (vendor/README.md).
[patch.crates-io]
noq-proto = { git = "https://github.com/CommaBot/noq", rev = "63b8fad9d5c2ea2c2939aaca5ca81f7ece506b58" }
swarm-discovery = { path = "../../../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../../../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../../../vendor/noq-udp" }
iroh = { git = "https://github.com/zzj3720/iroh", rev = "0d8d64f82289a6726cd7edb1671d38a1ce56d0fc" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "0d8d64f82289a6726cd7edb1671d38a1ce56d0fc" }

[profile.release]
strip = true
