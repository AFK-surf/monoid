concurrency:
  group: pion-station-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  c-shims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/node

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Validate toolchain pin, scripts, and stdio smoke harness self-test
        run: |
          sha="$(sed -n 's/[[:space:]]*#.*$//; /^[[:space:]]*$/d; p; q' pion/station/TOOLCHAIN | tr -d '[:space:]')"
          test "${#sha}" -eq 40
          sh -n pion/station/scripts/ensure-pionc.sh
          bash -n pion/station/scripts/build.sh
          node pion/station/scripts/smoke-stdio-test.mjs

      - name: C shims strict compile, ASan/UBSan, TSan, and win32-x64 cross-compile
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test"
          "$RUNNER_TEMP/station_sqlite_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test_asan"
          "$RUNNER_TEMP/station_sqlite_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test_tsan"
          "$RUNNER_TEMP/station_sqlite_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test"
          "$RUNNER_TEMP/host_shim_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test_asan"
          "$RUNNER_TEMP/host_shim_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test_tsan"
          "$RUNNER_TEMP/host_shim_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test"
          "$RUNNER_TEMP/footprint_fs_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test_asan"
          "$RUNNER_TEMP/footprint_fs_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test_tsan"
          "$RUNNER_TEMP/footprint_fs_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/builders_replica/native/carry_fs.c \
            pion/station/packages/builders_replica/native/carry_fs_test.c \
            -o "$RUNNER_TEMP/carry_fs_test"
          "$RUNNER_TEMP/carry_fs_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/builders_replica/native/carry_fs.c \
            pion/station/packages/builders_replica/native/carry_fs_test.c \
            -o "$RUNNER_TEMP/carry_fs_test_asan"
          "$RUNNER_TEMP/carry_fs_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/builders_replica/native/carry_fs.c \
            pion/station/packages/builders_replica/native/carry_fs_test.c \
            -o "$RUNNER_TEMP/carry_fs_test_tsan"
          "$RUNNER_TEMP/carry_fs_test_tsan"

          # Verify _WIN32 compilation path on every CI run with pinned Zig 0.16.0.
          zbase="$HOME/.cache/pion-station-zig/0.16.0"
          zbin="$zbase/zig-x86_64-linux-0.16.0/zig"
          if [ ! -x "$zbin" ]; then
            mkdir -p "$zbase"
            tmp="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 \
              -o "$tmp" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $tmp" | sha256sum -c --quiet
            tar -xf "$tmp" -C "$zbase"
            rm -f "$tmp"
          fi
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/host_shim/native/station_host.c -o "$RUNNER_TEMP/station_host_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c -o "$RUNNER_TEMP/station_sqlite_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/footprint/native/footprint_fs.c -o "$RUNNER_TEMP/footprint_fs_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/builders_replica/native/carry_fs.c -o "$RUNNER_TEMP/carry_fs_win.o"

  pion-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify access to AFK-surf/pion and AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            exit 0
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion.git HEAD >/dev/null 2>&1 && \
             GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion-packages.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::AFK-surf/pion or AFK-surf/pion-packages is private and PION_TOKEN is not configured."
          exit 1

      - name: Cache pinned Pion toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Ensure pinned pionc toolchain
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          ENV_OUT="$(sh pion/station/scripts/ensure-pionc.sh --print-env)" || exit $?
          eval "$ENV_OUT"
          echo "$(dirname "$PIONC")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC" >> "$GITHUB_ENV"
          "$PIONC" --version

      - name: Pion fmt, check, and unit tests
        run: |
          "$PIONC" fmt --check pion/station
          "$PIONC" check --json pion/station
          "$PIONC" test --json pion/station
          "$PIONC" test --json pion/base

  build-linux:
    needs: [c-shims, pion-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_reader: ${{ steps.reader.outputs.has_reader }}
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify access to AFK-surf/pion and AFK-surf/pion-packages (fail loudly on missing PION_TOKEN)
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            exit 0
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion.git HEAD >/dev/null 2>&1 && \
             GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion-packages.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::AFK-surf/pion or AFK-surf/pion-packages is private and PION_TOKEN is not configured in AFK-surf/monoid repository secrets."
          exit 1

      - name: Cache pinned Pion toolchain
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Cache Zig compilation artifacts
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: pion-station-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station/**') }}
          restore-keys: pion-station-zig-cache-linux-x64-0.16.0-

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Ensure pinned pionc toolchain
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          ENV_OUT="$(sh pion/station/scripts/ensure-pionc.sh --print-env)" || exit $?
          eval "$ENV_OUT"
          echo "$(dirname "$PIONC")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC" >> "$GITHUB_ENV"
          echo "PION_QBE=$PION_QBE" >> "$GITHUB_ENV"
          echo "PION_TOOLCHAIN_DIR=$PION_TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "PION_RT_DIR=$PION_RT_DIR" >> "$GITHUB_ENV"
          "$PIONC" --version

      - name: Whether shell-station and MoonBit reader are prebuilt (reuse pipeline shell-station when missing)
        id: reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inbox="$RUNNER_TEMP/natives"
          mkdir -p "$inbox"
          # Always expose STILLFAIL_NATIVE_INBOX so native.ts falls back to the GitHub API
          # if the releases download edge returns a stale 404 right after main publishes.
          echo "STILLFAIL_NATIVE_INBOX=$inbox" >> "$GITHUB_ENV"

          shell_key="$(node scripts/native.ts key shell-station linux-x64)"
          reader_key="$(node scripts/native.ts key reader linux-x64)"
          shell_asset="shell-station-linux-x64-$shell_key.tar.gz"
          reader_asset="reader-linux-x64-$reader_key.tar.gz"
          missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
          missing_reader="$(node scripts/native.ts missing reader:linux-x64)"

          # stillfail-pion (build.sh) links libstillfail_shell.a (shell-station:linux-x64).
          # When client/shell/** changed, the pipeline's Linux x64 shell job builds it with cargo-zigbuild.
          # Wait only for shell-station here; if reader:linux-x64 is still missing afterwards, build-linux-reader
          # acquires it in its own 5-minute job so build-linux never times out waiting for stage-2 readers.
          run="" shell_state="" natives_state=""
          if [ -n "$missing_shell" ]; then
            echo "shell-station:linux-x64 not published yet; waiting for same-SHA pipeline shell-station"
            api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
            t0=$SECONDS
            # Leave >= 55 s before starting a restore for R2 (~6 s), pion build + smoke (~37 s), and artifact upload (~4 s).
            deadline=$(( JOB_END - 55 ))
            while :; do
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
                if [ -z "$missing_shell" ]; then
                  echo "(shell-station published after $((SECONDS - t0)) s)"
                  break
                fi
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "pipeline shell-station not ready after $((SECONDS - t0)) s (run=${run:-none}, shell=${shell_state:-none}, natives=${natives_state:-none})"
                break
              fi
              [ -n "$run" ] || run="$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)"
              if [ -n "$run" ]; then
                jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" || true)"
                shell_state="$(printf '%s' "$jobs_json" | jq -r '[.jobs[]? | select(.name == "natives-build (linux-x64 · shell)" or .name == "natives-build (linux-x64)" or .name == "natives") | "\(.status) \(.conclusion // "")"] | (map(select(. == "completed success"))[0] // map(select(startswith("completed ") and . != "completed skipped"))[0] // .[0] // empty)' 2>/dev/null || true)"
                natives_state="$(printf '%s' "$jobs_json" | jq -r '[.jobs[]? | select(.name == "natives") | "\(.status) \(.conclusion // "")"] | .[0] // empty' 2>/dev/null || true)"
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  arts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" || true)"
                  shell_art="$(printf '%s' "$arts_json" | jq -r '[.artifacts[]? | select((.expired | not) and .name == "natives-linux-x64-shell-'"$GITHUB_SHA"'") | .name][0] // empty' 2>/dev/null || true)"
                  if [ -n "$shell_art" ] || [ "$shell_state" = "completed success" ]; then
                    [ "$(date +%s)" -ge "$deadline" ] && break
                    dl="$RUNNER_TEMP/natives-dl"
                    rm -rf "$dl" && mkdir -p "$dl"
                    if ( { [ -n "$shell_art" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$shell_art" -D "$dl"; } ||
                         gh run download "$run" -R "$GITHUB_REPOSITORY" -p "natives-linux-x64*-$GITHUB_SHA" -D "$dl" ||
                         gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$GITHUB_SHA" -D "$dl" ) && \
                       find "$dl" -type f -name '*.r2.json' -exec mv {} "$inbox"/ \; && \
                       rm -rf "$dl" && \
                       node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets linux-x64 --exclude-parts mesh && \
                       [ -f "$inbox/$shell_asset" ]; then
                      rm -f "$inbox"/*.r2.json
                      echo "(restored $shell_asset after $((SECONDS - t0)) s: run $run)"
                      break
                    else
                      echo "warning: failed to restore $shell_asset from run $run; clearing partial inbox"
                      rm -rf "$dl" "$inbox"
                      mkdir -p "$inbox"
                    fi
                  fi
                  case "$shell_state" in
                    "completed success")
                      echo "pipeline shell-station job succeeded but $shell_asset was not restored (run $run)"
                      break ;;
                    completed*)
                      echo "pipeline shell-station job ended '$shell_state' (run $run; may be failed, cancelled, or superseded by a newer push)"
                      break ;;
                  esac
                  case "$natives_state" in
                    completed*)
                      echo "pipeline natives ended '$natives_state' (run $run)"
                      break ;;
                  esac
                else
                  case "$shell_state" in
                    "completed success")
                      missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
                      if [ -z "$missing_shell" ]; then
                        echo "(shell-station published after $((SECONDS - t0)) s: run $run)"
                        break
                      fi ;;
                    completed*)
                      missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
                      echo "pipeline shell-station job ended '$shell_state' (run $run) after $((SECONDS - t0)) s"
                      break ;;
                  esac
                  case "$natives_state" in
                    "completed success")
                      missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
                      if [ -z "$missing_shell" ]; then
                        echo "(shell-station published after $((SECONDS - t0)) s: run $run)"
                        break
                      fi ;;
                    completed*)
                      missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
                      echo "pipeline natives ended '$natives_state' (run $run) after $((SECONDS - t0)) s"
                      break ;;
                  esac
                fi
              elif [ $((SECONDS - t0)) -ge 25 ]; then
                echo "no same-SHA pipeline run found after $((SECONDS - t0)) s (e.g. workflow_dispatch); stopping wait"
                break
              fi
              sleep 5
            done
            missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
            missing_reader="$(node scripts/native.ts missing reader:linux-x64)"
          fi

          if [ -f "$inbox/$shell_asset" ]; then missing_shell=""; fi
          if [ -f "$inbox/$reader_asset" ]; then missing_reader=""; fi
          if [ -n "$missing_shell" ]; then
            echo "::error::shell-station:linux-x64 ($shell_key) is not prebuilt and same-SHA pipeline natives did not provide it (run=${run:-none}, state=${shell_state:-${natives_state:-none}}; may have failed, been cancelled/superseded by a newer push, or timed out). Cold-building Rust shell-station does not fit in this 5m job."
            exit 1
          fi
          has_reader=$([ -z "$missing_reader" ] && echo true || echo false)
          echo "has_reader=$has_reader" >> "$GITHUB_OUTPUT"
          echo "shell_missing=false has_reader=$has_reader"

      - name: Build linux-x64 Pion binary, run smoke suite, and stage artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pion-station-bins"
          mkdir -p "$STAGE"
          BIN_PION="$STAGE/stillfail-pion-linux-x64"
          BIN_MB="$STAGE/stillfail-reader-linux-x64"

          bash pion/station/scripts/build.sh linux-x64 "$BIN_PION"
          ls -lh "$BIN_PION"
          ldd "$BIN_PION"

          # Strictly verify max GLIBC symbol version <= 2.28 (never swallow objdump errors).
          objdump_out="$(objdump -T "$BIN_PION")"
          max_glibc="$(printf '%s\n' "$objdump_out" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1 || true)"
          echo "max_glibc=${max_glibc:-none}"
          test -n "$max_glibc"
          ver="${max_glibc#GLIBC_}"
          top="$(printf '%s\n2.28\n' "$ver" | sort -V | tail -n 1)"
          if [ "$top" != "2.28" ]; then
            echo "FAIL: binary requires $max_glibc (> GLIBC_2.28)" >&2
            exit 1
          fi

          "$BIN_PION" --version
          node pion/station/scripts/smoke-stdio.mjs "$BIN_PION"
          "$BIN_PION" --smoke-sqlite "$RUNNER_TEMP/smoke.db"
          "$BIN_PION" --smoke-sql-db "$RUNNER_TEMP/smoke-sql-db.db"
          "$BIN_PION" --smoke-shell "$RUNNER_TEMP/shell-dir"
          "$BIN_PION" --smoke-rc-soak 50000
          mkdir -p "$RUNNER_TEMP/mux-smoke"
          "$BIN_PION" --smoke-mux-churn 10000 "$RUNNER_TEMP/mux-smoke"
          mkdir -p "$RUNNER_TEMP/smoke-readops"
          "$BIN_PION" --smoke-readops "$RUNNER_TEMP/smoke-readops"
          "$BIN_PION" --smoke-sessions-actors-store "$RUNNER_TEMP/smoke-actors-store.db"
          "$BIN_PION" --smoke-parse-codex-num

          chmod +x "$BIN_PION"
          if [ "${{ steps.reader.outputs.has_reader }}" = "true" ]; then
            MB_SRC="$(node scripts/native.ts file reader linux-x64)"
            test -x "$MB_SRC"
            cp "$MB_SRC" "$BIN_MB"
            chmod +x "$BIN_MB"
            ls -lh "$BIN_MB"
            (cd "$STAGE" && sha256sum stillfail-pion-linux-x64 stillfail-reader-linux-x64 > SHA256SUMS)
            cat "$STAGE/SHA256SUMS"
          fi

      - name: Upload Linux binaries artifact (with prebuilt reader)
        if: steps.reader.outputs.has_reader == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pion-station-linux-bins
          path: ${{ runner.temp }}/pion-station-bins
          retention-days: 1

      - name: Upload Pion-only Linux binary (reader deferred to build-linux-reader)
        if: steps.reader.outputs.has_reader != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pion-station-linux-pion
          path: ${{ runner.temp }}/pion-station-bins/stillfail-pion-linux-x64
          retention-days: 1

      - name: Save Zig cache
        if: always() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/zig
          key: pion-station-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station/**') }}

  build-linux-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build-linux
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-linux.outputs.has_reader != 'true' }}
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node

      - name: Download Pion binary from build-linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-pion "$RUNNER_TEMP/pion-station-bins"
          test -f "$RUNNER_TEMP/pion-station-bins/stillfail-pion-linux-x64"
          chmod +x "$RUNNER_TEMP/pion-station-bins/stillfail-pion-linux-x64"

      - name: Acquire MoonBit reader:linux-x64 (reuse same-SHA pipeline natives or build locally)
        id: reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inbox="$RUNNER_TEMP/natives"
          mkdir -p "$inbox"
          echo "STILLFAIL_NATIVE_INBOX=$inbox" >> "$GITHUB_ENV"

          shell_key="$(node scripts/native.ts key shell-station linux-x64)"
          reader_key="$(node scripts/native.ts key reader linux-x64)"
          shell_asset="shell-station-linux-x64-$shell_key.tar.gz"
          reader_asset="reader-linux-x64-$reader_key.tar.gz"
          missing_reader="$(node scripts/native.ts missing reader:linux-x64)"

          run="" reader_state="" natives_state=""
          if [ -n "$missing_reader" ]; then
            echo "reader:linux-x64 not published yet; waiting for same-SHA pipeline reader"
            api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
            t0=$SECONDS
            # Leave >= 120 s in this fresh 5m job to fall back to a local -O0 reader build if pipeline did not run.
            deadline=$(( JOB_END - 120 ))
            while :; do
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                missing_reader="$(node scripts/native.ts missing reader:linux-x64)"
                if [ -z "$missing_reader" ]; then
                  echo "(reader:linux-x64 published after $((SECONDS - t0)) s)"
                  break
                fi
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "pipeline reader not ready after $((SECONDS - t0)) s (run=${run:-none}, reader=${reader_state:-none}, natives=${natives_state:-none}); falling back to local build"
                break
              fi
              [ -n "$run" ] || run="$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)"
              if [ -n "$run" ]; then
                jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" || true)"
                reader_state="$(printf '%s' "$jobs_json" | jq -r '[.jobs[]? | select(.name == "natives-linux-readers (linux-x64)" or .name == "natives-build (linux-x64)" or .name == "natives") | "\(.status) \(.conclusion // "")"] | (map(select(. == "completed success"))[0] // map(select(startswith("completed ") and . != "completed skipped"))[0] // .[0] // empty)' 2>/dev/null || true)"
                natives_state="$(printf '%s' "$jobs_json" | jq -r '[.jobs[]? | select(.name == "natives") | "\(.status) \(.conclusion // "")"] | .[0] // empty' 2>/dev/null || true)"
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  arts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" || true)"
                  reader_art="$(printf '%s' "$arts_json" | jq -r '[.artifacts[]? | select((.expired | not) and (.name == "natives-linux-x64-readers-'"$GITHUB_SHA"'" or .name == "natives-linux-x64-'"$GITHUB_SHA"'" or .name == "natives-'"$GITHUB_SHA"'")) | .name][0] // empty' 2>/dev/null || true)"
                  if [ -n "$reader_art" ] || [ "$reader_state" = "completed success" ]; then
                    [ "$(date +%s)" -ge "$deadline" ] && break
                    dl="$RUNNER_TEMP/natives-dl-readers"
                    rm -rf "$dl" && mkdir -p "$dl"
                    if ( { [ -n "$reader_art" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$reader_art" -D "$dl"; } ||
                         gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-linux-x64-readers-$GITHUB_SHA" -D "$dl" ||
                         gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-linux-x64-$GITHUB_SHA" -D "$dl" ) && \
                       find "$dl" -type f -name '*.r2.json' -exec mv {} "$inbox"/ \; && \
                       rm -rf "$dl" && \
                       node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets linux-x64 --exclude-parts mesh && \
                       [ -f "$inbox/$reader_asset" ]; then
                      rm -f "$inbox"/*.r2.json
                      echo "(restored $reader_asset after $((SECONDS - t0)) s: run $run)"
                      break
                    fi
                    rm -rf "$dl" "$inbox"/*.r2.json
                  fi
                  case "$reader_state" in
                    completed*)
                      echo "pipeline linux reader ended '$reader_state' (run $run)"
                      break ;;
                  esac
                  case "$natives_state" in
                    completed*)
                      echo "pipeline natives ended '$natives_state' (run $run)"
                      break ;;
                  esac
                else
                  case "$reader_state" in
                    completed*)
                      missing_reader="$(node scripts/native.ts missing reader:linux-x64)"
                      echo "pipeline linux reader ended '$reader_state' (run $run) after $((SECONDS - t0)) s"
                      break ;;
                  esac
                  case "$natives_state" in
                    completed*)
                      missing_reader="$(node scripts/native.ts missing reader:linux-x64)"
                      echo "pipeline natives ended '$natives_state' (run $run) after $((SECONDS - t0)) s"
                      break ;;
                  esac
                fi
              elif [ $((SECONDS - t0)) -ge 25 ]; then
                echo "no same-SHA pipeline run found after $((SECONDS - t0)) s (e.g. workflow_dispatch); building reader locally"
                break
              fi
              sleep 5
            done
            missing_reader="$(node scripts/native.ts missing reader:linux-x64)"
          fi

          if [ -f "$inbox/$reader_asset" ]; then missing_reader=""; fi
          # If falling back to a local reader build on a branch where shell-station is also unprebuilt,
          # restore shell-station from the same-SHA pipeline run so reader links without compiling Rust.
          if [ -n "$missing_reader" ] && [ -n "$run" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
            if [ -n "$missing_shell" ] && [ ! -f "$inbox/$shell_asset" ]; then
              dl="$RUNNER_TEMP/natives-dl-shell"
              rm -rf "$dl" && mkdir -p "$dl"
              if (gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-linux-x64-shell-$GITHUB_SHA" -D "$dl" ||
                  gh run download "$run" -R "$GITHUB_REPOSITORY" -p "natives-linux-x64*-$GITHUB_SHA" -D "$dl") && \
                 find "$dl" -type f -name '*.r2.json' -exec mv {} "$inbox"/ \; && \
                 rm -rf "$dl" && \
                 node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets linux-x64 --exclude-parts mesh && \
                 [ -f "$inbox/$shell_asset" ]; then
                rm -f "$inbox"/*.r2.json
                echo "(restored $shell_asset for local reader build: run $run)"
              else
                rm -rf "$dl" "$inbox"/*.r2.json
              fi
            fi
          fi
          if [ -n "$missing_reader" ]; then
            missing_shell="$(node scripts/native.ts missing shell-station:linux-x64)"
            if [ -n "$missing_shell" ] && [ ! -f "$inbox/$shell_asset" ]; then
              echo "::error::reader:linux-x64 ($reader_key) and shell-station:linux-x64 ($shell_key) are both unavailable (run=${run:-none}, reader=${reader_state:-none}); cannot build reader locally without shell-station"
              exit 1
            fi
          fi
          echo "missing=$([ -n "$missing_reader" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "reader_missing=$([ -n "$missing_reader" ] && echo true || echo false)"

      - if: steps.reader.outputs.missing == 'true'
        uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }

      - name: Cache Zig 0.16.0 (when building reader)
        if: steps.reader.outputs.missing == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Zig 0.16.0 (when building reader)
        if: steps.reader.outputs.missing == 'true'
        run: |
          set -euo pipefail
          zbase="$HOME/.cache/pion-station-zig/0.16.0"
          d="$zbase/zig-x86_64-linux-0.16.0"
          if [ ! -x "$d/zig" ]; then
            mkdir -p "$zbase"
            t="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 -o "$t" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $t" | sha256sum -c --quiet
            tar -xf "$t" -C "$zbase"
            rm -f "$t"
          fi
          [ "$("$d/zig" version)" = 0.16.0 ]
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$d" "$d" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"

      - if: steps.reader.outputs.missing == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/stillfail-reader-mbc
            ~/.cache/zig
          key: native-reader-v1-linux-x64-branch-${{ github.sha }}
          restore-keys: |
            native-reader-v1-linux-x64-branch-
            native-reader-v1-natives-harness-main-

      - name: Stage combined Linux binaries artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pion-station-bins"
          BIN_PION="$STAGE/stillfail-pion-linux-x64"
          BIN_MB="$STAGE/stillfail-reader-linux-x64"
          test -x "$BIN_PION"
          if [ "${{ steps.reader.outputs.missing }}" = "true" ]; then
            MB_SRC="$(PATH="$RUNNER_TEMP/zig-bin:$PATH" STATION_READER_OPT=-O0 MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 node scripts/native.ts run reader -- sh -c 'printf "%s" "$STILLFAIL_MB_READER"')"
          else
            MB_SRC="$(node scripts/native.ts file reader linux-x64)"
          fi
          test -x "$MB_SRC"
          cp "$MB_SRC" "$BIN_MB"
          chmod +x "$BIN_MB" "$BIN_PION"
          ls -lh "$BIN_MB"
          (cd "$STAGE" && sha256sum stillfail-pion-linux-x64 stillfail-reader-linux-x64 > SHA256SUMS)
          cat "$STAGE/SHA256SUMS"

      - name: Upload Linux binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: pion-station-linux-bins
          path: ${{ runner.temp }}/pion-station-bins
          retention-days: 1

