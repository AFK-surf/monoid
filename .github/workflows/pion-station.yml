  gate-w8-sessions-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-linux, build-linux-reader]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-linux-reader.result) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/natives

      - name: Download and verify Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-bins "$RUNNER_TEMP/bins"
          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          test "$(realpath "$RUNNER_TEMP/bins/stillfail-pion-linux-x64")" != "$(realpath "$RUNNER_TEMP/bins/stillfail-reader-linux-x64")"

      - name: Run Wave 8 sessions-2 gate (6 runtimes + agents + zero-spawn + dual-engine parity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN_PION="$RUNNER_TEMP/bins/stillfail-pion-linux-x64"
          BIN_MB="$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          pnpm --dir station install --frozen-lockfile --prefer-offline

          check_tap_strict() {
            local label="$1"
            local out="$2"
            printf '%s\n' "$out"
            local t_count p_count
            t_count="$(printf '%s\n' "$out" | sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' | tail -n 1)"
            p_count="$(printf '%s\n' "$out" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' | tail -n 1)"
            if ! test -n "$t_count" || ! test "$t_count" -ge 1 || ! test "$p_count" = "$t_count"; then
              echo "FAIL: $label invalid TAP counts tests='$t_count' pass='$p_count'" >&2
              exit 1
            fi
            grep -qE '^# fail 0$' <<<"$out"
            grep -qE '^# cancelled 0$' <<<"$out"
            grep -qE '^# skipped 0$' <<<"$out"
            grep -qE '^# todo 0$' <<<"$out"
          }

          if ! OUT="$(node scripts/native.ts run mesh runner archive-rs -- env \
            STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" \
            STILLFAIL_READER_ENGINE=pion STILLFAIL_REQUIRE_PION_SESSIONS=1 STILLFAIL_REQUIRE_DUAL_READER=1 \
            node --import ./station/test/setup-env.mjs --test --test-reporter=tap \
            station/test/claude.test.ts \
            station/test/codex.test.ts \
            station/test/cursor.test.ts \
            station/test/dsh.test.ts \
            station/test/pi.test.ts \
            station/test/mb-acp.test.ts \
            station/test/mb-cursor.test.ts \
            station/test/mb-dsh.test.ts \
            station/test/mb-agents-end.test.ts \
            station/test/mb-agents-leave.test.ts \
            station/test/mb-agents-closed.test.ts \
            station/test/reader-sessions-pion-switch.test.ts \
            station/test/settle.test.ts \
            station/test/mb-active-jobs.test.ts \
            station/test/live-locate-hints.test.ts \
            station/test/remote-run-bounded.test.ts \
            station/test/remote-task-workspace.test.ts \
            station/test/remote-run-index.test.ts 2>&1)"; then
            printf '%s\n' "$OUT"
            exit 1
          fi
          check_tap_strict "gate-w8-sessions-2 suites" "$OUT"

