  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [c-shims, pion-unit, build-linux, build-linux-reader, gate-workers, gate-sqlite-w14, gate-sqlite-w5, gate-w6-locate-search, gate-w6-usage, gate-w6-replica, gate-w7-front, gate-w7-data-1, gate-w7-data-2, gate-w7-serve, gate-w8-foundation, gate-w8-sessions-1, gate-w8-sessions-2, gate-w8-sessions-3]
    if: always()
    steps:
      - name: Require all upstream jobs to succeed
        env:
          R_CSHIMS: ${{ needs.c-shims.result }}
          R_UNIT: ${{ needs.pion-unit.result }}
          R_BUILD: ${{ needs.build-linux.result }}
          R_READER: ${{ needs.build-linux-reader.result }}
          R_WORKERS: ${{ needs.gate-workers.result }}
          R_W14: ${{ needs.gate-sqlite-w14.result }}
          R_W5: ${{ needs.gate-sqlite-w5.result }}
          R_W6_LOCATE_SEARCH: ${{ needs.gate-w6-locate-search.result }}
          R_W6_USAGE: ${{ needs.gate-w6-usage.result }}
          R_W6_REPLICA: ${{ needs.gate-w6-replica.result }}
          R_W7_FRONT: ${{ needs.gate-w7-front.result }}
          R_W7_DATA_1: ${{ needs.gate-w7-data-1.result }}
          R_W7_DATA_2: ${{ needs.gate-w7-data-2.result }}
          R_W7_SERVE: ${{ needs.gate-w7-serve.result }}
          R_W8_FOUNDATION: ${{ needs.gate-w8-foundation.result }}
          R_W8_SESSIONS_1: ${{ needs.gate-w8-sessions-1.result }}
          R_W8_SESSIONS_2: ${{ needs.gate-w8-sessions-2.result }}
          R_W8_SESSIONS_3: ${{ needs.gate-w8-sessions-3.result }}
        run: |
          set -euo pipefail
          echo "c-shims=$R_CSHIMS pion-unit=$R_UNIT build-linux=$R_BUILD build-linux-reader=$R_READER gate-workers=$R_WORKERS gate-sqlite-w14=$R_W14 gate-sqlite-w5=$R_W5 gate-w6-locate-search=$R_W6_LOCATE_SEARCH gate-w6-usage=$R_W6_USAGE gate-w6-replica=$R_W6_REPLICA gate-w7-front=$R_W7_FRONT gate-w7-data-1=$R_W7_DATA_1 gate-w7-data-2=$R_W7_DATA_2 gate-w7-serve=$R_W7_SERVE gate-w8-foundation=$R_W8_FOUNDATION gate-w8-sessions-1=$R_W8_SESSIONS_1 gate-w8-sessions-2=$R_W8_SESSIONS_2 gate-w8-sessions-3=$R_W8_SESSIONS_3"
          if [ "$R_READER" != "success" ] && [ "$R_READER" != "skipped" ]; then
            echo "FAIL: build-linux-reader result is '$R_READER' (expected 'success' or 'skipped')" >&2
            exit 1
          fi
          for r in "$R_CSHIMS" "$R_UNIT" "$R_BUILD" "$R_WORKERS" "$R_W14" "$R_W5" "$R_W6_LOCATE_SEARCH" "$R_W6_USAGE" "$R_W6_REPLICA" "$R_W7_FRONT" "$R_W7_DATA_1" "$R_W7_DATA_2" "$R_W7_SERVE" "$R_W8_FOUNDATION" "$R_W8_SESSIONS_1" "$R_W8_SESSIONS_2" "$R_W8_SESSIONS_3"; do
            if [ "$r" != "success" ]; then
              echo "FAIL: upstream job result is '$r' (expected 'success')" >&2
              exit 1
            fi
          done
