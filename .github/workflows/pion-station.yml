  gate-w6-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-linux, build-linux-reader]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-linux-reader.result) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Download and verify Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-bins "$RUNNER_TEMP/bins"
          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          test "$(realpath "$RUNNER_TEMP/bins/stillfail-pion-linux-x64")" != "$(realpath "$RUNNER_TEMP/bins/stillfail-reader-linux-x64")"

      - name: Run Wave 6 usage-counter and cold-start/hot-reload selection gates
        run: |
          set -euo pipefail
          BIN_PION="$RUNNER_TEMP/bins/stillfail-pion-linux-x64"
          BIN_MB="$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          pnpm --dir station install --frozen-lockfile --prefer-offline

          echo "BIN_PION=$BIN_PION"
          "$BIN_PION" --version

          check_tap_strict() {
            local label="$1"
            local out="$2"
            printf '%s\n' "$out"
            local tests_n pass_n
            tests_n="$(printf '%s\n' "$out" | sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' | tail -n 1)"
            pass_n="$(printf '%s\n' "$out" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' | tail -n 1)"
            if ! grep -qE '^[1-9][0-9]*$' <<<"$tests_n"; then
              echo "FAIL: $label reported invalid test count '$tests_n'" >&2
              exit 1
            fi
            if [ "$pass_n" != "$tests_n" ]; then
              echo "FAIL: $label pass ($pass_n) != tests ($tests_n)" >&2
              exit 1
            fi
            grep -qE '^# fail 0$' <<<"$out"
            grep -qE '^# skipped 0$' <<<"$out"
          }

          COLD_OUT="$(STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" STILLFAIL_REQUIRE_DUAL_READER=1 \
            node --test --test-reporter=tap station/test/w6-selection-coldstart.test.ts)"
          check_tap_strict "w6-selection-coldstart.test.ts" "$COLD_OUT"

          MB_USAGE_OUT="$(STILLFAIL_MB_READER="$BIN_PION" \
            node --test --test-reporter=tap station/test/mb-usage-counter.test.ts)"
          check_tap_strict "mb-usage-counter.test.ts" "$MB_USAGE_OUT"

          TIMING_OUT="$(STILLFAIL_MB_READER="$BIN_PION" \
            node --test --test-reporter=tap station/test/usage-timing-bounded.test.ts)"
          check_tap_strict "usage-timing-bounded.test.ts" "$TIMING_OUT"

          # Deterministic subset of usage-counter.test.ts: exclude the local-snapshot test via --test-skip-pattern
          # (in Node 24.x, excluded tests are not counted in `# skipped`, enforcing strict `# skipped 0`).
          USAGE_OUT="$(STILLFAIL_MB_READER="$BIN_PION" \
            node --test --test-reporter=tap --test-skip-pattern="^on a real station's copy" station/test/usage-counter.test.ts)"
          check_tap_strict "usage-counter.test.ts" "$USAGE_OUT"
          grep -qE '^# tests 46$' <<<"$USAGE_OUT"
          grep -qE '^# pass 46$' <<<"$USAGE_OUT"

          SW_OUT="$(STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" STILLFAIL_REQUIRE_DUAL_READER=1 \
            node --test --test-reporter=tap station/test/builders-usage-pion-switch.test.ts)"
          check_tap_strict "builders-usage-pion-switch.test.ts" "$SW_OUT"

  gate-w6-replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-linux, build-linux-reader]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-linux-reader.result) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Download and verify Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-bins "$RUNNER_TEMP/bins"
          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          test "$(realpath "$RUNNER_TEMP/bins/stillfail-pion-linux-x64")" != "$(realpath "$RUNNER_TEMP/bins/stillfail-reader-linux-x64")"

      - name: Run Wave 6 replica gates (Pion forced 6 suites + dual-engine switch)
        run: |
          set -euo pipefail
          BIN_PION="$RUNNER_TEMP/bins/stillfail-pion-linux-x64"
          BIN_MB="$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          pnpm --dir station install --frozen-lockfile --prefer-offline

          echo "BIN_PION=$BIN_PION"
          VER_OUT="$("$BIN_PION" --version)"
          printf '%s\n' "$VER_OUT"
          MODES_CSV="$(printf '%s\n' "$VER_OUT" | sed -n 's/.*modes:\([^[:space:]]*\).*/\1/p')"
          for m in replica-export replica-restore replica-carry replica-chat; do
            printf ',%s,\n' "$MODES_CSV" | grep -Fq ",$m," || { echo "FAIL: missing exact mode $m in $MODES_CSV" >&2; exit 1; }
          done

          for suite in \
            station/test/mb-replica.test.ts \
            station/test/mb-replica-carry.test.ts \
            station/test/replica-manifest.test.ts \
            station/test/replica-transcript.test.ts \
            station/test/carry-walk-bounded.test.ts; do
            echo "=== Forced Pion suite: $suite ==="
            if ! OUT="$(STILLFAIL_MB_READER="$BIN_PION" node --test --test-reporter=tap "$suite" 2>&1)"; then
              printf '%s\n' "$OUT"
              exit 1
            fi
            printf '%s\n' "$OUT"
            grep -qE '^# tests [1-9]' <<<"$OUT"
            grep -qE '^# skipped 0$' <<<"$OUT"
          done

          echo "=== Pion replica-carry in Retire suite: station/test/replica-retire.test.ts ==="
          # Wrap BIN_PION to prove replica-carry spawns genuinely executed Pion (never silently fell back to MB).
          RETIRE_LOG="$RUNNER_TEMP/retire-pion-spawns.log"
          RETIRE_PION_WRAP="$RUNNER_TEMP/retire-pion-wrap.sh"
          rm -f "$RETIRE_LOG"
          cat > "$RETIRE_PION_WRAP" <<EOF
          #!/bin/sh
          printf '%s\n' "\$*" >> "$RETIRE_LOG"
          exec "$BIN_PION" "\$@"
          EOF
          chmod +x "$RETIRE_PION_WRAP"
          if ! RET_OUT="$(STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$RETIRE_PION_WRAP" STILLFAIL_READER_ENGINE=pion \
            node --test --test-reporter=tap station/test/replica-retire.test.ts 2>&1)"; then
            printf '%s\n' "$RET_OUT"
            exit 1
          fi
          printf '%s\n' "$RET_OUT"
          grep -qE '^# tests [1-9]' <<<"$RET_OUT"
          grep -qE '^# skipped 0$' <<<"$RET_OUT"
          CARRY_SPAWNS="$(grep -c -- '--builder replica-carry' "$RETIRE_LOG" || true)"
          echo "replica-retire Pion replica-carry spawns: $CARRY_SPAWNS"
          test "${CARRY_SPAWNS:-0}" -gt 0

          echo "=== Pion replica-chat through the reader selection: station/test/replica-chat-bounded.test.ts ==="
          # Wrap BIN_PION to prove readChatSoon's spawns genuinely executed Pion (never a hard-coded MB binary).
          CHAT_LOG="$RUNNER_TEMP/chat-pion-spawns.log"
          CHAT_PION_WRAP="$RUNNER_TEMP/chat-pion-wrap.sh"
          rm -f "$CHAT_LOG"
          cat > "$CHAT_PION_WRAP" <<EOF
          #!/bin/sh
