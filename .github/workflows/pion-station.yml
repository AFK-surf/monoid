name: pion-station

on:
  push:
    paths:
      - "pion/station/**"
      - "pion/base/**"
      - "station/mb/src/bindings/**"
      - "station/mb/src/cards/**"
      - "station/mb/src/counts/**"
      - "station/mb/src/footprint/**"
      - "station/mb/src/host/**"
      - "station/mb/src/lookups/**"
      - "station/mb/src/marks/**"
      - "station/mb/src/memory/**"
      - "station/mb/src/packed/**"
      - "station/mb/src/posts/**"
      - "station/mb/src/reader/main.mbt"
      - "station/mb/src/signin/**"
      - "station/mb/src/sql/**"
      - "station/mb/src/usagefill/**"
      - "station/mb/src/widgets/**"
      - "station/mb/src/wire/**"
      - "station/src/sessions/footprint.ts"
      - "station/src/sessions/packed-mb.ts"
      - "station/src/sessions/post-block-builder.ts"
      - "station/src/sessions/session-count-builder.ts"
      - "station/src/share/memory-mb.ts"
      - "station/src/share/memory.ts"
      - "station/src/ops/paths.ts"
      - "station/src/read/archive-mark-builder.ts"
      - "station/src/read/card-posts-builder.ts"
      - "station/src/read/mb-reader.ts"
      - "station/src/read/pool.ts"
      - "station/src/read/reader-select.ts"
      - "station/src/read/requested-builder.ts"
      - "station/src/read/session-bindings-builder.ts"
      - "station/src/read/widget-sources-builder.ts"
      - "station/src/rig/main.ts"
      - "station/src/services.ts"
      - "station/src/store/archive-mark-index.ts"
      - "station/src/store/card-post-index.ts"
      - "station/src/store/post-blocks.ts"
      - "station/src/store/session-bindings-index.ts"
      - "station/src/store/session-counts.ts"
      - "station/src/store/usage-15m.ts"
      - "station/src/store/usage-compact.ts"
      - "station/src/store/usage-retire.ts"
      - "station/src/store/widget-sources.ts"
      - "station/src/usage/module.ts"
      - "station/src/vault/signin-save-builder.ts"
      - "station/src/vault/signin-save-index.ts"
      - "station/test/builders-core-pion-switch.test.ts"
      - "station/test/footprint-reference.ts"
      - "station/test/mb-archive-marks.test.ts"
      - "station/test/mb-card-posts.test.ts"
      - "station/test/mb-footprint.test.ts"
      - "station/test/mb-lookups.test.ts"
      - "station/test/mb-packed.test.ts"
      - "station/test/mb-post-blocks.test.ts"
      - "station/test/mb-session-bindings.test.ts"
      - "station/test/mb-session-counts.test.ts"
      - "station/test/mb-signin-save.test.ts"
      - "station/test/mb-usage-retire.test.ts"
      - "station/test/mb-widget-sources.test.ts"
      - "station/test/reader-contract-builders.test.ts"
      - "station/test/reader-contract-footprint.test.ts"
      - "station/test/reader-contract-packed.test.ts"
      - "station/test/footprint-mounts.ts"
      - "station/test/reader-contract-select.test.ts"
      - "station/test/reader-config-select.test.ts"
      - "station/test/footprint-pion-switch.test.ts"
      - "station/test/reader-contract-memory.test.ts"
      - "station/test/mb-memory-merge.test.ts"
      - "station/test/mb-share-skills.test.ts"
      - "station/test/memory-pion-switch.test.ts"
      - "station/test/memory-program.ts"
      - "station/test/packed-pion-switch.test.ts"
      - "station/test/reference/backfill/archive-mark-index.ts"
      - "station/test/reference/backfill/card-post-index.ts"
      - "station/test/reference/backfill/legacy-closed-cards.ts"
      - "station/test/reference/backfill/legacy-people-since.ts"
      - "station/test/reference/backfill/post-blocks.ts"
      - "station/test/reference/backfill/session-bindings-index.ts"
      - "station/test/reference/backfill/session-counts.ts"
      - "station/test/reference/backfill/signin-save-index.ts"
      - "station/test/reference/backfill/usage-retire.ts"
      - "station/test/reference/backfill/widget-sources.ts"
      - "station/test/reference/memory-merge.ts"
      - "station/test/reference/share-skills.ts"
      - "station/test/reference/packed.ts"
      - "station/test/reference/workspace-archive.ts"
      - ".github/workflows/pion-station.yml"
  workflow_dispatch:

concurrency:
  group: pion-station-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  c-shims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/node

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Validate toolchain pin, scripts, and stdio smoke harness self-test
        run: |
          sha="$(sed -n 's/[[:space:]]*#.*$//; /^[[:space:]]*$/d; p; q' pion/station/TOOLCHAIN | tr -d '[:space:]')"
          test "${#sha}" -eq 40
          sh -n pion/station/scripts/ensure-pionc.sh
          bash -n pion/station/scripts/build.sh
          node pion/station/scripts/smoke-stdio-test.mjs

      - name: C shims strict compile, ASan/UBSan, TSan, and win32-x64 cross-compile
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test"
          "$RUNNER_TEMP/station_sqlite_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test_asan"
          "$RUNNER_TEMP/station_sqlite_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test_tsan"
          "$RUNNER_TEMP/station_sqlite_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test"
          "$RUNNER_TEMP/host_shim_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test_asan"
          "$RUNNER_TEMP/host_shim_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test_tsan"
          "$RUNNER_TEMP/host_shim_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test"
          "$RUNNER_TEMP/footprint_fs_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test_asan"
          "$RUNNER_TEMP/footprint_fs_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test_tsan"
          "$RUNNER_TEMP/footprint_fs_test_tsan"

          # Verify _WIN32 compilation path on every CI run with pinned Zig 0.16.0.
          zbase="$HOME/.cache/pion-station-zig/0.16.0"
          zbin="$zbase/zig-x86_64-linux-0.16.0/zig"
          if [ ! -x "$zbin" ]; then
            mkdir -p "$zbase"
            tmp="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 \
              -o "$tmp" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $tmp" | sha256sum -c --quiet
            tar -xf "$tmp" -C "$zbase"
            rm -f "$tmp"
          fi
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/host_shim/native/station_host.c -o "$RUNNER_TEMP/station_host_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c -o "$RUNNER_TEMP/station_sqlite_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/footprint/native/footprint_fs.c -o "$RUNNER_TEMP/footprint_fs_win.o"

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify access to AFK-surf/pion and AFK-surf/pion-packages (fail loudly on missing PION_TOKEN)
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            exit 0
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion.git HEAD >/dev/null 2>&1 && \
             GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion-packages.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::AFK-surf/pion or AFK-surf/pion-packages is private and PION_TOKEN is not configured in AFK-surf/monoid repository secrets. Configure a read-only PION_TOKEN covering both repos so pion-station CI runs real pionc checks instead of skipping."
          exit 1

      - name: Cache pinned Pion toolchain
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Cache Zig compilation artifacts
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: pion-station-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station/**') }}
          restore-keys: pion-station-zig-cache-linux-x64-0.16.0-

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Ensure pinned pionc toolchain
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          ENV_OUT="$(sh pion/station/scripts/ensure-pionc.sh --print-env)" || exit $?
          eval "$ENV_OUT"
          echo "$(dirname "$PIONC")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC" >> "$GITHUB_ENV"
          echo "PION_QBE=$PION_QBE" >> "$GITHUB_ENV"
          echo "PION_TOOLCHAIN_DIR=$PION_TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "PION_RT_DIR=$PION_RT_DIR" >> "$GITHUB_ENV"
          "$PIONC" --version

      - name: Pion fmt, check, and unit tests
        run: |
          "$PIONC" fmt --check pion/station
          "$PIONC" check --json pion/station
          "$PIONC" test --json pion/station

      # (the footprint tests mount a tmpfs in a user namespace, which Ubuntu 24.04's AppArmor keeps from a user's)
      - run: sudo -n sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      # (the footprint switch test runs this commit's MoonBit reader too: on a branch that changes station/mb it is not
      # in the release, only its pipeline's run artifact, so it is built here as natives builds a branch's)
      - name: Whether this commit's MoonBit reader is prebuilt
        id: reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing="$(node scripts/native.ts missing reader:linux-x64)"
          echo "missing=$([ -n "$missing" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.reader.outputs.missing == 'true'
        uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc', farview: 'false' }
      - name: Zig 0.16.0 for the reader (UBSan off at -O0, as natives)
        if: steps.reader.outputs.missing == 'true'
        run: |
          zbase="$HOME/.cache/pion-station-zig/0.16.0"
          d="$zbase/zig-x86_64-linux-0.16.0"
          if [ ! -x "$d/zig" ]; then
            mkdir -p "$zbase"
            t="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 -o "$t" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $t" | sha256sum -c --quiet
            tar -xf "$t" -C "$zbase"
            rm -f "$t"
          fi
          [ "$("$d/zig" version)" = 0.16.0 ]
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$d" "$d" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
      # (the reader's units natives compiled for this branch, where it ran before this job)
      - if: steps.reader.outputs.missing == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/stillfail-reader-mbc
          key: mbui-reader-linux-branch-v2-${{ github.sha }}
          restore-keys: mbui-reader-linux-branch-v2-

      - name: Build linux-x64 with real libstillfail_shell.a and run smoke suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/stillfail-pion-linux-x64"
          bash pion/station/scripts/build.sh linux-x64 "$BIN"
          ls -lh "$BIN"
          ldd "$BIN"

          # Strictly verify max GLIBC symbol version <= 2.28 (never swallow objdump errors).
          objdump_out="$(objdump -T "$BIN")"
          max_glibc="$(printf '%s\n' "$objdump_out" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1 || true)"
          echo "max_glibc=${max_glibc:-none}"
          test -n "$max_glibc"
          ver="${max_glibc#GLIBC_}"
          top="$(printf '%s\n2.28\n' "$ver" | sort -V | tail -n 1)"
          if [ "$top" != "2.28" ]; then
            echo "FAIL: binary requires $max_glibc (> GLIBC_2.28)" >&2
            exit 1
          fi

          "$BIN" --version
          node pion/station/scripts/smoke-stdio.mjs "$BIN"
          "$BIN" --smoke-sqlite "$RUNNER_TEMP/smoke.db"
          "$BIN" --smoke-sql-db "$RUNNER_TEMP/smoke-sql-db.db"
          "$BIN" --smoke-shell "$RUNNER_TEMP/shell-dir"
          "$BIN" --smoke-rc-soak 50000

          # Black-box 0-diff contract gate for `--builder footprint` & `--builder memory`.
          pnpm --dir station install --frozen-lockfile --prefer-offline
          node --test station/test/reader-contract-select.test.ts station/test/reader-config-select.test.ts
          STILLFAIL_READER_CANDIDATE="$BIN" node --test station/test/reader-contract-footprint.test.ts
          STILLFAIL_MB_READER="$BIN" node --test station/test/mb-footprint.test.ts
          # (a branch's reader, where it is built here: by the zig above, -O0 in units of 8 MB, as natives on GitHub's runners)
          PATH="$RUNNER_TEMP/zig-bin:$PATH" MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 node scripts/native.ts run reader -- env STILLFAIL_PION_READER="$BIN" node --test station/test/footprint-pion-switch.test.ts
          STILLFAIL_READER_CANDIDATE="$BIN" node --test station/test/reader-contract-memory.test.ts
          STILLFAIL_MB_READER="$BIN" node --test station/test/mb-memory-merge.test.ts
          STILLFAIL_MB_READER="$BIN" node --test station/test/mb-share-skills.test.ts
          STILLFAIL_PION_READER="$BIN" node --test station/test/memory-pion-switch.test.ts

          # Black-box 0-diff contract gate for `--builder packed`.
          STILLFAIL_READER_CANDIDATE="$BIN" node --test station/test/reader-contract-packed.test.ts
          STILLFAIL_MB_READER="$BIN" node --test station/test/mb-packed.test.ts
          PATH="$RUNNER_TEMP/zig-bin:$PATH" MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 node scripts/native.ts run reader -- env STILLFAIL_PION_READER="$BIN" node --test station/test/packed-pion-switch.test.ts

          # Black-box 0-diff contract gate for all 10 `builders_core` SQLite builders + real dual-engine production switch.
          STILLFAIL_MB_READER="$BIN" node -e 'import { resolve } from "node:path"; import { mbReaderBinary } from "./station/src/read/mb-reader.ts"; const got = mbReaderBinary(); const want = resolve(process.env.STILLFAIL_MB_READER); if (got !== want) { console.error("mbReaderBinary mismatch:", { got, want }); process.exit(1); }'
          PATH="$RUNNER_TEMP/zig-bin:$PATH" MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 node scripts/native.ts run reader -- env STILLFAIL_READER_CANDIDATE="$BIN" STILLFAIL_REQUIRE_DUAL_READER=1 node --test station/test/reader-contract-builders.test.ts
          STILLFAIL_MB_READER="$BIN" node --test \
            station/test/mb-archive-marks.test.ts \
            station/test/mb-session-bindings.test.ts \
            station/test/mb-session-counts.test.ts \
            station/test/mb-signin-save.test.ts \
            station/test/mb-post-blocks.test.ts \
            station/test/mb-usage-retire.test.ts \
            station/test/mb-widget-sources.test.ts \
            station/test/mb-card-posts.test.ts \
            station/test/mb-lookups.test.ts
          PATH="$RUNNER_TEMP/zig-bin:$PATH" MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 node scripts/native.ts run reader -- env STILLFAIL_PION_READER="$BIN" node --test station/test/builders-core-pion-switch.test.ts

      - name: Save Zig cache
        if: always() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/zig
          key: pion-station-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station/**') }}
