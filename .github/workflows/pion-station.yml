          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
