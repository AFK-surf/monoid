    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install station dependencies for TS isRig parity test
        run: pnpm --dir station install --frozen-lockfile --prefer-offline

      - name: Run launcher Rust tests and build debug binary for parity guards
        run: |
          cargo test --manifest-path station/native/launcher/Cargo.toml
          cargo build --manifest-path station/native/launcher/Cargo.toml

      - name: Run W10-0 isolation, workflow paths, cross-engine parity, and static guard tests
        env:
          STILLFAIL_LAUNCHER: ${{ github.workspace }}/station/native/launcher/target/debug/stillfail-station
        run: |
          node --experimental-strip-types --test station/test/w10-0-station-pion-guards.test.ts
          node scripts/mesh-base.ts
          python3 scripts/ci-timeouts.py
