name: pion-station-main

on:
  push:
    paths:
      - "pion/station-main/**"
      - "pion/station/TOOLCHAIN"
      - "pion/station/scripts/ensure-pionc.sh"
      - "pion/station/packages/host_shim/**"
      - "pion/station/packages/sqlite_ffi/**"
      - "pion/station/packages/sql_db/**"
      - "pion/station/packages/js_json/**"
      - "pion/station/packages/jscase/**"
      - "pion/station/packages/nodepath/**"
      - "pion/station/packages/station_conv/**"
      - "pion/station/packages/builders_core/**"
      - "pion/station/packages/admit/**"
      - "pion/station/packages/live_wire/**"
      - "pion/station/packages/pieces/**"
      - "pion/rules/packages/**"
      - "pion/base/packages/base_codec/**"
      - "client/shell/**"
      - "client/Cargo.toml"
      - "client/Cargo.lock"
      - "libs/mesh-transport/**"
      - "vendor/**"
      - "client/i18n/catalog/zh/station.json"
      - "client/i18n/catalog/en/station.json"
      - "client/i18n/brand.ts"
      - "station/native/launcher/**"
      - "station/test/w10-0-station-pion-guards.test.ts"
      - "scripts/native.ts"
      - "scripts/check.sh"
      - "scripts/mesh-base.ts"
      - "scripts/ci-timeouts.py"
      - ".github/workflows/pion-station-main.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: pion-station-main-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  pion-main-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shell_missing: ${{ steps.shell-check.outputs.missing }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node

      - name: Check whether shell-station targets are prebuilt
        id: shell-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! missing="$(node scripts/native.ts missing shell-station:linux-x64 shell-station:linux-arm64 shell-station:win32-x64)"; then
            echo "warning: native.ts missing check failed; falling back to wait-shell"
            missing="unknown"
          fi
          echo "missing=$([ -n "$missing" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "shell-station missing=${missing:-none}"

      - name: Verify access to AFK-surf/pion and AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            exit 0
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion.git HEAD >/dev/null 2>&1 && \
             GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion-packages.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::AFK-surf/pion or AFK-surf/pion-packages is private and PION_TOKEN is not configured."
          exit 1

      - name: Cache pinned Pion toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Ensure pinned pionc toolchain
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          ENV_OUT="$(sh pion/station/scripts/ensure-pionc.sh --print-env)" || exit $?
          eval "$ENV_OUT"
          echo "$(dirname "$PIONC")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC" >> "$GITHUB_ENV"
          "$PIONC" --version

      - name: Pion fmt, check, and unit tests
        run: |
          bash -n pion/station-main/scripts/build.sh
          "$PIONC" fmt --check pion/station-main
          "$PIONC" check --json pion/station-main
          "$PIONC" test --json pion/station-main

  c-sys-shims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run station_sys C11 tests (Plain, ASan+UBSan, TSan)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          HOST_C="pion/station/packages/host_shim/native/station_host.c"
          SYS_C="pion/station-main/packages/station_sys/native/station_sys.c"
          TEST_C="pion/station-main/packages/station_sys/native/station_sys_test.c"

          cc -std=c11 -O2 -Wall -Wextra -Werror "$HOST_C" "$SYS_C" "$TEST_C" -lpthread -lutil -o "$WORK/test_plain"
          "$WORK/test_plain"

          cc -std=c11 -O1 -g -fno-omit-frame-pointer -Wall -Wextra -Werror -fsanitize=address,undefined "$HOST_C" "$SYS_C" "$TEST_C" -lpthread -lutil -o "$WORK/test_asan"
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 "$WORK/test_asan"

          cc -std=c11 -O1 -g -fno-omit-frame-pointer -Wall -Wextra -Werror -fsanitize=thread "$HOST_C" "$SYS_C" "$TEST_C" -lpthread -lutil -o "$WORK/test_tsan"
          TSAN_OPTIONS=halt_on_error=1 "$WORK/test_tsan"

  c-sys-shims-macos:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run station_sys C11 tests on macOS (Plain, ASan+UBSan, TSan)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          HOST_C="pion/station/packages/host_shim/native/station_host.c"
          SYS_C="pion/station-main/packages/station_sys/native/station_sys.c"
          TEST_C="pion/station-main/packages/station_sys/native/station_sys_test.c"
          MAC_LIBS="-lpthread -framework CoreServices -framework CoreFoundation -framework Foundation"

          cc -std=c11 -O2 -Wall -Wextra -Werror "$HOST_C" "$SYS_C" "$TEST_C" $MAC_LIBS -o "$WORK/test_plain"
          "$WORK/test_plain"

          cc -std=c11 -O1 -g -fno-omit-frame-pointer -Wall -Wextra -Werror -fsanitize=address,undefined "$HOST_C" "$SYS_C" "$TEST_C" $MAC_LIBS -o "$WORK/test_asan"
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 "$WORK/test_asan"

          cc -std=c11 -O1 -g -fno-omit-frame-pointer -Wall -Wextra -Werror -fsanitize=thread "$HOST_C" "$SYS_C" "$TEST_C" $MAC_LIBS -o "$WORK/test_tsan"
          TSAN_OPTIONS=halt_on_error=1 "$WORK/test_tsan"

  c-sys-shims-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run station_sys C11 tests on Windows (MinGW gcc -Wall -Wextra -Werror)
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          HOST_C="pion/station/packages/host_shim/native/station_host.c"
          SYS_C="pion/station-main/packages/station_sys/native/station_sys.c"
          TEST_C="pion/station-main/packages/station_sys/native/station_sys_test.c"

          gcc -std=c11 -O2 -Wall -Wextra -Werror "$HOST_C" "$SYS_C" "$TEST_C" -lws2_32 -liphlpapi -lpsapi -lkernel32 -o "$WORK/test_win.exe"
          "$WORK/test_win.exe"

  wait-shell:
    needs: [pion-main-unit]
    if: ${{ !cancelled() && needs.pion-main-unit.result == 'success' && needs.pion-main-unit.outputs.shell_missing == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node
      - name: Wait for same-SHA pipeline shell-station targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          bash scripts/with-timeout.sh @$((JOB_END - 10)) bash -euo pipefail -c '
            api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
            if ! missing="$(node scripts/native.ts missing shell-station:linux-x64 shell-station:linux-arm64 shell-station:win32-x64)"; then
              echo "warning: initial native.ts missing failed; watching all 3 targets"
              missing="shell-station:linux-x64 shell-station:linux-arm64 shell-station:win32-x64"
            fi
            if [ -z "$missing" ]; then
              echo "all shell-station targets already published"
              exit 0
            fi
            targets=()
            for part in $missing; do
              targets+=("${part#shell-station:}")
            done
            echo "waiting for same-SHA pipeline shell-station targets: ${targets[*]}"
            t0=$SECONDS
            run=""
            while :; do
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                if missing_now="$(node scripts/native.ts missing shell-station:linux-x64 shell-station:linux-arm64 shell-station:win32-x64)" && [ -z "$missing_now" ]; then
                  echo "(all shell-station targets published after $((SECONDS - t0)) s)"
                  exit 0
                fi
              fi
              [ -n "$run" ] || run="$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" ".workflow_runs[0].id // empty" || true)"
              if [ -n "$run" ]; then
                jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" || true)"
                natives_state="$(printf "%s" "$jobs_json" | jq -r "[.jobs[]? | select(.name == \"natives\") | \"\(.status) \(.conclusion // \"\")\"] | .[0] // empty" 2>/dev/null || true)"
                arts_json=""
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  arts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" || true)"
                fi
                remaining=()
                for target in "${targets[@]}"; do
                  st="$(printf "%s" "$jobs_json" | jq -r "[.jobs[]? | select(.name == \"natives-build ($target · shell)\" or .name == \"natives-build ($target)\") | \"\(.status) \(.conclusion // \"\")\"] | (map(select(. == \"completed success\"))[0] // map(select(startswith(\"completed \") and . != \"completed skipped\"))[0] // .[0] // empty)" 2>/dev/null || true)"
                  if [ "$GITHUB_REF" != refs/heads/main ]; then
                    art="$(printf "%s" "$arts_json" | jq -r "[.artifacts[]? | select((.expired | not) and .name == \"natives-$target-shell-$GITHUB_SHA\") | .name][0] // empty" 2>/dev/null || true)"
                    if [ -n "$art" ] || [ "$st" = "completed success" ]; then
                      continue
                    fi
                  else
                    if missing_t="$(node scripts/native.ts missing "shell-station:$target")" && [ -z "$missing_t" ]; then
                      continue
                    fi
                  fi
                  case "$st" in
                    "completed success")
                      # main only: release listing may lag briefly after job completion; keep polling
                      remaining+=("$target") ;;
                    completed*)
                      # Drop failed/cancelled/skipped target so healthy targets still finish and each build job reports its own status.
                      echo "::warning::same-SHA pipeline shell-station:$target ended '\''$st'\'' (run $run); dropping from pre-wait" ;;
                    *)
                      # If the aggregate natives job already completed (e.g. skipped or target was not planned), stop waiting on it.
                      case "$natives_state" in
                        completed*)
                          echo "pipeline natives ended '\''$natives_state'\'' with shell-station:$target unplanned (run $run); dropping from pre-wait" ;;
                        *)
                          remaining+=("$target") ;;
                      esac ;;
                  esac
                done
                if [ "${#remaining[@]}" -eq 0 ]; then
                  echo "(all watched shell-station targets settled after $((SECONDS - t0)) s: run $run)"
                  exit 0
                fi
                targets=("${remaining[@]}")
              elif [ $((SECONDS - t0)) -ge 25 ]; then
                echo "no same-SHA pipeline run found after $((SECONDS - t0)) s (e.g. workflow_dispatch); continuing to build jobs"
                exit 0
              fi
              sleep 5
            done
          '
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "wait-shell reached job budget; handing off cleanly to build jobs"
            exit 0
          fi
          exit "$rc"

  build-linux-x64:
    needs: [pion-main-unit, wait-shell]
    if: ${{ !cancelled() && needs.pion-main-unit.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.wait-shell.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/node

      - name: Cache pinned Pion toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Cache Zig compilation artifacts
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: pion-station-main-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station-main/**') }}
          restore-keys: pion-station-main-zig-cache-linux-x64-0.16.0-

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Acquire shell-station:linux-x64 (wait for same-SHA pipeline natives when missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="linux-x64"
          inbox="$RUNNER_TEMP/natives"
          mkdir -p "$inbox"
          echo "STILLFAIL_NATIVE_INBOX=$inbox" >> "$GITHUB_ENV"

          shell_key="$(node scripts/native.ts key shell-station "$target")"
          shell_asset="shell-station-$target-$shell_key.tar.gz"
          missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
          run="" natives_state=""
          if [ -n "$missing_shell" ]; then
            echo "shell-station:$target not published yet; waiting for same-SHA pipeline natives"
            api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
            t0=$SECONDS
            # Leave >= 40 s for R2 restore (~6 s), build.sh (~5-18 s, capped at JOB_END-15), and cache save (~2 s).
            deadline=$(( JOB_END - 40 ))
            while :; do
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
                [ -z "$missing_shell" ] && break
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              [ -n "$run" ] || run="$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)"
              if [ -n "$run" ]; then
                natives_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "natives-build ('"$target"' · shell)" or .name == "natives-build ('"$target"')" or .name == "natives") | "\(.status) \(.conclusion // "")"] | (map(select(. == "completed success"))[0] // map(select(startswith("completed ") and . != "completed skipped"))[0] // .[0] // empty)' || true)"
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  shell_art="$(api "actions/runs/$run/artifacts?per_page=100" '[.artifacts[] | select((.expired | not) and .name == "natives-'"$target"'-shell-'"$GITHUB_SHA"'") | .name][0] // empty' || true)"
                  if [ -n "$shell_art" ]; then
                    [ "$(date +%s)" -ge "$deadline" ] && break
                    if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$shell_art" -D "$inbox" && \
                       node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets "$target" && \
                       [ -f "$inbox/$shell_asset" ]; then
                      echo "(restored $shell_asset from $shell_art after $((SECONDS - t0)) s: run $run)"
                      break
                    fi
                    rm -rf "$inbox" && mkdir -p "$inbox"
                  fi
                  case "$natives_state" in
                    "completed success")
                      [ "$(date +%s)" -ge "$deadline" ] && break
                      if ! ( (gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$target-shell-$GITHUB_SHA" -D "$inbox" ||
                             gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$target-$GITHUB_SHA" -D "$inbox" ||
                             gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$GITHUB_SHA" -D "$inbox") && \
                            node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets "$target"); then
                        rm -rf "$inbox" && mkdir -p "$inbox"
                      fi
                      break ;;
                    completed*) break ;;
                  esac
                else
                  case "$natives_state" in
                    completed*)
                      missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
                      break ;;
                  esac
                fi
              elif [ $((SECONDS - t0)) -ge 25 ]; then
                break
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              sleep 5
            done
            missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
          fi
          [ -f "$inbox/$shell_asset" ] && missing_shell=""
          if [ -n "$missing_shell" ]; then
            echo "::error::shell-station:$target ($shell_key) is not prebuilt and same-SHA pipeline natives did not provide it (run=${run:-none}, state=${natives_state:-none})."
            exit 1
          fi

      - name: Build and verify stillfail-station-pion (linux-x64)
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/stillfail-station-pion-linux-x64"
          bash scripts/with-timeout.sh @$((JOB_END - 15)) env PION_REQUIRE_PINNED=1 bash pion/station-main/scripts/build.sh linux-x64 "$BIN"
          ls -lh "$BIN"
          ldd "$BIN"
          objdump_out="$(objdump -T "$BIN")"
          max_glibc="$(printf '%s\n' "$objdump_out" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1 || true)"
          echo "max_glibc=${max_glibc:-none}"
          test -n "$max_glibc"
          ver="${max_glibc#GLIBC_}"
          top="$(printf '%s\n2.28\n' "$ver" | sort -V | tail -n 1)"
          if [ "$top" != "2.28" ]; then
            echo "FAIL: binary requires $max_glibc (> GLIBC_2.28)" >&2
            exit 1
          fi
          out="$("$BIN" --version)"
          echo "$out"
          test "$out" = "stillfail-station-pion 0.1.0 roles: commands:"
          sys_out="$("$BIN" --smoke-sys)"
          echo "$sys_out"
          printf '%s\n' "$sys_out" | grep -q '"ok":true'
          http_out="$("$BIN" --smoke-http)"
          echo "$http_out"
          printf '%s\n' "$http_out" | grep -q '"ok":true'
          set +e
          "$BIN" --unknown >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Save Zig cache
        if: always() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/zig
          key: pion-station-main-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station-main/**') }}

  build-linux-arm64:
    needs: [pion-main-unit, wait-shell]
    if: ${{ !cancelled() && needs.pion-main-unit.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.wait-shell.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/node

      - name: Cache pinned Pion toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Cache Zig compilation artifacts
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: pion-station-main-zig-cache-linux-arm64-0.16.0-${{ hashFiles('pion/station-main/**') }}
          restore-keys: pion-station-main-zig-cache-linux-arm64-0.16.0-

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Acquire shell-station:linux-arm64 (wait for same-SHA pipeline natives when missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="linux-arm64"
          inbox="$RUNNER_TEMP/natives"
          mkdir -p "$inbox"
          echo "STILLFAIL_NATIVE_INBOX=$inbox" >> "$GITHUB_ENV"

          shell_key="$(node scripts/native.ts key shell-station "$target")"
          shell_asset="shell-station-$target-$shell_key.tar.gz"
          missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
          run="" natives_state=""
          if [ -n "$missing_shell" ]; then
            echo "shell-station:$target not published yet; waiting for same-SHA pipeline natives"
            api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
            t0=$SECONDS
            # Leave >= 40 s for R2 restore (~6 s), build.sh (~5-18 s, capped at JOB_END-15), and cache save (~2 s).
            deadline=$(( JOB_END - 40 ))
            while :; do
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
                [ -z "$missing_shell" ] && break
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              [ -n "$run" ] || run="$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)"
              if [ -n "$run" ]; then
                natives_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "natives-build ('"$target"' · shell)" or .name == "natives-build ('"$target"')" or .name == "natives") | "\(.status) \(.conclusion // "")"] | (map(select(. == "completed success"))[0] // map(select(startswith("completed ") and . != "completed skipped"))[0] // .[0] // empty)' || true)"
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  shell_art="$(api "actions/runs/$run/artifacts?per_page=100" '[.artifacts[] | select((.expired | not) and .name == "natives-'"$target"'-shell-'"$GITHUB_SHA"'") | .name][0] // empty' || true)"
                  if [ -n "$shell_art" ]; then
                    [ "$(date +%s)" -ge "$deadline" ] && break
                    if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$shell_art" -D "$inbox" && \
                       node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets "$target" && \
                       [ -f "$inbox/$shell_asset" ]; then
                      echo "(restored $shell_asset from $shell_art after $((SECONDS - t0)) s: run $run)"
                      break
                    fi
                    rm -rf "$inbox" && mkdir -p "$inbox"
                  fi
                  case "$natives_state" in
                    "completed success")
                      [ "$(date +%s)" -ge "$deadline" ] && break
                      if ! ( (gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$target-shell-$GITHUB_SHA" -D "$inbox" ||
                             gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$target-$GITHUB_SHA" -D "$inbox" ||
                             gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$GITHUB_SHA" -D "$inbox") && \
                            node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets "$target"); then
                        rm -rf "$inbox" && mkdir -p "$inbox"
                      fi
                      break ;;
                    completed*) break ;;
                  esac
                else
                  case "$natives_state" in
                    completed*)
                      missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
                      break ;;
                  esac
                fi
              elif [ $((SECONDS - t0)) -ge 25 ]; then
                break
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              sleep 5
            done
            missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
          fi
          [ -f "$inbox/$shell_asset" ] && missing_shell=""
          if [ -n "$missing_shell" ]; then
            echo "::error::shell-station:$target ($shell_key) is not prebuilt and same-SHA pipeline natives did not provide it (run=${run:-none}, state=${natives_state:-none})."
            exit 1
          fi

      - name: Cross-build and verify ELF header (linux-arm64)
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/stillfail-station-pion-linux-arm64"
          bash scripts/with-timeout.sh @$((JOB_END - 15)) env PION_REQUIRE_PINNED=1 bash pion/station-main/scripts/build.sh linux-arm64 "$BIN"
          ls -lh "$BIN"
          file "$BIN" | grep -E 'ELF 64-bit.*ARM aarch64'

      - name: Save Zig cache
        if: always() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/zig
          key: pion-station-main-zig-cache-linux-arm64-0.16.0-${{ hashFiles('pion/station-main/**') }}

  build-win32-x64:
    needs: [pion-main-unit, wait-shell]
    if: ${{ !cancelled() && needs.pion-main-unit.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.wait-shell.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/node

      - name: Cache pinned Pion toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Cache Zig compilation artifacts
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: pion-station-main-zig-cache-win32-x64-0.16.0-${{ hashFiles('pion/station-main/**') }}
          restore-keys: pion-station-main-zig-cache-win32-x64-0.16.0-

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Acquire shell-station:win32-x64 (wait for same-SHA pipeline natives when missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="win32-x64"
          inbox="$RUNNER_TEMP/natives"
          mkdir -p "$inbox"
          echo "STILLFAIL_NATIVE_INBOX=$inbox" >> "$GITHUB_ENV"

          shell_key="$(node scripts/native.ts key shell-station "$target")"
          shell_asset="shell-station-$target-$shell_key.tar.gz"
          missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
          run="" natives_state=""
          if [ -n "$missing_shell" ]; then
            echo "shell-station:$target not published yet; waiting for same-SHA pipeline natives"
            api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
            t0=$SECONDS
            # Leave >= 40 s for R2 restore (~6 s), build.sh (~5-18 s, capped at JOB_END-15), and cache save (~2 s).
            deadline=$(( JOB_END - 40 ))
            while :; do
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
                [ -z "$missing_shell" ] && break
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              [ -n "$run" ] || run="$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)"
              if [ -n "$run" ]; then
                natives_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "natives-build ('"$target"' · shell)" or .name == "natives-build ('"$target"')" or .name == "natives") | "\(.status) \(.conclusion // "")"] | (map(select(. == "completed success"))[0] // map(select(startswith("completed ") and . != "completed skipped"))[0] // .[0] // empty)' || true)"
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  shell_art="$(api "actions/runs/$run/artifacts?per_page=100" '[.artifacts[] | select((.expired | not) and .name == "natives-'"$target"'-shell-'"$GITHUB_SHA"'") | .name][0] // empty' || true)"
                  if [ -n "$shell_art" ]; then
                    [ "$(date +%s)" -ge "$deadline" ] && break
                    if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$shell_art" -D "$inbox" && \
                       node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets "$target" && \
                       [ -f "$inbox/$shell_asset" ]; then
                      echo "(restored $shell_asset from $shell_art after $((SECONDS - t0)) s: run $run)"
                      break
                    fi
                    rm -rf "$inbox" && mkdir -p "$inbox"
                  fi
                  case "$natives_state" in
                    "completed success")
                      [ "$(date +%s)" -ge "$deadline" ] && break
                      if ! ( (gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$target-shell-$GITHUB_SHA" -D "$inbox" ||
                             gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$target-$GITHUB_SHA" -D "$inbox" ||
                             gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$GITHUB_SHA" -D "$inbox") && \
                            node scripts/native-handoff.mjs get "$inbox" "$GITHUB_SHA" --targets "$target"); then
                        rm -rf "$inbox" && mkdir -p "$inbox"
                      fi
                      break ;;
                    completed*) break ;;
                  esac
                else
                  case "$natives_state" in
                    completed*)
                      missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
                      break ;;
                  esac
                fi
              elif [ $((SECONDS - t0)) -ge 25 ]; then
                break
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              sleep 5
            done
            missing_shell="$(node scripts/native.ts missing "shell-station:$target")"
          fi
          [ -f "$inbox/$shell_asset" ] && missing_shell=""
          if [ -n "$missing_shell" ]; then
            echo "::error::shell-station:$target ($shell_key) is not prebuilt and same-SHA pipeline natives did not provide it (run=${run:-none}, state=${natives_state:-none})."
            exit 1
          fi

      - name: Cross-build and verify PE header (win32-x64)
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/stillfail-station-pion-win32-x64.exe"
          bash scripts/with-timeout.sh @$((JOB_END - 15)) env PION_REQUIRE_PINNED=1 bash pion/station-main/scripts/build.sh win32-x64 "$BIN"
          ls -lh "$BIN"
          file "$BIN" | grep -E 'PE32\+ executable.*x86-64'

      - name: Save Zig cache
        if: always() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/zig
          key: pion-station-main-zig-cache-win32-x64-0.16.0-${{ hashFiles('pion/station-main/**') }}

  launcher-and-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install station dependencies for TS isRig parity test
        run: pnpm --dir station install --frozen-lockfile --prefer-offline

      - name: Run launcher Rust tests and build debug binary for parity guards
        run: |
          cargo test --manifest-path station/native/launcher/Cargo.toml
          cargo build --manifest-path station/native/launcher/Cargo.toml

      - name: Run W10-0 isolation, workflow paths, cross-engine parity, and static guard tests
        env:
          STILLFAIL_LAUNCHER: ${{ github.workspace }}/station/native/launcher/target/debug/stillfail-station
        run: |
          node --experimental-strip-types --test station/test/w10-0-station-pion-guards.test.ts
          node scripts/mesh-base.ts
          python3 scripts/ci-timeouts.py
