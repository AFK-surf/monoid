                       [ -f "$inbox/$shell_asset" ]; then
                      echo "(restored $shell_asset from $shell_art after $((SECONDS - t0)) s: run $run)"
                      break
                    fi
                    rm -rf "$inbox" && mkdir -p "$inbox"
                  fi
                  case "$natives_state" in
                    "completed success")
