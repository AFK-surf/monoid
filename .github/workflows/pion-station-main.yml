                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  shell_art="$(api "actions/runs/$run/artifacts?per_page=100" '[.artifacts[] | select((.expired | not) and .name == "natives-'"$target"'-shell-'"$GITHUB_SHA"'") | .name][0] // empty' || true)"
                  if [ -n "$shell_art" ]; then
