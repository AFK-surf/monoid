# mbui (libs/ui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The renderer's pixels ("Pixel references belong to one machine"): a Tester's draw list drawn
# offscreen on macos-ci (mbui's runner there, label mbui-render), against its reference (goldens/render/macos-ci-*.png) to
# the byte, on the macOS and GPU the references were made on (goldens/render/macos-ci.txt). The pictures drawn are the
# artifact: what a PR that changes them commits, saying which and why.
name: mbui-render
on:
  pull_request:
    paths:
      - "libs/ui/src/host/apple_render.m"
      - "libs/ui/src/host/apple_text.m"
      - "libs/ui/src/render/**"
      - "libs/ui/src/damage/**"
      - "libs/ui/src/ui/drawlist.mbt"
      - "libs/ui/src/ui/scene.mbt"
      - "libs/ui/src/ui/line.mbt"
      - "libs/ui/tools/chk/pictures.mbt"
      - "libs/ui/src/kitdemo/gallery/dl_print_wbtest.mbt"
      - "libs/ui/src/ui/smooth.mbt"
      - "libs/ui/src/host/corner*"
      - "libs/ui/src/host/contained.h"
      - "libs/ui/src/host/glass_damage.h"
      - "libs/ui/goldens/render/**"
      - "libs/ui/scripts/render_offscreen.sh"
      - ".github/workflows/mbui-render.yml"
  push:
    branches: [main]
    paths:
      - "libs/ui/src/host/apple_render.m"
      - "libs/ui/src/host/apple_text.m"
      - "libs/ui/src/render/**"
      - "libs/ui/src/damage/**"
      - "libs/ui/src/ui/drawlist.mbt"
      - "libs/ui/src/ui/scene.mbt"
      - "libs/ui/src/ui/line.mbt"
      - "libs/ui/tools/chk/pictures.mbt"
      - "libs/ui/src/kitdemo/gallery/dl_print_wbtest.mbt"
      - "libs/ui/src/ui/smooth.mbt"
      - "libs/ui/src/host/corner*"
      - "libs/ui/src/host/contained.h"
      - "libs/ui/src/host/glass_damage.h"
      - "libs/ui/goldens/render/**"
  workflow_dispatch:

concurrency:
  group: mbui-render-${{ github.ref }}
  cancel-in-progress: true


jobs:
  offscreen:
    defaults:
      run:
        working-directory: libs/ui
    # (a machine of ours: never a fork's pull request)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mbui-render]
    timeout-minutes: 5
    steps:
      - name: Clear stale partial-clone filter
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d .git ]; then
            git config --local --unset-all remote.origin.partialclonefilter 2>/dev/null || true
          fi
      - uses: actions/checkout@v5
      - name: Clear lingering partial-clone promisor state
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$(git config --local --get remote.origin.promisor 2>/dev/null || true)" = true ]; then
            head_ref=$(git symbolic-ref -q HEAD || true)
            git for-each-ref --format='%(refname)' | while read -r ref; do
              [ "$ref" = "$head_ref" ] || git update-ref --no-deref -d "$ref"
            done
            git reflog expire --expire=now --all 2>/dev/null || true
            if git rev-list --objects --missing=print HEAD > "$RUNNER_TEMP/rev-list.out" &&
              ! grep -q '^?' "$RUNNER_TEMP/rev-list.out"; then
              G=$(git rev-parse --absolute-git-dir)
              rm -f "$G"/objects/pack/*.promisor
              git config --local --unset-all remote.origin.promisor 2>/dev/null || true
              git config --local --unset-all remote.origin.partialclonefilter 2>/dev/null || true
              git config --local --unset-all extensions.partialclone 2>/dev/null || true
              echo "Cleared lingering partial-clone promisor state"
            fi
            rm -f "$RUNNER_TEMP/rev-list.out"
          fi
      - uses: ./.github/actions/mbui-moonbit
      - name: A Tester's draw list drawn offscreen (scripts/render_offscreen.sh)
        run: scripts/render_offscreen.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        with:
          name: render
          path: libs/ui/out/render/
      - name: The macOS and the GPU the references were made on
        run: |
          for k in system gpu; do
            want=$(sed -n "s/^$k //p" goldens/render/macos-ci.txt)
            have=$(sed -n "s/^$k //p" out/render/machine.txt)
            if [ "$want" != "$have" ]; then
              echo "$k is $have here, the references were made on $want: make them all again in one PR (this run's artifact), saying so"
              exit 1
            fi
          done
      - name: Against the references, to the byte
        run: |
          if cmp -s out/render/controls.png goldens/render/macos-ci-controls.png; then
            echo "the same to the byte"
          else
            echo "goldens/render/macos-ci-controls.png: not what macos-ci draws now (this run's artifact has it)"
            exit 1
          fi
