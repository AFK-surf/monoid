# Untrusted PR code runs only on disposable GitHub-hosted machines, never macos-ci/test station.
name: contributions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    # A fork's pull request, or a run by hand: a branch of this repository has its push's pipeline.yml check the cloud
    # (check-linux), and ran it here a second time on a runner of its own.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install cloud dependencies
        working-directory: cloud
        run: pnpm install --frozen-lockfile
      - name: Generate Worker types
        working-directory: cloud
        run: pnpm run types
      - name: Check cloud types
        working-directory: cloud
        run: pnpm run check
      - name: Test cloud
        working-directory: cloud
        run: pnpm test

  pion-ui-assets:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check pion-ui native assets match libs/ui/src/controls
        run: node pion/tools/mbt2pion-monoid/gen_assets.mjs --check
