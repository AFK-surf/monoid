# The Actions caches a newer one of the same kind replaced, deleted (scripts/chk cache-prune, mbui's tools/chk/
# cache_prune.mbt): the build caches saved each commit, run or content otherwise fill the repository's 10 GB, and GitHub
# then evicts what is read seldom and needed (WARP, the emulator's images, MoonBit), which the jobs that need them fail
# without. After main's runs of the workflows that save them went through, and each half hour: a branch's run, or one
# that failed or was cancelled, started one each (a run every minute, 37% of the repository's runs, 2026-11-17), and a
# newer one takes the place of one still waiting.
name: cache-prune
on:
  workflow_run:
    workflows: [preview, preview-arch, next-mac-cache, mbui-ios, mbui-windows, mbui-check, pipeline]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cache-prune
  cancel-in-progress: true

env:
  # Farview's client, which the app draws a chat's Farview tab with (apps/mbui/scripts/farview.sh: a private repository,
  # read by its deploy key)
  FARVIEW_DEPLOY_KEY: ${{ secrets.FARVIEW_DEPLOY_KEY }}
jobs:
  prune:
    if: github.repository_owner == 'AFK-surf' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            libs/mbui/tools
            libs/mbui/scripts
      - uses: ./.github/actions/mbui-moonbit
      - run: sh libs/mbui/scripts/chk cache-prune
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
