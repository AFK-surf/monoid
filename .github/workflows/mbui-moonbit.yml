# mbui (libs/ui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# MoonBit's latest release put in the Actions cache, once each (by the ETags of this platform's binaries and core): what
# every job's MoonBit is (.github/actions/mbui-moonbit), restored there, never downloaded in a job. Asked each hour; a release
# already in, nothing done. A download that breaks off fails this run alone, the jobs going on with the release before.
name: mbui-moonbit
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/mbui-moonbit.yml"
      - ".github/actions/mbui-moonbit/**"
  # (a change to it tried on its pull request: what it puts in is that pull request's own)
  pull_request:
    paths: *paths


jobs:
  put:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bin: moonbit-linux-x86_64.tar.gz, core: core-latest.tar.gz }
          # (the Linux app's arm64 build: preview.yml's linux job on GitHub's arm64 Ubuntu)
          - { os: ubuntu-24.04-arm, bin: moonbit-linux-aarch64.tar.gz, core: core-latest.tar.gz }
          - { os: macos-15, bin: moonbit-darwin-aarch64.tar.gz, core: core-latest.tar.gz }
          - { os: windows-latest, bin: moonbit-windows-x86_64.zip, core: core-latest.zip }
    env:
      TARGET_ENV: github-hosted
      MOONBIT_BIN: ${{ matrix.bin }}
      MOONBIT_CORE: ${{ matrix.core }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps: &publish-moonbit
      - name: The latest release's ETags
        id: tag
        shell: bash
        run: |
          base=https://cli.moonbitlang.com
          tag=$(
            { curl -fsSI --retry 3 --retry-all-errors --max-time 20 "$base/binaries/latest/$MOONBIT_BIN"
              curl -fsSI --retry 3 --retry-all-errors --max-time 20 "$base/cores/$MOONBIT_CORE"; } \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "etag" { print $2 }' | tr -d '\n'
          )
          [ "$(printf '%s' "$tag" | tr -cd '"' | wc -c | tr -d ' ')" = 4 ] || { echo "::error::no ETags from $base: $tag"; exit 1; }
          echo "key=moonbit-${{ runner.os }}-${{ runner.arch }}-$TARGET_ENV-$(printf '%s' "$tag trimmed" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: had
        with:
          path: ${{ env.CACHE_PATH || format('{0}/moon-ci', runner.tool_cache) }}
          key: ${{ steps.tag.outputs.key }}
          # (also match a fallback key written after a wedged reservation on the primary key)
          restore-keys: ${{ steps.tag.outputs.key }}-
          lookup-only: true
      - name: "Installed (MOON_HOME: moon-ci in the runner's tool cache)"
        if: steps.had.outputs.cache-matched-key == ''
        shell: bash
        run: |
          export MOON_HOME="$RUNNER_TOOL_CACHE/moon-ci"; [ "${{ runner.os }}" != Windows ] || MOON_HOME=$(cygpath -u "$MOON_HOME")
          # (the release the tool cache held is written over: .github/actions/mbui-moonbit restores what is put in)
          rm -f "$MOON_HOME.key"
          if [ "${{ runner.os }}" = Windows ]; then
            MOON_HOME=$(cygpath -w "$MOON_HOME") powershell -NoProfile -Command "irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
          else
            curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          # (without what no job here runs: the docs', the editors' and the coverage's programs, ~40 MB of every job's
          # download of it, ~20 jobs a commit, when GitHub stopped the account's cache downloads: "Egress is over the
          # account limit", 2026-10-30. "trimmed" in the key: a release put in before is put in again so)
          rm -f "$MOON_HOME"/bin/moondoc* "$MOON_HOME"/bin/moon-ide* "$MOON_HOME"/bin/moon-lsp* "$MOON_HOME"/bin/moonbit-lsp* \
            "$MOON_HOME"/bin/moon_cove* "$MOON_HOME"/bin/moonc-prove*
          ls "$MOON_HOME/bin"
          PATH="$MOON_HOME/bin:$PATH" moon version --all
          # (a self-hosted runner's saved from moon-ci-put in its workspace: the path every runner of it asks by,
          # .github/actions/mbui-moonbit)
          if [ "$TARGET_ENV" = self-hosted ]; then rm -rf moon-ci-put && cp -R "$MOON_HOME" moon-ci-put; fi
      - if: steps.had.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATH || format('{0}/moon-ci', runner.tool_cache) }}
          key: ${{ steps.tag.outputs.key }}
      # (put in, or this fails: a save that could not be made is only a warning of actions/cache/save's, run 39533061843's
      # every put green with nothing saved. If a cancelled run left a stale reservation on the primary key — 45436742717
      # timed out on ci-1 and blocked 45443985070 and 45447800112 for an hour — fall back to a run-suffixed key under the
      # same prefix so actions/mbui-moonbit and subsequent hourly checks still find it.)
      - uses: actions/cache/restore@v4
        id: verify
        with:
          path: ${{ env.CACHE_PATH || format('{0}/moon-ci', runner.tool_cache) }}
          key: ${{ steps.tag.outputs.key }}
          restore-keys: ${{ steps.tag.outputs.key }}-
          lookup-only: true
      - if: steps.had.outputs.cache-matched-key == '' && steps.verify.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATH || format('{0}/moon-ci', runner.tool_cache) }}
          key: ${{ steps.tag.outputs.key }}-${{ github.run_id }}
      - if: steps.verify.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATH || format('{0}/moon-ci', runner.tool_cache) }}
          key: ${{ steps.tag.outputs.key }}-${{ github.run_id }}
          lookup-only: true
          fail-on-cache-miss: true
      # Verify the cache with the same action that other jobs use.
      - if: env.TARGET_ENV == runner.environment
        uses: actions/checkout@v4
        with: { sparse-checkout: .github/actions }
      - if: env.TARGET_ENV == runner.environment
        uses: ./.github/actions/mbui-moonbit

  # Publish the self-hosted Mac cache from GitHub too. Uploading its 80 MB from Mini1 timed out.
  put-self-hosted-mac:
    runs-on: macos-26
    timeout-minutes: 5
    env:
      TARGET_ENV: self-hosted
      CACHE_PATH: moon-ci-put
      MOONBIT_BIN: moonbit-darwin-aarch64.tar.gz
      MOONBIT_CORE: core-latest.tar.gz
    outputs:
      key: ${{ steps.tag.outputs.key }}
    steps: *publish-moonbit

  verify-self-hosted-mac:
    needs: put-self-hosted-mac
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mbui-render]
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: moon-ci-put
          key: ${{ needs.put-self-hosted-mac.outputs.key }}
          restore-keys: ${{ needs.put-self-hosted-mac.outputs.key }}-
          lookup-only: true
          fail-on-cache-miss: true
      # Avoid sparse-checkout on this persistent self-hosted runner so it is not tainted with a partial clone.
      - name: Clear stale partial-clone filter
        run: |
          if [ -d .git ]; then
            git config --local --unset-all remote.origin.partialclonefilter 2>/dev/null || true
          fi
      - uses: actions/checkout@v5
      - name: Clear lingering partial-clone promisor state
        run: |
          if [ "$(git config --local --get remote.origin.promisor 2>/dev/null || true)" = true ]; then
            head_ref=$(git symbolic-ref -q HEAD || true)
            git for-each-ref --format='%(refname)' | while read -r ref; do
              [ "$ref" = "$head_ref" ] || git update-ref --no-deref -d "$ref"
            done
            git reflog expire --expire=now --all 2>/dev/null || true
            if git rev-list --objects --missing=print HEAD > "$RUNNER_TEMP/rev-list.out" &&
              ! grep -q '^?' "$RUNNER_TEMP/rev-list.out"; then
              G=$(git rev-parse --absolute-git-dir)
              rm -f "$G"/objects/pack/*.promisor
              git config --local --unset-all remote.origin.promisor 2>/dev/null || true
              git config --local --unset-all remote.origin.partialclonefilter 2>/dev/null || true
              git config --local --unset-all extensions.partialclone 2>/dev/null || true
              echo "Cleared lingering partial-clone promisor state"
            fi
            rm -f "$RUNNER_TEMP/rev-list.out"
          fi
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: '' }
