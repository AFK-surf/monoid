name: Verify monoid hosted native toolchains
on:
  push:
    branches: [diag/monoid-github-native-tools]

permissions:
  contents: read

jobs:
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: runner, target: linux-x64 }
          - { part: runner, target: linux-arm64 }
          - { part: runner, target: win32-x64 }
          - { part: iroh-wasm, target: wasm32 }
          - { part: engine, target: android-arm64 }
    env:
      PART: ${{ matrix.part }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: ./.github/actions/node
      - uses: ./.github/actions/setup-native-linux
        with: { parts: "${{ matrix.part }}:${{ matrix.target }}" }
      - name: Build with the same production recipe
        run: time node scripts/native.ts build "$PART" "$TARGET"
