name: monoid Linux CI on L4ES
on:
  push:
    branches: [diag/monoid-l4es-linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    if: github.ref == 'refs/heads/diag/monoid-l4es-linux'
    runs-on: l4es-amd64
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        crate: [runner, mesh]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Check VM and Rust
        run: |
          uname -sm
          test "$(uname -m)" = x86_64
          nproc
          free -m
          df -h .
          rustc --version
          cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: monoid-l4es-pilot-cargo-v1-${{ matrix.crate }}-${{ hashFiles(format('station/native/{0}/Cargo.lock', matrix.crate)) }}
      - name: Run the station crate checks
        run: time cargo test --locked --manifest-path "station/native/$CRATE/Cargo.toml" -q

  native:
    if: github.ref == 'refs/heads/diag/monoid-l4es-linux'
    runs-on: l4es-amd64
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win32-x64]
    env:
      TARGET: ${{ matrix.target }}
      MBC_UNIT_KB: '8192'
      MBC_INIT_SPLIT: '0'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: ./.github/actions/node
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: mbc }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/zig-0.16.0
          key: zig-linux-x64-0.16.0
      - name: Set up the repository's Zig toolchain
        shell: bash
        run: |
          dir="$RUNNER_TOOL_CACHE/zig-0.16.0/zig-x86_64-linux-0.16.0"
          if [ ! -x "$dir/zig" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE/zig-0.16.0"
            archive="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 -o "$archive" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c --quiet
            tar -xf "$archive" -C "$RUNNER_TOOL_CACHE/zig-0.16.0"
          fi
          test "$("$dir/zig" version)" = 0.16.0
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$dir" "$dir" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
          echo "MBC_STORE=$HOME/.cache/stillfail-reader-mbc" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/stillfail-reader-mbc
            ~/.cache/zig
          key: monoid-l4es-pilot-reader-v1-${{ matrix.target }}-${{ github.sha }}
      - name: Build and check the station reader
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          time node scripts/native.ts build reader "$TARGET"
          binary=$(node scripts/native.ts file reader "$TARGET")
          description=$(file -b "$binary")
          echo "$description"
          case "$TARGET" in
            linux-x64) [[ "$description" == *ELF*x86-64* ]] ;;
            win32-x64) [[ "$description" == *PE32+*x86-64* ]] ;;
          esac

  r2-upload:
    if: github.ref == 'refs/heads/diag/monoid-l4es-linux'
    runs-on: l4es-amd64
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: ./.github/actions/node
      - name: Fetch and stage a published Linux reader
        env:
          GH_TOKEN: ${{ github.token }}
          STILLFAIL_NATIVE_DIRECT_R2: '1'
          ARCHIVE: reader-linux-x64-53770e3e07e70b607a8ab92e.tar.gz
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r2-payload"
          gh release download native-artifacts --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/r2-payload"
          echo "74102794256955f412aba71dbd8f8af816bb942315ce54824c09723c5d59f24c  $RUNNER_TEMP/r2-payload/$ARCHIVE" | sha256sum -c
          wc -c "$RUNNER_TEMP/r2-payload/$ARCHIVE"
          manifest="$RUNNER_TEMP/natives.r2.json"
          time node scripts/native-handoff.mjs put "$RUNNER_TEMP/r2-payload" "$manifest"
          node -e 'const [entry] = require(process.argv[1]); if (!entry?.chunks?.length || !entry.chunks.every(key => key.startsWith("monoid/"))) process.exit(1)' "$manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: l4es-r2-receipt
          path: ${{ runner.temp }}/natives.r2.json
          if-no-files-found: error
          retention-days: 1

  r2-download:
    needs: r2-upload
    runs-on: l4es-amd64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@v4
        with:
          name: l4es-r2-receipt
          path: ${{ runner.temp }}/r2-received
      - name: Download and compare the archive digest
        shell: bash
        run: |
          time node scripts/native-handoff.mjs get "$RUNNER_TEMP/r2-received" "$GITHUB_SHA"
          echo "74102794256955f412aba71dbd8f8af816bb942315ce54824c09723c5d59f24c  $RUNNER_TEMP/r2-received/reader-linux-x64-53770e3e07e70b607a8ab92e.tar.gz" | sha256sum -c
