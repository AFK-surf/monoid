# still.fail's pipeline (docs/operations.md, "CI"), on AFK-surf's Linux runners and self-hosted Macs:
#   a branch: the full check (scripts/check.sh) of what it changes from main, and every part it touches built and
#             bundled (deploy.py --dry-run): evidence for its merge; nothing deployed, no secrets.
#   main:     the full check of what changed since the last deploy (the tag deployed/beta), then what changed of it goes
#             out, the API first: api, then the test channel's web app (app.youdid.wtf), admin, preview and youdid.wtf,
#             its station release (then the configured test station updates to it), its Android app and its desktop app (built
#             and signed on GitHub's macOS runner with the existing certificate).
#             Nothing goes out after a step that fails; the tag moves to the commit once all of it is out.
# The native parts (scripts/native.ts: the station's mesh addon, launcher and runner, the web's iroh, Android's shell
# and engine, the media service's ffmpeg) are prebuilt: the natives job builds those whose key the release
# native-artifacts lacks, on macos-ci, and on main publishes them there; every other job gets them from the release (a
# branch's: from R2 using the receipts in its natives job's run artifact), so a change that is not to a native part compiles no Rust. The mbui
# app's Windows shell and engine are prebuilt on a development Mac instead (node scripts/native.ts prebuild: cross-built,
# put in the releases bucket by their keys) and never built here: windows-natives fetches them and runs the shell's tests.
# Stable: the manual Publish stable workflow. Relay remains manual (deploying it drops every connection).
name: pipeline
on:
  push:
    branches: ["**"]
  workflow_dispatch:
# A branch: only its newest commit matters, a push stops the run before it. main: a run going on finishes (stopped
# halfway, with a merge every few minutes, nothing went out for an hour on 2026-10-02); pushes meanwhile wait as one
# run of the newest, which the tag deployed/beta makes carry what the ones skipped brought.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # Farview's client, which the app draws a chat's Farview tab with (apps/mbui/scripts/farview.sh: a private repository,
  # read by its deploy key)
  FARVIEW_DEPLOY_KEY: ${{ secrets.FARVIEW_DEPLOY_KEY }}
  # The native parts a branch's checks and builds use, split between ci-1 (`BRANCH_NATIVES`: Linux, Windows cross-builds,
  # Wasm and Android) and macos-ci (`BRANCH_MAC_NATIVES`: Apple's darwin-arm64 parts).
  BRANCH_NATIVES: archive-rs:linux-x64 reader:linux-x64 iroh-wasm shell:android-arm64 engine:android-arm64 mesh:linux-x64 runner:linux-x64 launcher:linux-x64 mesh:win32-x64 launcher:win32-x64 runner:win32-x64 screen:win32-x64 agent-desktop:win32-x64
  # Windows' reader, built after natives in a job of its own on ci-1 (natives-win-reader): two readers side by side there,
  # each cold at -O2, took 244-253 s of natives' five minutes and its upload was cut (44208145437, 2026-11-18).
  BRANCH_WIN_READER: reader:win32-x64
  BRANCH_MAC_NATIVES: mesh:darwin-arm64 launcher:darwin-arm64 runner:darwin-arm64 archive-rs:darwin-arm64 reader:darwin-arm64 shell-apple:darwin-arm64 helper:darwin-arm64
jobs:
  # What needs macOS signing/Xcode runs on macos-ci; Rust/MoonBit native builds and the station/core check run on ci-1
  # (falling back to macos-ci when vars.CI_1 == 'off'); horizontal Linux test shards and small deploy jobs run on
  # GitHub's own runners, free for a public repository, not on Blacksmith's (2026-10-15, as asked).
  # GitHub's runners were short once (Actions degraded, 2026-10-05): a job waiting for one held each run 15 minutes and
  # was cancelled, nothing released.
  plan:
    # Trusted repository pushes only. Never add pull_request or pull_request_target here:
    # deployment jobs use production secrets; local signing stays isolated.
    if: github.repository_owner == 'AFK-surf' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      range: ${{ steps.plan.outputs.range }}
      parts: ${{ steps.plan.outputs.parts }}
      api: ${{ steps.plan.outputs.api }}
      static: ${{ steps.plan.outputs.static }}
      relay: ${{ steps.plan.outputs.relay }}
      station: ${{ steps.plan.outputs.station }}
      android_beta: ${{ steps.plan.outputs.android_beta }}
      mac_beta: ${{ steps.plan.outputs.mac_beta }}
      win_beta: ${{ steps.plan.outputs.win_beta }}
      natives: ${{ steps.natives.outputs.natives }}
      natives_mac: ${{ steps.natives.outputs.natives_mac }}
      natives_win_reader: ${{ steps.natives.outputs.natives_win_reader }}
      natives_mac_runner: ${{ steps.natives.outputs.natives_mac_runner }}
      natives_runner: ${{ steps.natives.outputs.natives_runner }}
      natives_win_runner: ${{ steps.natives.outputs.natives_win_runner }}
      windows_natives: ${{ steps.plan.outputs.windows_natives }}
      launcher_windows: ${{ steps.plan.outputs.launcher_windows }}
      kit: ${{ steps.plan.outputs.kit }}
      mbui: ${{ steps.plan.outputs.mbui }}
      comma_ui: ${{ steps.plan.outputs.comma_ui }}
      sf_ui: ${{ steps.plan.outputs.sf_ui }}
      station_tests: ${{ steps.plan.outputs.station_tests }}
      core_tests: ${{ steps.plan.outputs.core_tests }}
      release_smoke: ${{ steps.plan.outputs.release_smoke }}
      check_mac: ${{ steps.plan.outputs.check_mac }}
      check_rust: ${{ steps.plan.outputs.check_rust }}
    steps:
      - run: git config --global http.lowSpeedLimit 1024 && git config --global http.lowSpeedTime 20
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, fetch-tags: true, filter: "blob:none" } # (the history's commits and trees: the range, the paths it changed; a blob read is fetched then)
      - uses: ./.github/actions/node
      - id: plan
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=$(git rev-parse -q --verify "refs/tags/deployed/beta^{commit}" || true)
          else base=$(git merge-base origin/main HEAD); fi
          if [ -n "$base" ]; then range="$base..$GITHUB_SHA"; changed=$(git diff --name-only "$base" "$GITHUB_SHA"); else range=all; changed=$(git ls-files); fi
          # Part by part: scripts/plan.sh.
          printf '%s\n' "$changed" | range=$range bash scripts/plan.sh > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          echo "range $range ($(printf '%s\n' "$changed" | grep -c .) files): $(grep -v '^range=' "$RUNNER_TEMP/plan" | tr '\n' ' ')"
      # Whether the natives jobs have anything to do: a part this run uses that the release native-artifacts lacks (the
      # keys are the sources' hashes: scripts/native.ts). None, and they are skipped. A branch's Apple parts only where
      # a job of its uses them (check-mac, mac-build: station, desktop-build: release_smoke): a part main had not yet
      # published held every branch, a page's or the cloud's too, on natives-mac (2026-11-17).
      - id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ vars.CI_1 }}" = off ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then missing=$(node scripts/native.ts missing)
            else missing=$(node scripts/native.ts missing $BRANCH_NATIVES $BRANCH_WIN_READER $BRANCH_MAC_NATIVES); fi
            echo "missing (all on mac): ${missing:-none}"
            echo "natives=$([ -n "$missing" ] && echo needed || echo ready)" >> "$GITHUB_OUTPUT"
            echo "natives_mac=ready" >> "$GITHUB_OUTPUT"
            echo "natives_win_reader=ready" >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              missing=$(node scripts/native.ts missing --linux)
              missing_mac=$(node scripts/native.ts missing --mac)
              missing_win=""
            else
              missing=$(node scripts/native.ts missing $BRANCH_NATIVES)
              # (only ui-windows uses Windows' reader, and only for a change to the station)
              if grep -qE '^station=true$' "$RUNNER_TEMP/plan"; then missing_win=$(node scripts/native.ts missing $BRANCH_WIN_READER)
              else missing_win=""; fi
              if grep -qE '^(check_mac|station|release_smoke)=true$' "$RUNNER_TEMP/plan"; then missing_mac=$(node scripts/native.ts missing $BRANCH_MAC_NATIVES)
              else missing_mac=""; echo "missing (mac): skipped (no mac job planned)"; fi
            fi
            echo "missing (linux): ${missing:-none}"
            echo "missing (mac): ${missing_mac:-none}"
            echo "missing (Windows' reader): ${missing_win:-none}"
            echo "natives=$([ -n "$missing" ] && echo needed || echo ready)" >> "$GITHUB_OUTPUT"
            echo "natives_mac=$([ -n "$missing_mac" ] && echo needed || echo ready)" >> "$GITHUB_OUTPUT"
            echo "natives_win_reader=$([ -n "$missing_win" ] && echo needed || echo ready)" >> "$GITHUB_OUTPUT"
          fi
          # Where natives-mac builds (its runs-on, as JSON): Mini1's quick runner for main, and for a branch missing
          # mesh or shell-apple (cold builds there took 228 and 323 s before packing). A branch's reader goes on
          # macos-26: station/mb/build.sh compiles it -O0 there (about 25 s), its units kept by mbui-reader-mac-. The
          # lighter parts and every run while vars.MINI1 is 'off' use macos-26.
          if [ "${{ vars.MINI1 }}" != off ] && { [ "$GITHUB_REF" = refs/heads/main ] || printf '%s\n' ${missing_mac:-} | grep -qE '^(mesh|shell-apple):darwin-arm64$'; }; then
            echo 'natives_mac_runner=["self-hosted","quick"]' >> "$GITHUB_OUTPUT"
          else
            echo 'natives_mac_runner="macos-26"' >> "$GITHUB_OUTPUT"
          fi
          # Where natives and natives-win-reader build: a branch missing only readers whose shell-station main already
          # published needs moon, mbc and zig alone (-O0 on GitHub's runner, station/mb/build.sh), so it builds on
          # ubuntu-24.04 and does not wait for ci-1 (a change to station/mb queued while ci-1 was away, #7347).
          if [ "${{ vars.CI_1 }}" != off ] && [ "$GITHUB_REF" != refs/heads/main ] && [ "${missing:-}" = "reader:linux-x64" ] && [ -z "$(node scripts/native.ts missing shell-station:linux-x64)" ]; then
            echo 'natives_runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
          elif [ "${{ vars.CI_1 }}" != off ]; then
            echo 'natives_runner=["self-hosted","ci-1"]' >> "$GITHUB_OUTPUT"
          else
            echo 'natives_runner=["self-hosted","quick"]' >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ vars.CI_1 }}" != off ] && [ "$GITHUB_REF" != refs/heads/main ] && [ -z "$(node scripts/native.ts missing shell-station:win32-x64)" ]; then
            echo 'natives_win_runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
          else
            echo 'natives_win_runner=["self-hosted","ci-1"]' >> "$GITHUB_OUTPUT"
          fi

  # The non-Apple native parts for this commit (scripts/native.ts --linux): Linux, Windows cross-builds, Wasm and Android,
  # built on any of ci-1's runners (falling back to macos-ci's quick runner when vars.CI_1 == 'off'), decoupling
  # check, check-linux, check-station, check-core, bundle, ui-windows, static and android from Mini1. Not linux-quick's
  # alone: one runner, natives waited 16-26 minutes behind one another there while ci-1's others were idle (2026-11-17).
  # STILLFAIL_NATIVE_READERS: the readers built side by side here, among which station/mb/build.sh shares the cores (a
  # branch's: the reader:* of BRANCH_NATIVES; main's three).
  natives:
    needs: plan
    if: needs.plan.outputs.natives == 'needed'
    runs-on: ${{ fromJSON(needs.plan.outputs.natives_runner) }}
    # (a branch's on ci-1 one after its Windows reader there, or before it: natives-win-reader)
    concurrency:
      group: ${{ github.ref != 'refs/heads/main' && needs.plan.outputs.natives_runner != '"ubuntu-24.04"' && format('ci1-branch-readers-{0}', github.run_id) || format('natives-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      contents: write # the release native-artifacts' assets, on main only
      id-token: write # the branch job can stage its native archives in R2
    steps:
      # (when the job is cut, for the build's own limit on GitHub's runner and the reader's units saved after it)
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-mac
      # (the station's reader is MoonBit: scripts/native.ts `reader`, which needs only mbc of mbui's tools)
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }
      # (GitHub's: the pinned Node, and the zig scripts/native.ts builds Linux and Windows with, kept in the Actions
      # cache by its version, with what it compiled of its own (glibc's and MinGW's stubs, compiler-rt) in ~/.cache/zig)
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/node
      - if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/zig-0.16.0
          key: zig-linux-x64-0.16.0
      - name: Zig 0.16.0 (the reader's cc on GitHub's Linux)
        if: runner.environment != 'self-hosted'
        run: |
          d="$RUNNER_TOOL_CACHE/zig-0.16.0/zig-x86_64-linux-0.16.0"
          if [ ! -x "$d/zig" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE/zig-0.16.0"
            t="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 -o "$t" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $t" | sha256sum -c --quiet
            tar -xf "$t" -C "$RUNNER_TOOL_CACHE/zig-0.16.0"
            rm -f "$t"
          fi
          [ "$("$d/zig" version)" = 0.16.0 ]
          # (zig cc at -O0 puts UBSan in every unit, which station/mb/build.sh turns off only for moonbit_init: each
          # unit several times slower to compile. Off here for the whole reader; a branch's build alone takes it)
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$d" "$d" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
      - if: runner.environment != 'self-hosted'
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-linux-x64-0.16.0-${{ github.job }}
          restore-keys: zig-cache-linux-x64-0.16.0-
      - name: Get or build the native parts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUNNER: ${{ runner.environment }}
        run: |
          limit=()
          # (GitHub's: the reader's C split into a few units of 8 MB (MBC_UNIT_KB), moonbit_init one (MBC_INIT_SPLIT=0), in
          # a store of the job's own: with no store of units there, a cold build's thousand units of 768 KB did not end in
          # a job's five minutes, and the C whole was one compiler on one core, 115-180 s)
          [ "$GITHUB_RUNNER" = self-hosted ] || { limit=(bash scripts/with-timeout.sh @$((JOB_END - 15))); export MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 MBC_STORE="$RUNNER_TEMP/reader-store"; }
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            export STILLFAIL_NATIVE_READERS=3
          else
            r=$(printf '%s\n' $BRANCH_NATIVES | grep -c '^reader:' || true)
            [ "$r" -ge 1 ] || r=1
            [ "$r" -le 3 ] || r=3
            export STILLFAIL_NATIVE_READERS=$r
          fi
          if [ "${{ vars.CI_1 }}" = off ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              node scripts/native.ts ensure --publish
            else
              node scripts/native.ts ensure --outbox "$RUNNER_TEMP/natives" $BRANCH_NATIVES $BRANCH_WIN_READER $BRANCH_MAC_NATIVES
            fi
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            node scripts/native.ts ensure --linux --publish
          else
            ${limit[@]+"${limit[@]}"} node scripts/native.ts ensure --outbox "$RUNNER_TEMP/natives" $BRANCH_NATIVES
          fi
      - name: Stage native archives in R2
        if: github.ref != 'refs/heads/main'
        run: node scripts/native-handoff.mjs put "$RUNNER_TEMP/natives" "$RUNNER_TEMP/natives.r2.json"
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: "natives-${{ github.sha }}", path: "${{ runner.temp }}/natives.r2.json", if-no-files-found: ignore, retention-days: 7 }
      - if: always() && runner.environment != 'self-hosted' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-linux-x64-0.16.0-${{ github.job }}

  # A branch's Windows reader (BRANCH_WIN_READER), on ci-1 one after natives (the concurrency group both take there), so
  # that the two readers' C does not share its cores and each has a job's five minutes, and beside it on GitHub's
  # runners, each a machine of its own: its archive staged in R2 as natives' are (natives-win-reader-<sha>), for
  # ui-windows. With vars.CI_1 == 'off' natives builds it itself.
  natives-win-reader:
    needs: plan
    if: ${{ !cancelled() && vars.CI_1 != 'off' && github.ref != 'refs/heads/main' && needs.plan.outputs.natives_win_reader == 'needed' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.natives_win_runner) }}
    concurrency:
      group: ${{ needs.plan.outputs.natives_win_runner != '"ubuntu-24.04"' && format('ci1-branch-readers-{0}', github.run_id) || format('natives-win-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # its native archive staged in R2
    steps:
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-linux
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }
      # (GitHub's: the pinned Node, and the zig scripts/native.ts builds Linux and Windows with, kept in the Actions
      # cache by its version, with what it compiled of its own (glibc's and MinGW's stubs, compiler-rt) in ~/.cache/zig)
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/node
      - if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/zig-0.16.0
          key: zig-linux-x64-0.16.0
      - name: Zig 0.16.0 (the reader's cc on GitHub's Linux)
        if: runner.environment != 'self-hosted'
        run: |
          d="$RUNNER_TOOL_CACHE/zig-0.16.0/zig-x86_64-linux-0.16.0"
          if [ ! -x "$d/zig" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE/zig-0.16.0"
            t="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 -o "$t" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $t" | sha256sum -c --quiet
            tar -xf "$t" -C "$RUNNER_TOOL_CACHE/zig-0.16.0"
            rm -f "$t"
          fi
          [ "$("$d/zig" version)" = 0.16.0 ]
          # (zig cc at -O0 puts UBSan in every unit, which station/mb/build.sh turns off only for moonbit_init: each
          # unit several times slower to compile. Off here for the whole reader; a branch's build alone takes it)
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$d" "$d" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
      - if: runner.environment != 'self-hosted'
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-linux-x64-0.16.0-${{ github.job }}
          restore-keys: zig-cache-linux-x64-0.16.0-
      - name: Get or build Windows' reader
        env:
          GH_TOKEN: ${{ github.token }}
          # (one reader here: every core its)
          STILLFAIL_NATIVE_READERS: "1"
          GITHUB_RUNNER: ${{ runner.environment }}
        run: |
          limit=()
          # (GitHub's: the reader's C split into a few units of 8 MB (MBC_UNIT_KB), moonbit_init one (MBC_INIT_SPLIT=0), in
          # a store of the job's own: with no store of units there, a cold build's thousand units of 768 KB did not end in
          # a job's five minutes, and the C whole was one compiler on one core, 115-180 s)
          [ "$GITHUB_RUNNER" = self-hosted ] || { limit=(bash scripts/with-timeout.sh @$((JOB_END - 15))); export MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 MBC_STORE="$RUNNER_TEMP/reader-store"; }
          ${limit[@]+"${limit[@]}"} node scripts/native.ts ensure --outbox "$RUNNER_TEMP/natives" $BRANCH_WIN_READER
      - name: Stage its archive in R2
        run: node scripts/native-handoff.mjs put "$RUNNER_TEMP/natives" "$RUNNER_TEMP/natives-win-reader.r2.json"
      - uses: actions/upload-artifact@v4
        with: { name: "natives-win-reader-${{ github.sha }}", path: "${{ runner.temp }}/natives-win-reader.r2.json", if-no-files-found: ignore, retention-days: 7 }
      - if: always() && runner.environment != 'self-hosted' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-linux-x64-0.16.0-${{ github.job }}

  # A branch's the rest of what main builds on ci-1 (linux-arm64, shell-station), into ci-1's cache,
  # which main's natives job takes them from without holding main's jobs back.
  natives-main:
    needs: [plan, natives, natives-win-reader]
    if: ${{ !cancelled() && needs.plan.outputs.natives == 'needed' && github.ref != 'refs/heads/main' && needs.natives.result == 'success' && needs.natives-win-reader.result != 'failure' && needs.plan.outputs.natives_runner != '"ubuntu-24.04"' }}
    runs-on: ${{ fromJSON(vars.CI_1 != 'off' && '["self-hosted", "linux-ci"]' || '["self-hosted", "macos-ci"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/mbui-moonbit
      - name: Build what main builds besides the branch's (into ci-1's cache)
        env:
          GH_TOKEN: ${{ github.token }}
          # (one reader here, linux-arm64: every core its)
          STILLFAIL_NATIVE_READERS: "1"
        run: |
          if [ "${{ vars.CI_1 }}" = off ]; then
            node scripts/native.ts ensure
          else
            node scripts/native.ts ensure --linux
          fi

  # The Apple native parts (darwin-arm64, ios-arm64, ios-sim-arm64: scripts/native.ts --mac), built only when an Apple
  # native part is missing, where plan's natives_mac_runner says: Mini1's quick runner for main and for a branch's
  # mesh, shell-apple or reader, GitHub's macos-26 for a branch's lighter parts (a branch waited on Mini1 while it was away,
  # 2026-11-17).
  natives-mac:
    needs: plan
    if: vars.CI_1 != 'off' && needs.plan.outputs.natives_mac == 'needed'
    runs-on: ${{ fromJSON(needs.plan.outputs.natives_mac_runner) }}
    timeout-minutes: 5
    permissions:
      contents: write # the release native-artifacts' assets, on main only
      id-token: write # the branch job can stage its native archives in R2
    steps:
      # (when the job is cut, for the build's own limit on GitHub's runner and the reader's units saved after it)
      - run: echo "JOB_END=$(( $(date +%s) + 5 * 60 - 5 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }
      # (GitHub's: the pinned Node, and rustup's Rust the image has, in a target of the job's own; no sccache there)
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/setup
        with: { pnpm: 'false' }
      - if: runner.environment != 'self-hosted'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      # (the reader's compiled MoonBit packages by their content, station/mb/build.sh's MBC_STORE: tens of MB, which
      # take its build from 72 s to about 20. Restored here and saved at the end whatever came of the build, a cut one
      # too: as one step, actions/cache saved nothing of a build cut at the job's five minutes, 134032580996. A branch's,
      # in a few big units of a store of the job's own, keeps none)
      - if: runner.environment != 'self-hosted' && github.ref == 'refs/heads/main'
        id: reader-store
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/stillfail-reader-mbc
          key: mbui-reader-mac-${{ github.sha }}
          restore-keys: mbui-reader-mac-
      # STILLFAIL_NATIVE_READERS: the one reader of the Apple parts, every core its (3 readers' share gave -j 1 on
      # macos-26's 3 cores, 134032580996 cut at its 5 minutes; a branch's compiles -O0 there, station/mb/build.sh).
      - name: Get or build the Apple native parts
        env:
          GH_TOKEN: ${{ github.token }}
          STILLFAIL_NATIVE_READERS: "1"
          GITHUB_RUNNER: ${{ runner.environment }}
        run: |
          limit=()
          # (GitHub's: the reader's C split into a few units of 8 MB (MBC_UNIT_KB), moonbit_init one (MBC_INIT_SPLIT=0), in
          # a store of the job's own: with no store of units there, a cold build's thousand units of 768 KB did not end in
          # a job's five minutes, and the C whole was one compiler on one core, 115-180 s)
          [ "$GITHUB_RUNNER" = self-hosted ] || { limit=(bash scripts/with-timeout.sh @$((JOB_END - 15))); export MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 MBC_STORE="$RUNNER_TEMP/reader-store"; }
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            ${limit[@]+"${limit[@]}"} node scripts/native.ts ensure --mac --publish
          else
            ${limit[@]+"${limit[@]}"} node scripts/native.ts ensure --outbox "$RUNNER_TEMP/natives" $BRANCH_MAC_NATIVES
          fi
      - name: Stage native archives in R2
        if: github.ref != 'refs/heads/main'
        run: node scripts/native-handoff.mjs put "$RUNNER_TEMP/natives" "$RUNNER_TEMP/natives-mac.r2.json"
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: "natives-mac-${{ github.sha }}", path: "${{ runner.temp }}/natives-mac.r2.json", if-no-files-found: ignore, retention-days: 7 }
      - if: always() && runner.environment != 'self-hosted' && github.ref == 'refs/heads/main'
        run: find ~/.cache/stillfail-reader-mbc -name '*.lock' -delete 2>/dev/null || true
      - if: always() && runner.environment != 'self-hosted' && github.ref == 'refs/heads/main' && steps.reader-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/stillfail-reader-mbc
          key: mbui-reader-mac-${{ github.sha }}

  # A branch's the rest of main's Apple parts, into macos-ci's cache, only while vars.MINI1 is 'on': a job queued for
  # macos-ci with Mini1 away held the branch's run in progress, its concurrency group with it (2026-11-17), and a
  # branch's checks need none of it.
  natives-mac-main:
    needs: [plan, natives-mac]
    if: vars.CI_1 != 'off' && vars.MINI1 == 'on' && needs.plan.outputs.natives_mac == 'needed' && github.ref != 'refs/heads/main' && needs.natives-mac.result == 'success'
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/mbui-moonbit
      - name: Build the rest of main's Apple parts (into macos-ci's cache)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native.ts ensure --mac

  # The mbui app's Windows shell and engine (scripts/native.ts `msvc`) are prebuilt, by the prebuild workflow when asked
  # (.github/workflows/prebuild.yml) or on a Mac, and fetched by their keys; nothing else builds them. Here, on GitHub's
  # Windows (no runner of ours is), for a change to what they are made of: both fetched (a key not there fails, saying
  # to run the prebuild workflow), and the shell's tests, built with it, run where it runs.
  windows-natives:
    needs: plan
    if: needs.plan.outputs.windows_natives == 'true'
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      # the keys are git's blobs: the checkout as git has it
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node
      # (the Windows engine and shell in the native cache, as a run before fetched them: a download is not every run's
      # to break off, 39431384793)
      - name: The Windows natives' keys
        id: native-keys
        run: echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: The Windows engine and shell, prebuilt; the shell's tests
        run: |
          node scripts/native.ts fetch engine win32-x64
          shell=$(node scripts/native.ts fetch shell win32-x64)
          for t in "$shell"/tests/*.exe; do echo "== $(basename "$t")"; "$t" --test-threads=2 || exit 1; done

  # The launcher's tests on Windows (station/native/launcher: its unit tests, and tests/windows.rs: an update whose
  # release has another launcher handed over to it under stillfail-station-w, run_windows.rs `renew`), on GitHub's
  # Windows (no runner of ours is), with rustup's Rust the image has and the pinned Node, for a change to it.
  launcher-windows:
    needs: plan
    if: needs.plan.outputs.launcher_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            station/native/launcher/target
          key: launcher-windows-${{ hashFiles('station/native/launcher/Cargo.lock') }}
          restore-keys: launcher-windows-
      - name: The launcher's tests on Windows
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          export STILLFAIL_NODE="$(command -v node)"
          cargo test --manifest-path station/native/launcher/Cargo.toml --locked -- --test-threads=1

  # The desktop's accessibility trees on Windows (station/test/ui-live.test.ts): the agent-desktop.exe a Windows station
  # carries (the native part agent-desktop) driving Notepad through the agents' computer tool, on GitHub's Windows,
  # whose runner has a signed-in person's session as a station's machine does. For a change to the station.
  ui-windows:
    needs: [plan, natives, natives-win-reader]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.station == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      # (the natives' keys are git's blobs: the checkout as git has it)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # The station's reader in MoonBit as Windows stations run it (built on a Mac: station/mb/build.sh).
      - name: The MoonBit reader on Windows
        run: node station/mb/test/smoke.mjs "$(node scripts/native.ts file reader win32-x64)"
      - name: Notepad driven by its tree
        run: |
          (cd station && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          export STILLFAIL_AGENT_DESKTOP="$(node scripts/native.ts file agent-desktop win32-x64)"
          cd station && STILLFAIL_UI_LIVE=1 node --test --test-timeout=120000 test/ui-live.test.ts
      - name: Configuration and state files on Windows
        run: cd station && node --test test/config-file.test.ts test/cloud-state.test.ts test/json-startup.test.ts test/windows-handoff.test.ts
      # Agents under runners on their named pipes, read by Node and by the MoonBit reader (its pipe opened by the shell).
      - name: Runners on Windows
        run: cd station && node ../scripts/native.ts run runner reader -- node --import ./test/setup-env.mjs --test test/runner-windows.test.ts
      # The remote tasks' paths as Windows has them, joined and judged by the MoonBit program (`--sessions --sep \`).
      - name: Remote tasks' paths on Windows
        run: cd station && node ../scripts/native.ts run runner reader -- node --import ./test/setup-env.mjs --test --test-name-pattern='Windows|stays in its task' test/remote.test.ts
      - name: Windows installer handover diagnostics
        run: node --test --test-name-pattern='the Windows installer reports the new process' cloud/test/install-windows.test.ts
      # What the job started that is still running as it ends: the runner's clean-up of them took 52-237 s after the
      # last step of some runs (the rest 2-9 s), the release's job at 282 of its 300 (main 08c83003, 41537791777).
      - name: What it left running
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $since = (Get-Process -Id $PID).StartTime.AddMinutes(-10)
          Get-Process | Where-Object { $_.StartTime -gt $since } | Sort-Object StartTime | Format-Table -AutoSize Id, ProcessName, StartTime, Path | Out-String -Width 200

  # main: the prebuilt natives in the releases bucket's natives/ (what `prebuild --release` put in the release
  # native-artifacts, the prebuild workflow's or a Mac's, copied over: nothing is built here), once the API (which serves
  # natives/) is out. Seconds when the store has them.
  natives-store:
    needs: [plan, api]
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Copy what the store lacks from the release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/native.ts store-sync

  # quick runner (label quick, on macos-ci too) takes only the short jobs everything else waits on: natives (what a run's
  # builds and checks need), and main's done and station-update. Behind the builds in macos-ci's four, natives waited
  # 4-5 minutes, and with it every job of the run, GitHub's too (2026-10-16).
  # No job may take over 5 minutes (2026-10-31, as asked: the aim is 3; 10 since 2026-10-16): one that does is stuck,
  # and on macos-ci it holds one of four runners every run waits on.
  # The full check (scripts/check.sh) in four: station typecheck/MoonBit/Rust and client Rust (check), the few checks
  # that need macOS/Xcode on macos-ci only when their inputs changed (check-mac), the station's tests in slices on Linux
  # runners of their own (check-station), and the rest beside them on Linux (check-linux).
  # check runs on ci-1 only when the Rust it tests changed (plan.sh's check_rust: ci-1's sccache makes its cold
  # builds short); otherwise on GitHub's ubuntu-24.04 with those Rust tests left out (STILLFAIL_SKIP_RUST_TESTS, as
  # where CI's own files changed the check runs whole), what is left there a minute or less: with ci-1's line down,
  # every pull request's check queued until it was cancelled (44383403135).
  check:
    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.natives.result) }}
    runs-on: ${{ fromJSON(needs.plan.outputs.check_rust == 'true' && (vars.CI_1 != 'off' && '["self-hosted", "linux-ci"]' || '["self-hosted", "macos-ci"]') || '"ubuntu-24.04"') }}
    # Usually under 2 minutes, all of it with Rust built anew a few: a test that hangs (one waiting on what never comes,
    # up to its 10 minutes each) held one of macos-ci's four runners for most of an hour, and every run behind it waited
    # (2026-10-16, station/test/mesh-handover.test.ts on branches whose mesh needed a service it did not give).
    timeout-minutes: 5
    env:
      STILLFAIL_CHECK_PART: station core
      STILLFAIL_SKIP_RUST_TESTS: ${{ needs.plan.outputs.check_rust != 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      - if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        uses: ./.github/actions/setup-mac
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/setup
      # (the station's programs in MoonBit: station/mb)
      - uses: ./.github/actions/mbui-moonbit
      # Use the reader built by natives so this test job does not repeat its cold build.
      - uses: ./.github/actions/natives
      # (what passed before at the same inputs, scripts/check.sh's `remembered`: a self-hosted runner keeps its own)
      - if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-check
          key: check-sc-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-sc-${{ runner.os }}-
      - name: Full check (station, core)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv -e '^\.github/workflows/mbui-' -e '^\.github/workflows/preview\.yml$'; then range=all; fi
          # Its guards beside it: the stable release's selection, and (a branch) nothing merged into main taken back by
          # a squash onto a main that moved (scripts/undone.sh), and the changelog's trailers (scripts/changelog.ts: no
          # `Changelog: none`, the parts said).
          python3 -m unittest discover -s .github -p 'test_stable_plan.py' > "$RUNNER_TEMP/stable.log" 2>&1 &
          stable=$!
          mac_prebuild_test=""
          if [ "$RUNNER_OS" = macOS ]; then
            bash .github/test_mac_release_prebuild.sh > "$RUNNER_TEMP/mac-prebuild-test.log" 2>&1 &
            mac_prebuild_test=$!
          fi
          undone=""
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            sh scripts/undone.sh "$(git merge-base HEAD origin/main)" HEAD > "$RUNNER_TEMP/undone.log" 2>&1 &
            undone=$!
          fi
          status=0
          # In the background, so that when the job's time is up the runner's signal (to this shell alone) reaches it too,
          # and it says which steps were still running and where each had got to (it said nothing: 41434693142).
          if [ "$range" = all ]; then sh scripts/check.sh all & else sh scripts/check.sh full "$range" & fi
          check=$!
          trap 'kill -TERM $check 2> /dev/null; wait $check; exit 1' INT TERM
          wait $check || status=1
          if wait $stable; then echo "· stable release selection guards … ok"; else echo "· stable release selection guards … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/stable.log"; status=1; fi
          if [ -n "$mac_prebuild_test" ]; then
            if wait $mac_prebuild_test; then echo "· Mac release prebuild … ok"; else echo "· Mac release prebuild … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/mac-prebuild-test.log"; status=1; fi
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            if node scripts/changelog.ts --refuse "$(git merge-base HEAD origin/main)..HEAD"; then echo "· changelog trailers … ok"; else echo "· changelog trailers … FAILED"; status=1; fi
          fi
          if [ -n "$undone" ]; then
            if wait $undone; then echo "· undoes nothing on main … ok"; else echo "· undoes nothing on main … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/undone.log"; status=1; fi
          fi
          exit $status

  # The few checks only a Mac can run (Swift's still.fail Helper, the iOS crash reports' Objective-C test, and the Mac
  # release prebuild's Mach-O symbol check), run only when one of them or CI's own files changed: main's on macos-ci, a
  # branch's on GitHub's macos-26 (free for a public repository, as many as are asked for), which they need no more of
  # Mini1 than (an ad hoc signature, no keychain): a branch's waited for Mini1 when it was away, and failed with it
  # (2026-11-17). macos-26, not macos-15: the Helper's Package.swift asks for Swift 6.2, Xcode 26's.
  # vars.MINI1 == 'off' puts main's there too.
  check-mac:
    needs: [plan, natives-mac]
    if: ${{ !cancelled() && !failure() && vars.CI_1 != 'off' && needs.plan.result == 'success' && needs.plan.outputs.check_mac == 'true' }}
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && vars.MINI1 != 'off' && '["self-hosted", "macos-ci"]' || '"macos-26"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "${{ (github.ref != 'refs/heads/main' || vars.MINI1 == 'off') && 'blob:none' || '' }}" }
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-mac
      # (GitHub's: the pinned Node, and rustup's Rust the image has, in a target of the job's own; no sccache there)
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/setup
        with: { pnpm: 'false' }
      - if: runner.environment != 'self-hosted'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "RUST_TEST_THREADS=4" >> "$GITHUB_ENV"
      - if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: check-mac-cargo-${{ hashFiles('station/native/launcher/Cargo.lock') }}
          restore-keys: check-mac-cargo-
      - uses: ./.github/actions/natives
      - name: Mac-only checks (helper, iOS crash reports, Mac release prebuild, the launcher on macOS)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if [ "$range" = all ]; then changed=$(git ls-files); else changed=$(git diff --name-only "$range"); fi
          if printf '%s\n' "$changed" | grep '^\.github/' | grep -qv -e '^\.github/workflows/mbui-' -e '^\.github/workflows/preview\.yml$'; then changed=$(git ls-files); fi
          touches() { printf '%s\n' "$changed" | grep -qE "$1"; }
          status=0
          if touches '^(station/native/helper/|vendor/(PermissionFlow|serve-sim)/)'; then
            if node scripts/native.ts path helper > "$RUNNER_TEMP/helper.log" 2>&1; then echo "· Swift: station/native/helper … ok"
            else echo "· Swift: station/native/helper … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/helper.log"; status=1; fi
          fi
          # (its macOS code: a front left from before found by proc_listpids and KERN_PROCARGS2, front.rs)
          if touches '^station/native/launcher/'; then
            if cargo test --manifest-path station/native/launcher/Cargo.toml --locked -q > "$RUNNER_TEMP/launcher.log" 2>&1; then echo "· Rust: station/native/launcher on macOS … ok"
            else echo "· Rust: station/native/launcher on macOS … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/launcher.log"; status=1; fi
          fi
          if touches '^apps/mbui/(src/host/apple_reports\.m|scripts/ios[_-]reports)'; then
            if bash apps/mbui/scripts/ios-reports-test.sh > "$RUNNER_TEMP/ios-reports.log" 2>&1; then echo "· iOS crash reports … ok"
            else echo "· iOS crash reports … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/ios-reports.log"; status=1; fi
          fi
          if touches '^(\.github/(mac-release-prebuild|test_mac_release_prebuild)\.sh$|(apps|libs)/mbui/scripts/mac\.sh$)'; then
            if bash .github/test_mac_release_prebuild.sh > "$RUNNER_TEMP/mac-prebuild.log" 2>&1; then echo "· Mac release prebuild … ok"
            else echo "· Mac release prebuild … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/mac-prebuild.log"; status=1; fi
          fi
          exit $status

  # The part of the full check that needs no Mac (ts) on a Linux runner of its own,
  # so it never waits for one of macos-ci's (2026-10-04: a run's jobs there queued up to 4 minutes behind one
  # another) nor for each other (in one job, Gradle waited for the real-time tests before it). The native parts they
  # use come from the release or this run's natives job (mesh and iroh's relay for linux-x64, Android's shell and
  # engine); what passed before at the same inputs is kept in the Actions cache (scripts/check.sh, `remembered`).
  check-linux:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STILLFAIL_CHECK_PART: ts
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      # (MoonBit for the icons' tool, apps/mbui/tools/icons, when design/icons or what it writes changed)
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/natives
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-check
          key: check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-${{ runner.os }}-
      - name: Full check (ts)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv -e '^\.github/workflows/mbui-' -e '^\.github/workflows/preview\.yml$'; then range=all; fi
          # exec: the runner's signal when the job's time is up goes to this shell alone; so it reaches the check, which
          # says then which steps were still running and where each had got to.
          if [ "$range" = all ]; then exec sh scripts/check.sh all; else exec sh scripts/check.sh full "$range"; fi
      # The station's reader in MoonBit as Linux stations run it (built on a Mac: station/mb/build.sh), against Node's SQLite.
      - name: The MoonBit reader on Linux
        run: node station/mb/test/smoke.mjs "$(node scripts/native.ts file reader linux-x64)"

  # The station's tests (station/test: scripts/check.sh's station-tests), a slice to a job, each on a Linux runner of
  # its own. They ran in `check` on macos-ci, whose four runners are one Mac: 2.3 to 4.1 minutes by what else ran
  # there, and three checks at once went past the job's five (6 of some 18 in half a day, 2026-11-09), with the test
  # files doubled in five days (271 to 581). Measured on these runners (2026-11-10): six slices, 57 to 99 s of tests
  # each, the same whatever else runs; every test passes here as on a Mac (including the Rust station's archive command,
  # archive-rs:linux-x64). More files: more slices (here, in `shard` and in
  # STILLFAIL_STATION_SHARD), not a longer job.
  check-station:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.station_tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STILLFAIL_CHECK_PART: station-tests
      STILLFAIL_STATION_SHARD: ${{ matrix.shard }}/6
      # (four files at a time on its four vCPUs, not Node's three (availableParallelism - 1): much of a slice's time is
      # its files waiting on the MoonBit reader's processes and the model runners' workers, a slot held idle)
      STILLFAIL_NODE_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: The station's tests, slice ${{ matrix.shard }} of 6
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv -e '^\.github/workflows/mbui-' -e '^\.github/workflows/preview\.yml$'; then range=all; fi
          # (exec: the runner's signal when the job's time is up reaches the check, which says what was still running)
          if [ "$range" = all ]; then exec sh scripts/check.sh all; else exec sh scripts/check.sh full "$range"; fi

  # The core's tests (client/core-ts/test: scripts/check.sh's core-tests), a slice to a job on a Linux runner of its
  # own, as the station's. In check-linux beside the rest of ts they ran three files at a time on its 4 vCPUs with the
  # web's and cloud's beside them: 180 to 250 s, then past the job's five minutes as files were added (179 files; main
  # 6045382883, 43272321433, 2026-11-12). More files: more slices (here, in `shard` and STILLFAIL_CORE_SHARD).
  check-core:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.core_tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STILLFAIL_CHECK_PART: core-tests
      STILLFAIL_CORE_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: The core's tests, slice ${{ matrix.shard }} of 3
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv -e '^\.github/workflows/mbui-' -e '^\.github/workflows/preview\.yml$'; then range=all; fi
          if [ "$range" = all ]; then exec sh scripts/check.sh all; else exec sh scripts/check.sh full "$range"; fi

  # The mbui app's check and tests, on native, on Linux: mbui-check.yml, main's there on its own.
  check-mbui:
    needs: plan
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && needs.plan.outputs.mbui == 'true' }}
    uses: ./.github/workflows/mbui-check.yml
    # (at the default rate alone: the rates run on main after the merge, mbui-check.yml's head)
    permissions: { contents: read, actions: read }
    # (its FARVIEW_DEPLOY_KEY: the app's Farview client)
    secrets: inherit
    with: { rates: "no" }

  # Comma's parts' module (libs/comma-ui), on its own beside mbui: detlint, native type-checked, its tests. On main too:
  # nothing runs it after the merge.
  check-comma-ui:
    needs: plan
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.comma_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-moonbit
      - run: bash libs/comma-ui/scripts/check.sh

  # still.fail's component library (libs/sf-ui), on its own beside mbui: detlint, type-checked on native and js, its
  # tests. On main too: nothing runs it after the merge.
  check-sf-ui:
    needs: plan
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.sf_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    env:
      MBC_STORE: ${{ github.workspace }}/libs/sf-ui/_build/native/release/mbc-store
    steps:
      - name: The runner's image
        id: img
        run: echo "img=$(printf '%s' "${ImageVersion:-own}" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ${{ env.MBC_STORE }}
          key: sf-ui-linux-store-${{ steps.img.outputs.img }}-${{ github.sha }}
          restore-keys: |
            sf-ui-linux-store-${{ steps.img.outputs.img }}-
            sf-ui-linux-store-
            mbui-linux-store-app-pkgs-m-${{ steps.img.outputs.img }}-
            mbui-linux-store-app-pkgs-m-
      - run: touch "$RUNNER_TEMP/start"
      - run: bash libs/sf-ui/scripts/check.sh
      - if: github.ref == 'refs/heads/main' && steps.store.outputs.cache-hit != 'true'
        run: |
          sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" "$MBC_STORE"
          find "$MBC_STORE" -name '*.lock' -delete 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.store.outputs.cache-hit != 'true'
        with:
          path: ${{ env.MBC_STORE }}
          key: sf-ui-linux-store-${{ steps.img.outputs.img }}-${{ github.sha }}

  # A branch: what main would deploy, built and bundled beside the check (not after it: the build is most of the run);
  # nothing sent, no secrets.
  bundle:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && (needs.plan.outputs.api == 'true' || needs.plan.outputs.static == 'true') }}
    # On GitHub's runners, not macos-ci: a dry run of half a minute that queued there behind the builds (2026-10-16).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # (the browser's iroh from the native cache, as a run before fetched it: the release's download answered 504
      # twice on 2026-11-08, failing #4761's and #4765's bundle; a part of a key is the same bytes, kept once fetched)
      - name: The browser's iroh's key
        id: native-keys
        run: echo "key=natives-bundle-$(node scripts/native.ts key iroh-wasm wasm32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      # (the app's page, each of the web app's pages: deploy.py builds the app for the browser where MoonBit is)
      - uses: ./.github/actions/mbui-moonbit
      - name: deploy.py --dry-run
        run: sh .github/deploy.sh --dry-run $([ '${{ needs.plan.outputs.api }}' = true ] && echo api) ${{ needs.plan.outputs.parts }}

  # A branch: the TypeScript station's bundle main would release, built with the prebuilt native parts (unsigned,
  # nothing sent). On GitHub's macos-15 (free for a public repository): unsigned, it needs nothing of macos-ci's (main's
  # signed builds stay there, with its keychain). (The apps are mbui's: their builds are this workflow's desktop job's, preview.yml's and mbui-host-mac's.)
  mac-build:
    needs: [plan, natives, natives-mac]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && needs.plan.outputs.station == 'true' }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: The TypeScript station's bundle (darwin-arm64)
        env:
          GH_TOKEN: ${{ github.token }} # read-only API fallback if the public release download fails
        run: |
          pnpm install --frozen-lockfile --prefer-offline > /dev/null
          (cd station && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/station-bundle.sh "$RUNNER_TEMP/station" darwin-arm64
          STATION_BUNDLE="$RUNNER_TEMP/station/stillfail/station" node --disable-warning=ExperimentalWarning --import ./station/test/setup-env.mjs --test --test-timeout=30000 station/test/station-bundle-builders.test.ts
          du -sh "$RUNNER_TEMP/station/stillfail"

  # A branch: the one check main's protection requires (2026-10-20, asked: "main 开保护"; an admin may merge past it,
  # 2026-10-22): every job a branch runs, one skipped as passing, one failed or cancelled failing it. Its list
  # is the branch's jobs: a job added to them goes here too, or the protection does not wait for it.
  gate:
    needs: [plan, natives, natives-win-reader, natives-mac, windows-natives, launcher-windows, ui-windows, check, check-mac, check-linux, check-station, check-core, check-mbui, check-comma-ui, check-sf-ui, bundle, mac-build, mbui-web, static, desktop-build, desktop]
    if: always() && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read # the attempts before this one, their jobs and logs (scripts/gate-rerun-check.mjs)
      contents: read
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::a branch job failed or was cancelled: main's protection keeps this branch out"
            exit 1
          fi
      # A run attempted again goes through only where what failed in the attempts before was GitHub's or the network's
      # (a runner that never came, a checkout, a 504), never a check that failed or ran its time out: those are found and
      # fixed in a new commit, never rerun green (the root AGENTS.md; scripts/gate-rerun-check.mjs says what is which).
      - if: fromJSON(github.run_attempt) > 1
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - if: fromJSON(github.run_attempt) > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gate-rerun-check.mjs

  # The API and the web wait for the checks of what they are made of, not the Android app's (2026-10-17, as asked: its
  # lint on GitHub's runners held a release's web back for minutes); the apps' releases (put) wait for all.
  api:
    needs: [plan, check, check-mac, check-linux, check-station, check-core]
    # Not on the implicit success(): a skipped job before it (natives, when nothing native changed) would
    # skip it too (2026-10-04 to 05: the API was not deployed for a day). The checks it needs passed or were not needed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.api == 'true' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Deploy api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STILLFAIL_ADMIN_EMAIL: ${{ secrets.STILLFAIL_ADMIN_EMAIL }}
          DEPLOY_KEYS_JSON: ${{ secrets.DEPLOY_KEYS_JSON }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          GCP_TELEMETRY_JSON: ${{ secrets.GCP_TELEMETRY_JSON }}
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_JSON: ${{ secrets.APNS_JSON }}
          FCM_SERVICE_ACCOUNT_MORE_JSON: ${{ secrets.MONOID_FCM_SERVICE_ACCOUNT_JSON }}
          APNS_MORE_JSON: ${{ secrets.MONOID_APNS_JSON }}
          APPLE_JSON: ${{ secrets.APPLE_JSON }}
          REVIEW_ACCOUNTS_JSON: ${{ secrets.REVIEW_ACCOUNTS_JSON }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          # Once still.fail's accounts moved into monoid's cloud (the variable CLOUD_MOVED on: workflows/move-cloud.yml),
          # its API forwards there (cloud/src/guests.ts).
          FORWARD_TO: ${{ vars.CLOUD_MOVED == 'on' && 'https://app.monoid.build' || '' }}
          FORWARD_SECRET: ${{ vars.CLOUD_MOVED == 'on' && secrets.CLOUD_FORWARD_SECRET || '' }}
        run: sh .github/deploy.sh api

  # The app for the browser (each of the web's pages: apps/mbui/scripts/web-app.sh), built where MoonBit's cache is
  # (GitHub's runners: macos-ci's runners each have a tool cache of their own, the static job's none of it, run
  # 41173786825) and handed to the static job.
  mbui-web:
    needs: [plan]
    if: ${{ !cancelled() && !failure() && ((github.ref == 'refs/heads/main' && (needs.plan.outputs.static == 'true' || needs.plan.outputs.kit == 'true')) || needs.plan.outputs.release_smoke == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/mbui-moonbit
      - run: bash apps/mbui/scripts/web-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: "mbui-web-${{ github.sha }}", path: web/public/mbui, retention-days: 7 }
      # (the component library's page beside it, what monoid-kit deploys: built after the app, the packages they share
      # compiled once)
      - if: github.ref == 'refs/heads/main' && needs.plan.outputs.kit == 'true'
        run: bash apps/mbui/scripts/kit-web.sh dist/kit
      - if: github.ref == 'refs/heads/main' && needs.plan.outputs.kit == 'true'
        uses: actions/upload-artifact@v4
        with: { name: "mbui-kit-${{ github.sha }}", path: dist/kit, retention-days: 7 }

  static:
    needs: [plan, natives, check, check-mac, check-linux, check-station, check-core, api, mbui-web]
    # After the API (a page may need what it adds), or without it when it did not change.
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.natives.result) && needs.mbui-web.result == 'success' && ((github.ref == 'refs/heads/main' && needs.plan.outputs.static == 'true' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && contains(fromJSON('["success","skipped"]'), needs.api.result)) || needs.plan.outputs.release_smoke == 'true') }}
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the web app's build number (__BUILD__, build.json) is the commits in the history
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # (the app's page, each of the web app's pages: the app as mbui-web built it, which deploy.py takes as it is. Asked again once when
      # GitHub's artifact service is not reached: macos-ci's connection to it reset, the web's deploy failed with the page
      # there, 2026-10-31, 41207363758)
      - id: page
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "mbui-web-${{ github.sha }}", path: web/public/mbui }
      - if: steps.page.outcome == 'failure'
        uses: actions/download-artifact@v4
        with: { name: "mbui-web-${{ github.sha }}", path: web/public/mbui }
      - name: Deploy ${{ needs.plan.outputs.parts }}
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh ${{ needs.plan.outputs.parts }}
      - name: Build the web deployment without publishing
        if: github.ref != 'refs/heads/main'
        run: sh .github/deploy.sh --dry-run web-beta
      - if: github.ref == 'refs/heads/main' && contains(needs.plan.outputs.parts, 'web-beta')
        uses: actions/upload-artifact@v4
        with: { name: "cloud-web-${{ github.sha }}", path: dist/cloud-web, include-hidden-files: true, retention-days: 90 }

  # monoid's cloud (deploy.py CLOUDS: monoid.build, its test channel monoid.zone), in the company's Cloudflare account:
  # the same API and static parts, after still.fail's, as their own jobs (each fits its 5 minutes on its own). Its
  # secrets are its own token, keys.json, Google client and FCM service account (monoid-build's); APNs, PostHog and
  # the Google Cloud telemetry account are still.fail's. Its test channel's site (monoid.zone: website/ named monoid.zone; monoid.build's with the stable release),
  # not still.fail's status page, nor its relay (by hand, as ours).
  # monoid's jobs (monoid-*) run only while the repository's variable MONOID_CI is on (turned off 2026-11-04, as asked).
  monoid-api:
    needs: [plan, api]
    if: ${{ !cancelled() && vars.MONOID_CI == 'on' && github.ref == 'refs/heads/main' && needs.plan.outputs.api == 'true' && needs.api.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Deploy api to monoid
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
          STILLFAIL_ADMIN_EMAIL: ${{ secrets.STILLFAIL_ADMIN_EMAIL }}
          # Once still.fail's accounts moved in (CLOUD_MOVED on: workflows/move-cloud.yml): still.fail's keys, and answered
          # as still.fail too (cloud/src/guests.ts).
          DEPLOY_KEYS_JSON: ${{ vars.CLOUD_MOVED == 'on' && secrets.DEPLOY_KEYS_JSON || secrets.MONOID_DEPLOY_KEYS_JSON }}
          FORWARD_SECRET: ${{ vars.CLOUD_MOVED == 'on' && secrets.CLOUD_FORWARD_SECRET || '' }}
          GUEST_GOOGLE_OAUTH_JSON: ${{ vars.CLOUD_MOVED == 'on' && secrets.GOOGLE_OAUTH_JSON || '' }}
          GOOGLE_OAUTH_JSON: ${{ secrets.MONOID_GOOGLE_OAUTH_JSON || secrets.GOOGLE_OAUTH_JSON }}
          GCP_TELEMETRY_JSON: ${{ secrets.GCP_TELEMETRY_JSON }}
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.MONOID_FCM_SERVICE_ACCOUNT_JSON }}
          APNS_JSON: ${{ secrets.MONOID_APNS_JSON }}
          FCM_SERVICE_ACCOUNT_MORE_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_MORE_JSON: ${{ secrets.APNS_JSON }}
          APPLE_JSON: ${{ secrets.APPLE_JSON }}
          REVIEW_ACCOUNTS_JSON: ${{ secrets.REVIEW_ACCOUNTS_JSON }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: sh .github/deploy.sh api

  monoid-static:
    needs: [plan, static, monoid-api]
    if: ${{ !cancelled() && vars.MONOID_CI == 'on' && github.ref == 'refs/heads/main' && needs.static.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.monoid-api.result) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - id: parts
        run: |
          # (its site's stable one with the stable release, stable.yml; its test channel's, monoid.zone, here)
          parts=$(printf '%s\n' ${{ needs.plan.outputs.parts }} | { grep -vE '^(site|status)$' || true; } | tr '\n' ' ')
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
      - if: steps.parts.outputs.parts != ''
        uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: steps.parts.outputs.parts != ''
        uses: ./.github/actions/setup
      - if: steps.parts.outputs.parts != ''
        uses: ./.github/actions/natives
      - if: steps.parts.outputs.parts != ''
        id: page
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "mbui-web-${{ github.sha }}", path: web/public/mbui }
      - if: steps.parts.outputs.parts != '' && steps.page.outcome == 'failure'
        uses: actions/download-artifact@v4
        with: { name: "mbui-web-${{ github.sha }}", path: web/public/mbui }
      - name: Deploy ${{ steps.parts.outputs.parts }} to monoid
        if: steps.parts.outputs.parts != ''
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh ${{ steps.parts.outputs.parts }}
      - if: contains(steps.parts.outputs.parts, 'web-beta')
        uses: actions/upload-artifact@v4
        with: { name: "monoid-cloud-web-${{ github.sha }}", path: dist/cloud-web, include-hidden-files: true, retention-days: 90 }

  # The component library's page (apps/mbui/scripts/kit-web.sh, as mbui-web built it) on kit.monoid.zone: monoid's
  # alone (the user, 2026-11-13), in monoid's Cloudflare account (cloud/wrangler.kit.jsonc). Needs no check: it reads
  # nothing of anyone's and holds no secret.
  monoid-kit:
    needs: [plan, mbui-web]
    if: ${{ !cancelled() && vars.MONOID_CI == 'on' && github.ref == 'refs/heads/main' && needs.plan.outputs.kit == 'true' && needs.mbui-web.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "mbui-kit-${{ github.sha }}", path: dist/kit }
      - name: Deploy kit to monoid
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: sh .github/deploy.sh kit

  # The test channel's releases are built beside the check (the builds are most of a release: before 2026-10-04 they
  # waited for the check and the API). The apps' files, named by their version, go in the bucket at once (nothing points
  # at them yet); the station's (named the same each time: what installs get) go in at once under staged/, and with
  # every feed they are put by `put` once the check passed and the API is out (scripts/release-put.sh).

  # The station's (darwin-arm64, linux-x64, linux-arm64, win32-x64): what a station on the test channel updates to.
  station:
    needs: [plan, natives, natives-mac]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.station == 'true' }}
    # (GitHub's Mac, as desktop's signing: on Mini1 its four packages, ~150 MB, went up to the bucket over the home
    # line in what was left of its five minutes after 31 s of building, cut there, and took that line from android's
    # upload beside it, cut too: main 44147606865, 2026-11-17)
    runs-on: macos-26
    outputs:
      hand: ${{ steps.hand.outputs.key }}
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # the release's number is the commits in the history
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # (MoonBit for the station's reader, station/mb/build.sh, built here where the natives' cache lacks it: pruned on
      # the runner, the stable's station job of 0487f79c found `moon: command not found` four times, 43616763857)
      - uses: ./.github/actions/mbui-moonbit
      - name: Build the station's release (darwin-arm64, linux-x64, linux-arm64, win32-x64)
        env:
          # (the native parts this commit's natives jobs published, downloaded by scripts/native.ts with GitHub's token)
          GH_TOKEN: ${{ github.token }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID and notary profile (.github/mac_signing.py).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          # The key the release is signed with (scripts/release-sign.ts): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh station
      # Its files into the bucket from here, staged (scripts/release-put.sh --stage): put takes them back.
      - name: Stage its files in the bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --stage "$RUNNER_TEMP/release"
      # (handed to put through the bucket, not a run artifact: scripts/release-put.sh --hand)
      - id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          sh scripts/release-put.sh --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"

  # The Android app (fail.still.android.beta: mbui's, apps/mbui, in the place of the Kotlin one), on android/beta/latest.json.
  android:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.android_beta == 'true' }}
    runs-on: [self-hosted, macos-ci]
    outputs:
      hand: ${{ steps.hand.outputs.key }}
      monoid: ${{ steps.monoid.outputs.packed }}
    environment: production
    timeout-minutes: 5
    steps:
      # (when the job began, for monoid's deadline below)
      - run: echo "JOB_BEGAN=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # versionCode is the commits in the history
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Build and sign the beta Android app
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh android
      # (what it weighs and takes once idle: mbui-size.yml, after this run, recorded, never a gate: its upload's failure
      # is not the release's. Studio's connection to GitHub's artifact service reset stopped a release that had built and
      # signed its APK, main a3e59ea9 43157398296 and three times before on 2026-11-11 and 12)
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: "mbui-apk-${{ github.sha }}", path: "${{ runner.temp }}/release/android/*.apk", retention-days: 1, compression-level: 0 }
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      # (handed to put through the bucket, not a run artifact: scripts/release-put.sh --hand)
      - id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          sh scripts/release-put.sh --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"
      # monoid's (build.monoid.android.beta, the same key): from the same build, in the same warm cache (its native code
      # is this one's; only the package is made again: its id, name and links are in its manifest and resources); put by
      # monoid-android once the check passed. Left for the next release where this job has not the time for it, as
      # desktop-win's: still.fail's was put, and main 43e63e625's was cut at 351 s building monoid's, the job cancelled.
      - name: Build and sign monoid's beta Android app from the same build
        id: monoid
        if: vars.MONOID_CI == 'on'
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/monoid
        run: |
          used=$(( $(date +%s) - JOB_BEGAN ))
          if [ "$used" -gt 200 ]; then
            echo "::warning::monoid's beta Android app left for the next release: this job has used ${used} s of its 300"
            exit 0
          fi
          sh .github/release.sh --product monoid android
          echo "packed=1" >> "$GITHUB_OUTPUT"
      - if: vars.MONOID_CI == 'on' && steps.monoid.outputs.packed == '1'
        uses: actions/upload-artifact@v4
        with: { name: "monoid-android-${{ github.sha }}", path: "${{ runner.temp }}/monoid", retention-days: 1, compression-level: 0 }

  # monoid's beta Android app (build.monoid.android.beta), built by android from its own build, put whole in monoid's
  # bucket once the check passed.
  monoid-android:
    needs: [plan, check, check-mac, check-linux, check-station, check-core, android]
    if: ${{ !cancelled() && vars.MONOID_CI == 'on' && github.ref == 'refs/heads/main' && needs.plan.outputs.android_beta == 'true' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && needs.android.result == 'success' && needs.android.outputs.monoid == '1' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "monoid-android-${{ github.sha }}", path: "${{ runner.temp }}/monoid" }
      - name: Put it in monoid's bucket (its files and deltas, then its feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/monoid" --releases https://app.monoid.build/releases --deadline 150
          sh scripts/release-put.sh "$RUNNER_TEMP/monoid"

  # The Mac app (fail.still.desktop.beta: mbui's, apps/mbui, in the Electron app's place), on mac/beta/latest.json and
  # desktop/stillfail-beta-mac.yml (which moves an installed Electron beta over): built, signed and notarized on the
  # GitHub's Mac, warm from the build caches this job keeps (scripts/release.sh desktop). The beta Windows app, mbui's too, is
  # desktop-win's.
  # monoid's beta Mac app: still.fail's (the desktop job's, handed over as an artifact) renamed, not built again: the same
  # program, Hermes, bytecode and icon, its own Info.plist, program name and updater id (apps/mbui/scripts/mac-app.sh
  # MBUI_MAC_FROM), signed and notarized as monoid.zone, put in monoid's bucket.
  monoid-desktop:
    needs: [plan, check, check-mac, check-linux, check-station, check-core, desktop]
    if: ${{ !cancelled() && vars.MONOID_CI == 'on' && github.ref == 'refs/heads/main' && needs.plan.outputs.mac_beta == 'true' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && needs.desktop.result == 'success' }}
    runs-on: macos-26
    environment: production
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
    steps:
      - run: git config --global http.lowSpeedLimit 1024 && git config --global http.lowSpeedTime 20
      - uses: actions/checkout@v5
      - run: bash scripts/git-history.sh
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "mac-beta-${{ github.sha }}", path: "${{ runner.temp }}/from" }
      - name: Rename, sign and notarize still.fail's beta Mac app as monoid's, and put it in monoid's bucket
        env:
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          MBUI_MAC_FROM=$(find "$RUNNER_TEMP/from" -name 'stillfail-beta-*-arm64-mac.zip' | head -1)
          [ -n "$MBUI_MAC_FROM" ] || { echo "no still.fail beta Mac app handed over" >&2; exit 1; }
          export MBUI_MAC_FROM
          sh .github/release-desktop.sh --product monoid

  desktop-build:
    needs: [plan, natives, natives-mac]
    if: ${{ !cancelled() && !failure() && ((github.ref == 'refs/heads/main' && needs.plan.outputs.mac_beta == 'true') || needs.plan.outputs.release_smoke == 'true') }}
    runs-on: macos-26
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    # (a run by hand compiles what main's store has none of whole: once the units' commands named mbui at libs/mbui,
    # 2026-11-13, none of the store's were theirs, 441 of 831 units, cut at 5 on a push)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    env:
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
    steps:
      # (when the job is cut, its timeout-minutes above, for its build's own limit to the second, scripts/with-timeout.sh;
      # less the 1-5 s of "Set up job" before this step)
      - run: |
          echo "JOB_END=$(( $(date +%s) + ${{ github.event_name == 'push' && 5 || 10 }} * 60 - 5 ))" >> "$GITHUB_ENV"
          echo "MBC_STORE=$RUNNER_TEMP/ci-live/mbc-store" >> "$GITHUB_ENV"
          echo "HBC_CACHE=$RUNNER_TEMP/ci-live/hbc" >> "$GITHUB_ENV"
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 20
      - uses: actions/checkout@v5
      - run: bash scripts/git-history.sh ${{ github.ref == 'refs/heads/main' && 'main' || 'main arch/next' }}
      # (mbc's units and the core's bytecode, and moon's own build below: main's newest, saved by this job on main by what
      # they hold, as preview.yml's jobs keep theirs; stable.yml's Mac app restores them too)
      # mbc still validates the full compiler and every dependency; the prefix just keeps each launcher’s store.
      - name: The Mac C compiler launcher
        id: mac-cc
        run: echo "key=$(shasum -a 256 /usr/bin/cc | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # A branch based on arch/next needs its compiled units too. GitHub makes the branch's own and main's caches
      # available, but not arch/next's; next-mac-cache.yml keeps that branch's on main's ref for this job.
      - id: arch-base
        if: github.ref != 'refs/heads/main'
        run: |
          next=$(git merge-base HEAD origin/arch/next 2>/dev/null || :)
          shared=$(git merge-base origin/main origin/arch/next 2>/dev/null || :)
          if [ -n "$next" ] && [ -n "$shared" ] && [ "$next" != "$shared" ] && git merge-base --is-ancestor "$shared" "$next"; then
            echo "next=true" >> "$GITHUB_OUTPUT"
          fi
      - if: github.ref != 'refs/heads/main'
        run: echo "MBC_LIGHT_TESTS=stillfail/stillfail" >> "$GITHUB_ENV"
      - id: hermes
        run: echo "key=$(grep -E '^HERMES_(RN|APPLE_URL|APPLE_SHA256)=' apps/mbui/scripts/core.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/stillfail-build
            apps/mbui/out/core/hermesc
          key: mbui-hermes-apple-${{ steps.hermes.outputs.key }}
      - uses: ./.github/actions/setup
        with: { pnpm: 'false' }
      - uses: ./.github/actions/natives
      - name: The macOS shell's key
        id: native-keys
        run: echo "key=natives-shell-apple-darwin-arm64-$(node scripts/native.ts key shell-apple darwin-arm64)" >> "$GITHUB_OUTPUT"
      # (saved by main alone, below: a branch that changed the mesh saved it in its Post Run, after its five minutes)
      - uses: actions/cache/restore@v4
        id: shell
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      - if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-
            shell-apple-target-darwin-arm64-
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc chk' }
      # The next build is kept on main's ref too. Take its Moon build first; unlike the content-addressed units,
      # two Moon build directories cannot be overlaid, so fall back to main's only if there is no next build.
      - uses: actions/cache/restore@v4
        id: moon-next
        if: steps.arch-base.outputs.next == 'true'
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
            !apps/mbui/_build/**/*.mbc/**
          key: mbui-next-moon-mac-${{ github.sha }}
          restore-keys: mbui-next-moon-mac-
      - uses: actions/cache/restore@v4
        id: moon
        if: steps.moon-next.outputs.cache-matched-key == ''
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
            !apps/mbui/_build/**/*.mbc/**
          key: mbui-mac-moon-${{ github.sha }}
          restore-keys: mbui-mac-moon-
      # The app's build (its core's native parts, then its Moon build) runs beside pnpm and the icon restore. Started once
      # MoonBit and the old Moon build are restored, not before: its env.sh fetches Farview's client as the MoonBit action
      # does, both into apps/mbui/deps/farview.tmp, each taking the other's away (scripts/farview.sh); its native parts
      # are downloads of a few seconds. The same scripts, target and compiler are used by mac-app.sh below.
      - name: Start the Mac app build
        id: start
        env:
          # the PostHog project the app's core sends what people use to (mac-release-prebuild.sh), as the bundling
          # step below gives it, so that core.hbc is made once
          POSTHOG_JSON: ${{ github.ref == 'refs/heads/main' && secrets.POSTHOG_JSON || '' }}
        run: |
          bash apps/mbui/scripts/moon-mtimes.sh
          touch "$RUNNER_TEMP/start"
          bash .github/mac-release-prebuild.sh start
          bash .github/mac-release-prebuild.sh ready
      # (main's -O2 units: main's own, and a branch's to take where they are what its changed program's would be at -O2,
      # mbc's MBC_LIGHT_TESTS, below)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-mac-cc-${{ steps.mac-cc.outputs.key }}-${{ github.sha }}
          restore-keys: |
            mbui-mac-cc-${{ steps.mac-cc.outputs.key }}-
            mbui-mac-
      # Preserve cache paths and version; the build reads only the separately published ci-live directories.
      - if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-main" .ci/mbc-store
          mv .ci/mbc-store "$RUNNER_TEMP/ci-main/mbc-store"
          rm -rf .ci/hbc
      - uses: actions/cache/restore@v4
        if: steps.arch-base.outputs.next == 'true'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-next-mac-${{ github.sha }}
          restore-keys: mbui-next-mac-
      - uses: actions/cache/restore@v4
        if: github.ref != 'refs/heads/main' && steps.arch-base.outputs.next != 'true'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-ios-${{ github.sha }}
          restore-keys: mbui-ios-
      - if: github.ref != 'refs/heads/main'
        run: |
          if [ "${{ steps.arch-base.outputs.next }}" = true ] && [ -d .ci/mbc-store ]; then
            rsync -a .ci/mbc-store/ "$RUNNER_TEMP/ci-main/mbc-store/"
          fi
          rm -rf .ci/mbc-store
          [ ! -d .ci/hbc ] || mv .ci/hbc "$RUNNER_TEMP/ci-main/hbc"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-mac-cc-b-${{ steps.mac-cc.outputs.key }}-${{ github.sha }}
          restore-keys: mbui-mac-cc-b-${{ steps.mac-cc.outputs.key }}-
      - if: github.ref != 'refs/heads/main'
        run: |
          if [ -d .ci/mbc-store ]; then rsync -a .ci/mbc-store/ "$RUNNER_TEMP/ci-main/mbc-store/"; fi
          rm -rf .ci/mbc-store
          mv "$RUNNER_TEMP/ci-main/mbc-store" .ci/mbc-store
          mkdir -p "$RUNNER_TEMP/ci-main/hbc"
          if [ -d .ci/hbc ]; then rsync -a .ci/hbc/ "$RUNNER_TEMP/ci-main/hbc/"; fi
          rm -rf .ci/hbc
          mv "$RUNNER_TEMP/ci-main/hbc" .ci/hbc
          rm -rf "$RUNNER_TEMP/ci-main"
      - name: Publish complete caches to the build
        run: |
          mkdir -p .ci/mbc-store .ci/hbc "$RUNNER_TEMP/ci-live"
          mv .ci/mbc-store "$MBC_STORE"
          mv .ci/hbc "$HBC_CACHE"
          bash .github/mac-release-prebuild.sh store
      # pnpm and its store only where the core's bytecode is not kept (HBC_CACHE): only a core made here installs the
      # packages (13-15 s of the job; the Node it needs is the first setup's). Asked with the PostHog project the build
      # makes it with (mac-release-prebuild.sh's), so that the key is the build's.
      - id: hbc
        env:
          POSTHOG_JSON: ${{ github.ref == 'refs/heads/main' && secrets.POSTHOG_JSON || '' }}
        run: |
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog-kept.json")
            export STILLFAIL_POSTHOG="$RUNNER_TEMP/posthog-kept.json"
          fi
          unset POSTHOG_JSON
          if bash apps/mbui/scripts/core.sh hermes-kept apple; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
          rm -f "$RUNNER_TEMP/posthog-kept.json"
      - if: steps.hbc.outputs.kept != 'true'
        uses: ./.github/actions/setup
      - run: bash .github/mac-release-prebuild.sh packages
      - uses: actions/cache@v4
        with:
          path: apps/mbui/out/mac/AppIcon-*
          key: mbui-mac-icon-beta-${{ hashFiles('apps/mbui/scripts/mac-icon.swift') }}
      # Reserve the measured post-build chain, including post-actions: 48 seconds (main's cut run took 33 s after it,
      # 44304867702). The same diagnostics and process cleanup apply on main and on a branch.
      - name: Finish the Mac app build
        id: finish
        run: |
          reserve=48
          bash scripts/with-timeout.sh @$((JOB_END - reserve)) bash .github/mac-release-prebuild.sh wait || {
              status=$?
              echo "::error::the Mac app's build not done $(( $(date +%s) - $(stat -f %m "$RUNNER_TEMP/start") )) s after it started; where it had got to:"
              tail -80 "$RUNNER_TEMP/mac-prebuild/log" 2>/dev/null || true
              # (moon's build says nothing till it ends: what it had done, and what was running as it was cut)
              echo "moon's build: $(find apps/mbui/_build/native/release/build -name '*.core' -newer apps/mbui/out/moon.start 2>/dev/null | wc -l | tr -d ' ') packages' .core made since it started, $(find apps/mbui/_build -name '*.o' -path '*.mbc/*' 2>/dev/null | wc -l | tr -d ' ') of mbc's units' objects there"
              tail -20 apps/mbui/out/moon.log 2>/dev/null | sed 's/^/  moon.log: /' || true
              cat apps/mbui/out/mbc.log 2>/dev/null | sed 's/^/  mbc.log: /' || true
              ps -axo etime=,pcpu=,args= | grep -E 'moonc|moon |mbc|clang' | grep -v grep | cut -c1-200 | head -15 | sed 's/^/  running: /' || true
              exit "$status"
          }
      - name: Stop a prebuild whose preparation failed
        if: ${{ always() && steps.start.outcome != '' && steps.start.outcome != 'skipped' && steps.finish.outcome == 'skipped' }}
        run: |
          mkdir -p "$RUNNER_TEMP/mac-prebuild"
          : > "$RUNNER_TEMP/mac-prebuild/store-pending.failed"
          bash .github/mac-release-prebuild.sh stop
      # Hand over the same build to the signing job; mac-app.sh checks its build and beta face when taking it back.
      - name: Bundle the beta Mac app for signing
        id: bundle
        env:
          POSTHOG_JSON: ${{ github.ref == 'refs/heads/main' && secrets.POSTHOG_JSON || '' }}
        run: |
          set -eu
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog.json")
            export STILLFAIL_POSTHOG="$RUNNER_TEMP/posthog.json"
          fi
          unset POSTHOG_JSON
          trap 'rm -f "$RUNNER_TEMP/posthog.json"' EXIT
          # (the prebuild's app and core.hbc as it made them, where it says it built them whole: mac-release-prebuild.sh)
          [ ! -f "$RUNNER_TEMP/mac-prebuild/built" ] || export MBUI_BUILT=1
          MBUI_VARIANT=beta MBUI_SIGN_AFTER_BUILD=1 bash apps/mbui/scripts/mac-app.sh build
          mkdir -p "$RUNNER_TEMP/mac-unsigned"
          ditto -c -k --sequesterRsrc --keepParent apps/mbui/out/mac/youdid.wtf.app "$RUNNER_TEMP/mac-unsigned/bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/mac-unsigned/bundle.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # (main's, when it built the shell here)
      - if: github.ref == 'refs/heads/main' && steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      - if: github.ref == 'refs/heads/main' && steps.shell.outputs.cache-hit != 'true' && hashFiles('apps/mbui/out/core-target*/native/shell-apple/**/libstillfail_shell.a') != ''
        uses: actions/cache/save@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
      # (a cut build's log and its compilers stopped on main and a branch alike; a branch's store saved only of a build
      # that went through: a job that needs longer is made faster, never finished over several pushes, .github/AGENTS.md;
      # main's cut keeps what it compiled, as above)
      - name: The cache's key, by what it holds
        if: always() && steps.finish.outcome != 'skipped'
        run: |
          # (what the build did not use taken out only of a whole build: one cut in its bundling left compilers writing
          # units as used.sh took out all it had not seen used yet, and main's store was 24 MB after, 2026-11-17)
          if [ "${{ steps.finish.outcome }}" != success ] || [ "${{ steps.bundle.outcome }}" != success ]; then
            bash .github/mac-release-prebuild.sh stop
          fi
          mkdir -p .ci
          [ ! -d "$MBC_STORE" ] || mv "$MBC_STORE" .ci/mbc-store
          [ ! -d "$HBC_CACHE" ] || mv "$HBC_CACHE" .ci/hbc
          if [ "${{ steps.finish.outcome }}" = success ] && [ "${{ steps.bundle.outcome }}" = success ]; then
            sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          else
            # (where the build was as it was cut: its worker's log is said only as it ends, so a cut said nothing of what
            # it had come to, main 6a896dd6, 202a54dc and 0ff80373 on 2026-11-16)
            tail -40 "$RUNNER_TEMP/mac-prebuild/log" 2>/dev/null || true
            find .ci/mbc-store -name '*.lock' -delete 2>/dev/null || true
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "a branch's build that did not go through: its store not saved"; exit 0; }
          fi
          echo "STORE_KEY=mbui-mac-cc-${{ github.ref != 'refs/heads/main' && 'b-' || '' }}${{ steps.mac-cc.outputs.key }}-$(sh apps/mbui/scripts/held.sh .ci/mbc-store .ci/hbc)" >> "$GITHUB_ENV"
      - if: always() && env.STORE_KEY != '' && env.STORE_KEY != steps.store.outputs.cache-matched-key && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}
      # Moon's build kept once moonc has made the app's C (stillfail.c), whatever came after it: kept only of a build that
      # went through, main's cut in its C (the units of -O2, at its JOB_END - 60) kept none, and every run did moonc's
      # 120 s again before its C, cut again (2026-11-17). Keyed by that C, as next-mac-cache.yml's: one the same is not
      # saved again. (The compilers the step before stopped; mbc's objects are not moon's: not kept.)
      - name: Moon's build, once moonc made the app's C
        if: always() && github.ref == 'refs/heads/main' && steps.finish.outcome != 'skipped'
        run: |
          c=apps/mbui/_build/native/release/build/stillfail/stillfail/stillfail.c
          [ -s "$c" ] || { echo "moonc had not made the app's C: moon's build not kept"; exit 0; }
          find apps/mbui/_build -type d -name '*.mbc' -prune -exec rm -rf {} +
          echo "MOON_KEY=mbui-mac-moon-$(shasum -a 256 "$c" | cut -c1-16)" >> "$GITHUB_ENV"
      - if: always() && github.ref == 'refs/heads/main' && env.MOON_KEY != '' && env.MOON_KEY != steps.moon.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
            !apps/mbui/_build/**/*.mbc/**
          key: ${{ env.MOON_KEY }}
  # The expensive build is already handed over; keep signing, notarization and release checks in their own budget.
  desktop:
    needs: [plan, natives, natives-mac, desktop-build]
    if: ${{ !cancelled() && !failure() && ((github.ref == 'refs/heads/main' && needs.plan.outputs.mac_beta == 'true') || needs.plan.outputs.release_smoke == 'true') }}
    runs-on: macos-26
    outputs:
      hand: ${{ steps.hand.outputs.key }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
      MBUI_MAC_FROM: ${{ github.workspace }}/.ci/mac-unsigned/youdid.wtf.app
    steps:
      - run: git config --global http.lowSpeedLimit 1024 && git config --global http.lowSpeedTime 20
      - uses: actions/checkout@v5
      - run: bash scripts/git-history.sh
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: mac-unsigned-${{ github.sha }}
          path: .ci/mac-unsigned
      - name: Check the app handed over for signing
        run: |
          set -eu
          ditto -x -k .ci/mac-unsigned/bundle.zip .ci/mac-unsigned
          plist="$MBUI_MAC_FROM/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = fail.still.desktop.beta
          test "$(plutil -extract CFBundleExecutable raw "$plist")" = youdid.wtf
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "$(git rev-list --count HEAD)"
      - name: Sign and notarize the beta Mac app
        if: github.ref == 'refs/heads/main'
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID and notary profile (.github/mac_signing.py).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: |
          # The uploader's packages need none of the app's build; prepare them beside it.
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > "$RUNNER_TEMP/mac-put-deps.log" 2>&1) &
          deps=$!
          status=0
          sh .github/release-desktop.sh --out "$RUNNER_TEMP/release" || status=$?
          wait "$deps" || { cat "$RUNNER_TEMP/mac-put-deps.log"; status=1; }
          exit "$status"
      - name: Sign and verify the beta Mac app without publishing
        if: github.ref != 'refs/heads/main'
        env:
          MAC_SIGN_IDENTITY: "-"
          UNSIGNED: 1
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh scripts/release.sh --beta desktop
      # (monoid's Mac app is this one renamed: hand it over before --files consumes the staging copy)
      - if: github.ref == 'refs/heads/main' && vars.MONOID_CI == 'on'
        uses: actions/upload-artifact@v4
        with:
          name: mac-beta-${{ github.sha }}
          path: ${{ runner.temp }}/release/desktop/stillfail-beta-*-arm64-mac.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          build=$(git rev-list --count HEAD)
          cache=${MBUI_MAC_CACHE:-"$HOME/stillfail-ci/mbui-mac-beta"}
          work=${WORK:-"$cache/tree/apps/mbui"}
          if [ "${MBUI_FRESH:-}" = 1 ]; then work="$GITHUB_WORKSPACE/apps/mbui"; fi
          export STILLFAIL_RELEASE_CACHE_KEY="desktop/stillfail-beta-0.1.$build-arm64-mac.zip"
          export STILLFAIL_RELEASE_CACHE_SOURCE="$work/out/mac/stillfail-beta-$build-arm64-mac.zip"
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      # (handed to put through the bucket, not a run artifact: scripts/release-put.sh --hand)
      - id: hand
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          sh scripts/release-put.sh --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"
  # The beta Windows app (fail.still.desktop.beta: mbui's, apps/mbui, in the Electron app's place, as the Mac one), on
  # win/beta/latest.json and desktop/stillfail-beta.yml (which moves an installed Electron beta over): built on GitHub's
  # Windows runner as preview.yml's windows job builds still.fail mbui, from main's build as that job left it in the Actions
  # cache (what is the same is not compiled again: mbui's scripts/mbc), packed in its installer (windows/setup.c) and
  # signed: its .sig (scripts/release-sign.ts), which the Electron app and mbui's core check; not code-signed. The stable
  # one is built the same way (stable.yml).
  desktop-win:
    needs: [plan]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.win_beta == 'true' }}
    runs-on: windows-2025
    environment: production
    # (a run by hand, or the day's, compiles what main's store has none of whole: once the units' commands named mbui at
    # libs/mbui, 2026-11-13, none of the store's were theirs, and a push's 5 minutes did not see it through)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    defaults:
      run:
        shell: bash
    env:
      # (scripts/native.ts: GitHub's release API, asked when the release's download fails, with the job's token)
      GH_TOKEN: ${{ github.token }}
      MSYS: winsymlinks:nativestrict
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      # (main's units, preview.yml's windows job's and this job's: what a build cut short compiled, kept below)
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
    # As preview.yml's windows job: the app built in the background from as early as it can be, the core's bytecode,
    # the installer's program and (only for a core not kept) pnpm and the packages made beside it; then packed (setup.c
    # --pack, its files on all the cores, its raw form written as it packs), signed and put. One after another, the
    # setup's store, the packages and a core made anew (never kept: this job's has PostHog's in it, which preview's has
    # not, and none was saved) were 95-126 s before the build began (main 134069744686, cut at 333 s, 2026-11-17).
    steps:
      # (the natives' keys are git's blobs: the checkout as git has it; when the job began, for monoid's deadline below,
      # and when it is cut, for the build's own limit to the second, scripts/with-timeout.sh: first, before pwsh's start)
      - run: |
          git config --global core.autocrlf false
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 20
          echo "JOB_BEGAN=$(date +%s)" >> "$GITHUB_ENV"
          # (less the 3-5 s of "Set up job" before this step: preview's windows, 43998071944)
          echo "JOB_END=$(( $(date +%s) + ${{ github.event_name == 'push' && 5 || 10 }} * 60 - 5 ))" >> "$GITHUB_ENV"
      # Defender's real-time scan kept off what the job writes and runs (preview.yml's windows: 12-25 s of MoonBit's put
      # in, 2026-10-30)
      - shell: pwsh
        run: |
          $t = Get-Date
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:LOCALAPPDATA, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
          "Defender kept off them in $([int]((Get-Date) - $t).TotalMilliseconds) ms"
      - uses: actions/checkout@v5
      - run: bash scripts/git-history.sh
      # Node alone first, the image's (or the Actions cache's) as preview.yml's windows job takes it: the setup's pnpm and
      # its store only for a core.hbc not kept, below
      - id: node-keep
        run: |
          v=$(tr -d 'v[:space:]' < .node-version); d="$RUNNER_TOOL_CACHE/node/$v/x64"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "key=node-win32-x64-$v" >> "$GITHUB_OUTPUT"
          [ ! -x "$(cygpath -u "$d")/node.exe" ] || echo "kept=true" >> "$GITHUB_OUTPUT"
      - if: steps.node-keep.outputs.kept != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.node-keep.outputs.dir }}
            ${{ steps.node-keep.outputs.dir }}.complete
          key: ${{ steps.node-keep.outputs.key }}
      - id: node
        run: |
          d="$(cygpath -u "$RUNNER_TOOL_CACHE")/node/$(tr -d 'v[:space:]' < .node-version)/x64"
          [ -x "$d/node.exe" ] || exit 0
          cygpath -w "$d" >> "$GITHUB_PATH"
          echo "kept=true" >> "$GITHUB_OUTPUT"
          # (the natives' keys, the three the app links, made beside MSVC's and MoonBit's setup)
          K=$RUNNER_TEMP/native-keys; mkdir -p "$K"
          nohup bash -c 'PATH="$1:$PATH"; k="natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)-$(node scripts/native.ts key ghostty-vt win32-x64)" && printf %s "$k" > "$0/key"; echo $? > "$0/status"' "$K" "$d" > /dev/null 2>&1 &
      - if: steps.node.outputs.kept != 'true'
        uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: The Windows natives' keys
        id: native-keys
        run: |
          K=$RUNNER_TEMP/native-keys
          if [ -d "$K" ]; then while [ ! -f "$K/status" ]; do sleep 0.2; done; fi
          if [ "$(cat "$K/status" 2>/dev/null)" = 0 ]; then echo "key=$(cat "$K/key")" >> "$GITHUB_OUTPUT"
          else echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)-$(node scripts/native.ts key ghostty-vt win32-x64)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      # (ghostty-vt's too: win.sh found it missing and fetched it itself, never kept)
      - name: The Windows engine, shell and ghostty-vt, prebuilt
        run: |
          node scripts/native.ts fetch shell win32-x64
          node scripts/native.ts fetch engine win32-x64
          node scripts/native.ts fetch ghostty-vt win32-x64
      # (main's build, preview.yml's windows job's or this job's, saved below)
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            libs/mbui/_build
            libs/mbui/out
          key: mbui-win-build-mono-${{ github.sha }}
          restore-keys: mbui-win-build-mono-
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: .ci/mbc-store
          key: mbui-win-store-m-${{ github.sha }}
          restore-keys: mbui-win-store-m-
      # The beta app built in the background from here on (MBUI_WIN_CORE=0: its core put beside it below), as the
      # release builds it (MBUI_VARIANT, MBUI_BUILD: release.sh takes it as built, MBUI_WIN_BUILT); "Build, pack and sign"
      # waits for it
      # (each file of the app, mbui, the library and Farview's client given its content's mtime, so moon builds over the
      # build restored only what changed, as desktop-build's: apps/mbui/scripts/moon-mtimes.sh)
      - run: bash apps/mbui/scripts/moon-mtimes.sh
      - name: Build (the beta Windows app), started
        id: started
        run: |
          touch "$RUNNER_TEMP/start"
          moon version --all
          build=$(git rev-list --count HEAD)
          B=$RUNNER_TEMP/build; mkdir -p "$B"
          printf '%s' "$build" > "$B/build"
          nohup bash -c 'MBUI_WIN_CORE=0 MBUI_VARIANT=beta MBUI_BUILD="$1" bash apps/mbui/scripts/win.sh build > "$0/log" 2>&1; echo $? > "$0/status"' "$B" "$build" > /dev/null 2>&1 &
          # (its Windows process, for taskkill to stop all it runs (moon, mbc, clang-cl) where it is cut: below)
          cat "/proc/$!/winpid" > "$B/winpid" 2>/dev/null || true
      # core.hbc by its inputs (HBC_CACHE), PostHog's project in its key: this job's own, saved below, apart from
      # preview.yml's (mbui-win-hbc-, none of PostHog's), which it falls back to (monoid's beta, below, has none either)
      - uses: actions/cache/restore@v4
        id: hbc-cache
        with:
          path: .ci/hbc
          key: mbui-win-posthog-hbc-${{ github.sha }}
          restore-keys: |
            mbui-win-posthog-hbc-
            mbui-win-hbc-
      # Whether pnpm, its store and the core's packages are needed: only for a core.hbc not kept (the release's scripts
      # after need Node's own modules alone, and release-put.sh its curl). monoid's beta's (no PostHog) is asked too
      # where it is packed below.
      - name: The core's bytecode, kept?
        id: hbc
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: |
          # the PostHog project its core sends what people use to (apps/mbui/scripts/core.sh posthog_define)
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog.json")
            echo "POSTHOG_FILE=$RUNNER_TEMP/posthog.json" >> "$GITHUB_ENV"
          fi
          unset POSTHOG_JSON
          export HERMESC=$(cygpath -m "$(node scripts/native.ts path engine win32-x64)/hermesc.exe")
          STILLFAIL_POSTHOG=$([ ! -s "$RUNNER_TEMP/posthog.json" ] || echo "$RUNNER_TEMP/posthog.json") bash apps/mbui/scripts/core.sh hermes-kept || exit 0
          [ "${{ vars.MONOID_CI }}" != on ] || bash apps/mbui/scripts/core.sh hermes-kept || exit 0
          echo "kept=true" >> "$GITHUB_OUTPUT"
      - if: steps.hbc.outputs.kept != 'true'
        uses: ./.github/actions/setup
      - name: The core's packages
        if: steps.hbc.outputs.kept != 'true'
        run: (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline --reporter=append-only > "$RUNNER_TEMP/packages.log" 2>&1) || { cat "$RUNNER_TEMP/packages.log"; exit 1; }
      # (beside the build: kept, a copy; else made on the cores cl leaves)
      - name: The core's bytecode (Hermes) and the installer's own program
        run: |
          export STILLFAIL_POSTHOG=${POSTHOG_FILE:-}
          bash apps/mbui/scripts/win.sh core
          [ ! -d .ci/hbc ] || echo "HBC_CACHE: $(ls .ci/hbc | wc -l) files, $(du -sm .ci/hbc | cut -f1) MB"
          bash apps/mbui/scripts/win.sh setup-bare
      # (the build waited for till what follows it still fits before the job's end (JOB_END): the core put beside it,
      # the installer packed, signed and its raw form zstd'd, its files put, 45 s; release.sh stopped by its own limit,
      # 35 s before the job's end, so the caches are saved after it)
      - name: Build, pack and sign the beta Windows app
        id: build
        env:
          # The installer's signature (its .sig): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          B=$RUNNER_TEMP/build
          wait=$(( JOB_END - $(date +%s) - 45 )); [ "$wait" -ge 20 ] || wait=20
          t0=$SECONDS
          while [ ! -s "$B/status" ]; do
            [ $((SECONDS - t0)) -lt $wait ] || { echo "::error::the build not done after $wait s"; tail -60 "$B/log"; exit 1; }
            sleep 1
          done
          echo "(waited $((SECONDS - t0)) s for it)"
          cat "$B/log"
          [ "$(cat "$B/status")" = 0 ] || exit 1
          bash apps/mbui/scripts/win.sh put
          # the build cache's key: the app's C by its content (one as the restored one was is not saved again)
          d=$(sh apps/mbui/scripts/mbui.sh)
          echo "BUILD_KEY=mbui-win-build-mono-$(sha256sum "$d/out/win/app/_build/native/release/build/stillfail/stillfail/stillfail.c" | cut -c1-16)" >> "$GITHUB_ENV"
          export STILLFAIL_POSTHOG=${POSTHOG_FILE:-}
          MBUI_WIN_BUILT="beta:$(cat "$B/build")" bash scripts/with-timeout.sh @$((JOB_END - 35)) sh scripts/release.sh --beta desktop-win
      - name: Put its files (named by its version, nothing points at them until put writes the feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }
      # monoid's (build.monoid.desktop.beta): the same program, linked again with its own resources (its id, name and
      # environment: apps/mbui/scripts/win.sh), nothing compiled again; put by monoid-desktop-win once the check passed.
      # Only while the job's 5 minutes leave room for it (some 30 s): it never holds still.fail's release back, which is
      # put and handed on above. 3b0992b9's job was 304 s with it, stopped at its 5 minutes, and the release with it
      # (43054413565, 2026-11-11): left out, monoid's Windows app comes with the next release.
      - name: Pack and sign monoid's beta Windows app from the same build
        id: monoid
        if: vars.MONOID_CI == 'on'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/monoid
        run: |
          used=$(( $(date +%s) - JOB_BEGAN ))
          if [ "$used" -gt 220 ]; then
            echo "::warning::monoid's beta Windows app left for the next release: this job has used ${used} s of its 300"
            exit 0
          fi
          sh scripts/release.sh --product monoid --beta desktop-win
          echo "packed=1" >> "$GITHUB_OUTPUT"
      - if: steps.monoid.outputs.packed == '1'
        uses: actions/upload-artifact@v4
        with: { name: "monoid-desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/monoid", retention-days: 1 }
      # (main's caches, however the build ended, last: after the release is put, never holding it back. One cut short
      # keeps what it compiled, what it left running (moon, mbc, clang-cl) stopped first and their locks taken out, so
      # the store is still as it is tarred: mbui-check.yml's save failed so, 43839505847; and the app's C moonc wrote
      # whole (mbc had split it), as mbui-win-build-mono-moon-<its key>: the next run, preview's or this, restores it
      # and goes on from that C, moonc's ~60 s not done again, and its build whole is saved under the key without
      # -moon-)
      - name: The units, the core's bytecode and the build, by what they hold
        if: always() && github.ref == 'refs/heads/main' && steps.started.outcome == 'success'
        run: |
          B=$RUNNER_TEMP/build
          if [ "${{ steps.build.outcome }}" = success ]; then
            sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          else
            [ ! -s "$B/winpid" ] || taskkill //F //T //PID "$(cat "$B/winpid")" > /dev/null 2>&1 || true
            taskkill //F //IM moon.exe //IM moonc.exe //IM mbc.exe //IM clang-cl.exe //IM cl.exe //IM link.exe > /dev/null 2>&1 || true
            sleep 1
            find .ci/mbc-store -name '*.lock' -delete 2>/dev/null || true
            d=$(sh apps/mbui/scripts/mbui.sh)
            c=$d/out/win/app/_build/native/release/build/stillfail/stillfail/stillfail.c
            if [ -z "${BUILD_KEY:-}" ] && [ -s "$c" ] && grep -q '^mbc: stillfail\.c: .* units in ' "$d/out/mbc.log" 2>/dev/null; then
              echo "BUILD_KEY=mbui-win-build-mono-moon-$(sha256sum "$c" | cut -c1-16)" >> "$GITHUB_ENV"
            fi
          fi
          echo "units: $(find .ci/mbc-store -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)"
          echo "STORE_KEY=mbui-win-store-m-$(sh apps/mbui/scripts/held.sh .ci/mbc-store)" >> "$GITHUB_ENV"
          [ ! -d .ci/hbc ] || echo "HBC_KEY=mbui-win-posthog-hbc-$(ls .ci/hbc | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
      - if: always() && github.ref == 'refs/heads/main' && env.STORE_KEY != '' && env.STORE_KEY != steps.store.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/mbc-store
          key: ${{ env.STORE_KEY }}
      - if: always() && github.ref == 'refs/heads/main' && env.HBC_KEY != '' && env.HBC_KEY != steps.hbc-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/hbc
          key: ${{ env.HBC_KEY }}
      - if: always() && github.ref == 'refs/heads/main' && env.BUILD_KEY != '' && env.BUILD_KEY != steps.build-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            libs/mbui/_build
            libs/mbui/out
          key: ${{ env.BUILD_KEY }}
    outputs:
      monoid: ${{ steps.monoid.outputs.packed }}

  # monoid's beta Windows app (build.monoid.desktop.beta), packed by desktop-win from its own build, put whole in monoid's
  # bucket once the check passed.
  monoid-desktop-win:
    needs: [plan, check, check-mac, check-linux, check-station, check-core, desktop-win]
    if: ${{ !cancelled() && vars.MONOID_CI == 'on' && github.ref == 'refs/heads/main' && needs.plan.outputs.win_beta == 'true' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && needs.desktop-win.result == 'success' && needs.desktop-win.outputs.monoid == '1' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "monoid-desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/monoid" }
      - name: Put it in monoid's bucket (its files and deltas, then its feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/monoid" --releases https://app.monoid.build/releases --deadline 150
          sh scripts/release-put.sh "$RUNNER_TEMP/monoid"

  # The deltas of each release (scripts/release-deltas.ts: from the builds before, at https://app.still.fail/releases),
  # a job a part, beside the checks: 10 bases a feed (the owner, 2026-11-11; the station's 4 archives ×10), four makers
  # at once on a runner's 4 cores, inside --deadline 200. Each part's job waits for its own build alone: one job for the
  # four waited for the slowest (the Mac's notary), the others' idle 100-290 s after they were built (main 43843397408,
  # 43840764192, 2026-11-16). Each takes its part's release as put will (its hand, its artifact; the station's archives
  # taken back from staged/), puts the deltas (and the station's archives under their own names: nothing points at them
  # until put writes the feed) and hands put the amended feeds (deltas-<part>-<sha>). Never a reason to hold a release
  # back: put goes on without what this did not make. The four run the same steps (deltas-steps), their part in PART.
  deltas-station:
    needs: [plan, station]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.station.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    continue-on-error: true
    env:
      PART: station
      HANDED: ${{ needs.station.outputs.hand }}
    steps: &deltas-steps
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - if: env.PART == 'desktop-win'
        uses: actions/download-artifact@v4
        with: { name: "release-desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/release" }
      - name: Its release, as put will have it
        if: env.PART != 'desktop-win'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --unhand "$RUNNER_TEMP/release" $HANDED
          sh scripts/release-put.sh --unstage "$RUNNER_TEMP/release"
      # (a deadline of its own, inside the job's: what is not made by then is left out, the job green)
      - name: Its deltas
        run: node scripts/release-deltas.ts "$RUNNER_TEMP/release" --into "$RUNNER_TEMP/deltas" --deadline 200
      - name: Put them (nothing points at them until put writes the feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -d cloud/node_modules ] || (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/deltas"
      - uses: actions/upload-artifact@v4
        with: { name: "deltas-${{ env.PART }}-${{ github.sha }}", path: "${{ runner.temp }}/deltas", if-no-files-found: ignore, retention-days: 1 }
  deltas-android:
    needs: [plan, android]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    continue-on-error: true
    env:
      PART: android
      HANDED: ${{ needs.android.outputs.hand }}
    steps: *deltas-steps
  deltas-desktop:
    needs: [plan, desktop]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    continue-on-error: true
    env:
      PART: desktop
      HANDED: ${{ needs.desktop.outputs.hand }}
    steps: *deltas-steps
  deltas-desktop-win:
    needs: [plan, desktop-win]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.desktop-win.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    continue-on-error: true
    env:
      PART: desktop-win
    steps: *deltas-steps

  # (the Mac's beta holds no other part's back: its job waits on Apple's notary service, which took the whole of its five
  # minutes four runs in a row from 12:29 UTC on 2026-11-12 (41 s before), and put skipped every part's release with it,
  # none out for over an hour and a half. A desktop failed or cancelled leaves the Mac's feed as it was, handing nothing;
  # it is main's red as any job's, and `done` waits for it, so deployed/beta stays and the next run plans the Mac again.
  # So with its build, desktop-build: it hands put nothing, and one cut at its five minutes would hold every part's release
  # back as the notary did; its Mac build ran 276-287 s on main's releases of 2026-11-14 and 15. Nor does the station's
  # or Android's: each hands put only what it finished (release-put.sh --hand), and one cut at its five minutes held
  # back the Mac's and Windows' betas, signed and ready: main 44147606865, 2026-11-17. `done` still waits for every
  # part, so deployed/beta stays and the next run plans the one that failed again)
  put:
    needs: [plan, check, check-mac, check-linux, check-station, check-core, api, static, station, android, desktop-build, desktop, desktop-win, deltas-station, deltas-android, deltas-desktop, deltas-desktop-win]
    if: always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && (needs.station.result == 'success' || needs.android.result == 'success' || needs.desktop.result == 'success' || needs.desktop-win.result == 'success')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # the clouds believe it as it tells them a release is out (scripts/release-told.sh)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # the changelog's entries are numbered by the commits up to them
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*-${{ github.sha }}", path: "${{ runner.temp }}/release", merge-multiple: true }
      # what macos-ci's jobs handed through the bucket (scripts/release-put.sh --hand)
      - name: What macos-ci's jobs handed over
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HANDED: ${{ needs.station.outputs.hand }} ${{ needs.android.outputs.hand }} ${{ needs.desktop.outputs.hand }}
        run: |
          [ -n "$(echo $HANDED)" ] || exit 0
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --unhand "$RUNNER_TEMP/release" $HANDED
      # the feeds with their deltas (the deltas-<part> jobs'), over the ones handed; none, and they go out without
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "deltas-*-${{ github.sha }}", path: "${{ runner.temp }}/release", merge-multiple: true }
      - name: Put the releases (their files, then their feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HANDED: ${{ needs.station.outputs.hand }} ${{ needs.android.outputs.hand }} ${{ needs.desktop.outputs.hand }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh "$RUNNER_TEMP/release"
          # shellcheck disable=SC2086 # names, one word each
          [ -z "$(echo $HANDED)" ] || sh scripts/release-put.sh --drop $HANDED
      - name: Tell the clouds the releases are out (their stations and apps read their feeds then)
        run: sh scripts/release-told.sh https://app.youdid.wtf https://app.still.fail
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh
      # monoid's cloud reads its own account's bucket, and answers for still.fail too once CLOUD_MOVED is on: the same
      # changelog put there (before, its /v1/changelog was empty, the apps' 更新日志 with it, 2026-11-13)
      - name: Put changelog.json in monoid's bucket
        if: vars.MONOID_CI == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh
      # The release is put and told by now: an old file Cloudflare's API would not list or delete (a 5xx, a 429, a reset)
      # stays for the next put's prune, and holds back neither this put nor station-update.
      - name: Delete old installers and beta blockmaps (scripts/release-prune.ts says which stay)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-prune.ts

  # (on Mini1, quick: vars.MINI1 == 'off' leaves it out, as check-mac's and natives-mac's place there)
  station-update:
    needs: [station, put]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.station.result == 'success' && needs.put.result == 'success' && vars.MINI1 != 'off'
    runs-on: [self-hosted, quick]
    timeout-minutes: 5
    steps:
      - name: Update the configured test station
        run: |
          # (the machine's own, beside its CI's other state: a skill's directory is the workspace's now, one for every
          # station, and Mini1's own skill was kept apart as stillfail-Mini1, so the old path was gone, 88fced1a 43592776585)
          target=$(cat "$HOME/stillfail-ci/station-update-host")
          test -n "$target"
          printf '::add-mask::%s\n' "$target"
          # (its log said whole where it failed: `&& tail` alone said nothing of why, f094fa11's 43845073551 a bare exit 1,
          # the log on the machine "Error: fetch failed")
          ssh -o BatchMode=yes "$target" 'env -u STILLFAIL_DATA STILLFAIL_CHANNEL=beta ~/.local/bin/stillfail update --beta > /tmp/stillfail-station-update.log 2>&1 || { rc=$?; cat /tmp/stillfail-station-update.log >&2 || true; exit $rc; }; tail -2 /tmp/stillfail-station-update.log'

  # The changelog, when nothing was released (put, which puts it after the releases, did not run): a fix in still.fail
  # cloud counts as out as soon as it is listed, not before the API carrying it is deployed.
  changelog:
    needs: [plan, check, check-mac, check-linux, check-station, check-core, api, static, put]
    if: always() && github.ref == 'refs/heads/main' && needs.put.result == 'skipped' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # each entry's version is the commits up to it
      - uses: ./.github/actions/setup
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh
      # monoid's cloud reads its own account's bucket, and answers for still.fail too once CLOUD_MOVED is on: the same
      # changelog put there (before, its /v1/changelog was empty, the apps' 更新日志 with it, 2026-11-13)
      - name: Put changelog.json in monoid's bucket
        if: vars.MONOID_CI == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh

  # main, once all of it is out: the tag the next run's range starts from, and what is left to do by hand.
  done:
    needs: [plan, natives, natives-mac, check, check-mac, check-linux, check-station, check-core, api, static, monoid-api, monoid-static, monoid-kit, station, android, desktop-build, desktop, desktop-win, put]
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success","skipped"]'), needs.natives.result) && contains(fromJSON('["success","skipped"]'), needs.natives-mac.result) && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success') && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && contains(fromJSON('["success","skipped"]'), needs.monoid-api.result) && contains(fromJSON('["success","skipped"]'), needs.monoid-static.result) && contains(fromJSON('["success","skipped"]'), needs.monoid-kit.result) && contains(fromJSON('["success","skipped"]'), needs.station.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) && contains(fromJSON('["success","skipped"]'), needs.put.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-build.result) && contains(fromJSON('["success","skipped"]'), needs.desktop.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-win.result)
    runs-on: [self-hosted, quick]
    timeout-minutes: 5
    permissions:
      contents: write # only this job updates the tag deployed/beta
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: |
          git tag -f deployed/beta "$GITHUB_SHA"
          # Not the repository's pre-push check (the runner's checkout has the hooks on): this run checked it all.
          # As macos-ci's own GitHub login, not the run's token: GitHub refuses that token a ref to a commit that changes a
          # workflow (no `workflows` permission), and a tag stuck behind such a commit stays stuck (2026-10-02, e3ae7c10).
          # (again on a dropped connection: one from macos-ci to github.com failed the tag's push alone, the beta out, main
          # 30f68adc 41249459343, 2026-11-01)
          for i in 1 2 3; do
            git push --no-verify -f "https://github.com/$GITHUB_REPOSITORY" refs/tags/deployed/beta && break
            [ $i = 3 ] && exit 1; sleep 10
          done
      - if: needs.plan.outputs.relay == 'true'
        run: echo "::warning::the relay changed and is not deployed here, as that drops every connection. Deploy it separately using the configured deployment environment."

  # How long this run took against its budget (scripts/ci-time.ts): in the run's summary, and a warning when over. A
  # station's watch reads the same of every run and has an agent find why one went over.
  timing:
    needs: [plan, natives, natives-mac, check, check-mac, check-linux, check-station, check-core, bundle, mac-build, api, static, monoid-api, monoid-static, station, station-update, android, desktop-build, desktop, desktop-win, deltas-station, deltas-android, deltas-desktop, deltas-desktop-win, put, changelog, done]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: "scripts/ci-time.ts\n.node-version\n.github/actions/node", sparse-checkout-cone-mode: false }
      - uses: ./.github/actions/node
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node scripts/ci-time.ts "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/timing.txt" || rc=$?
          cat "$RUNNER_TEMP/timing.txt"
          { echo '```'; cat "$RUNNER_TEMP/timing.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc = 3 ]; then echo "::warning::$(head -1 "$RUNNER_TEMP/timing.txt")"; elif [ $rc != 0 ]; then exit $rc; fi
      # main: every part the plan said changed went out, or this run fails (a job skipped where it should have run went
      # unnoticed for a day: the API, 2026-10-04 to 05). Skipped is right only for a part the plan left alone, or when a
      # check before it failed (the run has failed then anyway).
      - if: github.ref == 'refs/heads/main' && needs.check.result == 'success' && (needs.plan.outputs.check_mac != 'true' || vars.CI_1 == 'off' || needs.check-mac.result == 'success') && needs.check-linux.result == 'success' && (needs.plan.outputs.station_tests != 'true' || needs.check-station.result == 'success') && (needs.plan.outputs.core_tests != 'true' || needs.check-core.result == 'success')
        run: |
          missed=""
          planned() { [ "$1" = true ] && [ "$2" = skipped ] && missed="$missed $3"; return 0; }
          planned '${{ needs.plan.outputs.api }}' '${{ needs.api.result }}' api
          planned '${{ needs.plan.outputs.static }}' '${{ needs.static.result }}' static
          planned '${{ needs.plan.outputs.station }}' '${{ needs.station.result }}' station
          planned '${{ needs.plan.outputs.android_beta }}' '${{ needs.android.result }}' android
          planned '${{ needs.plan.outputs.mac_beta }}' '${{ needs.desktop.result }}' desktop
          planned '${{ needs.plan.outputs.win_beta }}' '${{ needs.desktop-win.result }}' desktop-win
          if [ -n "$missed" ]; then echo "::error::changed, planned, and not released:$missed"; exit 1; fi
          echo "every planned part went out"
