name: Verify optimized Mac beta build
on:
  push:
    branches: [diag/monoid-mac-beta-optimized]
permissions:
  contents: read
jobs:
  desktop-build:
    # (the Apple parts alone: shell-apple and ghostty-vt for darwin-arm64, natives-mac's, never natives' slower Linux build)
    runs-on: macos-26
    # (a run by hand compiles what main's store has none of whole: once the units' commands named mbui at libs/ui,
    # 2026-11-13, none of the store's were theirs, 441 of 831 units, cut at 5 on a push)
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }} # read-only API fallback if the public release download fails
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
    steps:
      # (when the job is cut, its timeout-minutes above, for its build's own limit to the second, scripts/with-timeout.sh;
      # less the 1-5 s of "Set up job" before this step)
      - run: |
          echo "JOB_END=$(( $(date +%s) + ${{ github.event_name == 'push' && 5 || 10 }} * 60 - 5 ))" >> "$GITHUB_ENV"
          echo "MBC_STORE=$RUNNER_TEMP/ci-live/mbc-store" >> "$GITHUB_ENV"
          echo "HBC_CACHE=$RUNNER_TEMP/ci-live/hbc" >> "$GITHUB_ENV"
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 20
      - uses: actions/checkout@v5
      # (a branch's history first: arch-base below asks for arch/next's. Main's is wanted only by mac-app.sh's build number
      # once the app is built, so it is fetched while the app builds, which then starts 4-5 s sooner)
      - if: github.ref != 'refs/heads/main'
        run: bash scripts/git-history.sh main arch/next
      # (mbc's units and the core's bytecode, and moon's own build below: main's newest, saved by this job on main by what
      # they hold, as preview.yml's jobs keep theirs; stable.yml's Mac app restores them too)
      # mbc still validates the full compiler and every dependency; the prefix just keeps each launcher’s store.
      - name: The Mac C compiler launcher
        id: mac-cc
        run: echo "key=$(shasum -a 256 /usr/bin/cc | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # A branch based on arch/next needs its compiled units too. GitHub makes the branch's own and main's caches
      # available, but not arch/next's; next-mac-cache.yml keeps that branch's on main's ref for this job.
      - id: arch-base
        if: github.ref != 'refs/heads/main'
        run: |
          next=$(git merge-base HEAD origin/arch/next 2>/dev/null || :)
          shared=$(git merge-base origin/main origin/arch/next 2>/dev/null || :)
          if [ -n "$next" ] && [ -n "$shared" ] && [ "$next" != "$shared" ] && git merge-base --is-ancestor "$shared" "$next"; then
            echo "next=true" >> "$GITHUB_OUTPUT"
          fi
      - if: github.ref != 'refs/heads/main'
        run: |
          # Cold branch builds parse the same declarations in every C unit. Use the hosted reader's larger -O0 units.
          echo "MBC_UNIT_KB=8192" >> "$GITHUB_ENV"
          echo "MBC_INIT_SPLIT=0" >> "$GITHUB_ENV"
      - id: hermes
        run: echo "key=$(grep -E '^HERMES_(RN|APPLE_URL|APPLE_SHA256)=' apps/mbui/scripts/core.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/stillfail-build
            apps/mbui/out/core/hermesc
          key: mbui-hermes-apple-${{ steps.hermes.outputs.key }}
      - uses: ./.github/actions/setup
        with: { pnpm: 'false' }
      - uses: ./.github/actions/natives
      - name: The macOS shell and core native keys
        id: native-keys
        run: |
          set -o pipefail
          # Compute shell-apple, ghostty-vt, and clang++ version keys concurrently to shave 3-5 s before build start.
          K=$RUNNER_TEMP/mac-native-keys; rm -rf "$K" && mkdir -p "$K"
          (xcrun --sdk macosx clang++ --version > "$K/cc") & p1=$!
          (node scripts/native.ts key shell-apple darwin-arm64 > "$K/shell") & p2=$!
          (node scripts/native.ts key ghostty-vt darwin-arm64 > "$K/ghostty") & p3=$!
          sources=$(shasum -a 256 apps/mbui/src/host/apple_core.mm apps/mbui/engine/ready_queue.h \
            apps/mbui/src/host/apple_collate.h apps/mbui/src/host/electron_sealed.h apps/mbui/src/host/core_api.h \
            apps/mbui/src/host/listen_api.h libs/ui/src/host/listen_api.h apps/mbui/scripts/core.sh)
          wait "$p1"
          wait "$p2"
          wait "$p3"
          IFS= read -r cc < "$K/cc"
          shell_key=$(cat "$K/shell")
          ghostty=$(cat "$K/ghostty")
          [ -n "$cc" ] && [ -n "$shell_key" ] && [ -n "$ghostty" ]
          key=$(printf '%s\n' 'macos 12.0' "$cc" '${{ steps.hermes.outputs.key }}' "$sources" "$ghostty" | shasum -a 256 | cut -c1-16)
          echo "key=natives-shell-apple-darwin-arm64-$shell_key" >> "$GITHUB_OUTPUT"
          echo "apple-native=mbui-mac-apple-native-$key" >> "$GITHUB_OUTPUT"
      # (saved by main alone, below: a branch that changed the mesh saved it in its Post Run, after its five minutes)
      - uses: actions/cache/restore@v4
        id: shell
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      - if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-
            shell-apple-target-darwin-arm64-
      # (the core's engine, core.sh's libmbui_core.a, and libghostty-vt darwin-arm64: compiled and downloaded again on
      # every fresh runner, 14-36 s of the prebuild before moon's build started. Keyed by all the engine is made of, its
      # sources and the headers they include, core.sh, the compiler, the macOS it is for and Hermes, and by ghostty-vt's
      # own key; only that exact key is taken, never an older engine. Saved by main alone, below)
      - uses: actions/cache/restore@v4
        id: apple-native
        with:
          path: |
            apps/mbui/out/core/aarch64-apple-darwin/libmbui_core.a
            ~/Library/Caches/stillfail-native/ghostty-vt
          key: ${{ steps.native-keys.outputs.apple-native }}
      # (newer than every source, which moon-mtimes.sh dates 2000-2008, and than core.sh, as engine() asks; the app is
      # linked again by what its native parts are, not their mtimes: mac.sh's $exe.native-libs)
      - if: steps.apple-native.outputs.cache-hit == 'true'
        run: touch apps/mbui/out/core/aarch64-apple-darwin/libmbui_core.a
      # Start the prebuild worker as soon as shell + apple-native caches are restored so cold apple_core.mm compilation
      # overlaps with mbui-moonbit and mbui-mac-moon- restore (~15-17 s); the worker waits for `ready` before Moon runs.
      - name: Start the Mac app build
        id: start
        env:
          # the PostHog project the app's core sends what people use to (mac-release-prebuild.sh), as the bundling
          # step below gives it, so that core.hbc is made once
          POSTHOG_JSON: ""
          # main's core says when it was built (apps/mbui/scripts/core.sh built_at_define: any MBUI_BUILD >= 1000, the
          # number itself not read here, mac.sh building no Info.plist; main's history is not fetched yet), as the
          # bundling step's below does, so that core.hbc's key is one in every step; a branch's says 0 in each
          MBUI_BUILD: "1000"
        run: bash .github/mac-release-prebuild.sh start
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc chk pack' }
      # The next build is kept on main's ref too. Take its Moon build first; unlike the content-addressed units,
      # two Moon build directories cannot be overlaid, so fall back to main's only if there is no next build.
      - uses: actions/cache/restore@v4
        id: moon-next
        if: steps.arch-base.outputs.next == 'true'
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
            !apps/mbui/_build/**/*.mbc/**
          key: mbui-next-moon-mac-${{ github.sha }}
          restore-keys: mbui-next-moon-mac-
      - uses: actions/cache/restore@v4
        id: moon
        if: steps.moon-next.outputs.cache-matched-key == ''
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
            !apps/mbui/_build/**/*.mbc/**
          key: mbui-mac-moon-${{ github.sha }}
          restore-keys: mbui-mac-moon-
      # Release the prebuild worker into Moon's build once MoonBit and _build are restored and source mtimes are normalized.
      - name: Signal Moon toolchain ready
        run: |
          bash apps/mbui/scripts/moon-mtimes.sh
          touch "$RUNNER_TEMP/start"
          bash .github/mac-release-prebuild.sh ready
      # (main's -O2 units: main's own, and a branch's to take where they are what its changed program's would be at -O2,
      # mbc's MBC_LIGHT_TESTS, below)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-mac-cc-${{ steps.mac-cc.outputs.key }}-${{ github.sha }}
          restore-keys: |
            mbui-mac-cc-${{ steps.mac-cc.outputs.key }}-
            mbui-mac-
      # Preserve cache paths and version; the build reads only the separately published ci-live directories.
      - if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-main" .ci/mbc-store
          mv .ci/mbc-store "$RUNNER_TEMP/ci-main/mbc-store"
          rm -rf .ci/hbc
      - uses: actions/cache/restore@v4
        if: steps.arch-base.outputs.next == 'true'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-next-mac-${{ github.sha }}
          restore-keys: mbui-next-mac-
      - uses: actions/cache/restore@v4
        if: github.ref != 'refs/heads/main' && steps.arch-base.outputs.next != 'true'
        with:
          path: .ci/hbc
          key: mbui-ios-hbc-${{ github.sha }}
          restore-keys: mbui-ios-hbc-
      - if: github.ref != 'refs/heads/main'
        run: |
          if [ "${{ steps.arch-base.outputs.next }}" = true ] && [ -d .ci/mbc-store ]; then
            rsync -a .ci/mbc-store/ "$RUNNER_TEMP/ci-main/mbc-store/"
          fi
          rm -rf .ci/mbc-store
          [ ! -d .ci/hbc ] || mv .ci/hbc "$RUNNER_TEMP/ci-main/hbc"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-mac-cc-b-${{ steps.mac-cc.outputs.key }}-${{ github.sha }}
          restore-keys: mbui-mac-cc-b-${{ steps.mac-cc.outputs.key }}-
      - if: github.ref != 'refs/heads/main'
        run: |
          if [ -d .ci/mbc-store ]; then rsync -a .ci/mbc-store/ "$RUNNER_TEMP/ci-main/mbc-store/"; fi
          rm -rf .ci/mbc-store
          mv "$RUNNER_TEMP/ci-main/mbc-store" .ci/mbc-store
          mkdir -p "$RUNNER_TEMP/ci-main/hbc"
          if [ -d .ci/hbc ]; then rsync -a .ci/hbc/ "$RUNNER_TEMP/ci-main/hbc/"; fi
          rm -rf .ci/hbc
          mv "$RUNNER_TEMP/ci-main/hbc" .ci/hbc
          rm -rf "$RUNNER_TEMP/ci-main"
      - name: Publish complete caches to the build
        run: |
          mkdir -p .ci/mbc-store .ci/hbc "$RUNNER_TEMP/ci-live"
          mv .ci/mbc-store "$MBC_STORE"
          mv .ci/hbc "$HBC_CACHE"
          bash .github/mac-release-prebuild.sh store
      # pnpm and its store only where the core's bytecode is not kept (HBC_CACHE): only a core made here installs the
      # packages (13-15 s of the job; the Node it needs is the first setup's). Asked with the PostHog project the build
      # makes it with (mac-release-prebuild.sh's), so that the key is the build's.
      - id: hbc
        env:
          POSTHOG_JSON: ""
          # (the prebuild's, above)
          MBUI_BUILD: "1000"
        run: |
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog-kept.json")
            export STILLFAIL_POSTHOG="$RUNNER_TEMP/posthog-kept.json"
          fi
          unset POSTHOG_JSON
          if bash apps/mbui/scripts/core.sh hermes-kept apple; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
          rm -f "$RUNNER_TEMP/posthog-kept.json"
      # Restore pnpm store only here (avoid an unconditional 15 s Post Run 142 MB cache save that cancelled main
      # 45475280318 at 303 s after mac-unsigned was uploaded; saved explicitly below on main only when >=30 s remain).
      # Node is already on PATH from the first setup step.
      - if: steps.hbc.outputs.kept != 'true'
        uses: ./.github/actions/setup
        with: { node: 'false', pnpm-save: 'false' }
      - run: bash .github/mac-release-prebuild.sh packages
      - uses: actions/cache@v4
        with:
          path: apps/mbui/out/mac/AppIcon-*
          key: mbui-mac-icon-beta-${{ hashFiles('apps/mbui/scripts/mac-icon.swift') }}
      - if: github.ref == 'refs/heads/main'
        run: bash scripts/git-history.sh main
      # Leave 42 s before JOB_END, which already leaves 5 s before the job timeout.
      # Job 136144444377 took 44 s after the build: bundle 29 s, upload 5 s, cache save 6 s and cleanup 4 s.
      # GitHub cancelled it during Complete job with the artifact and cache already saved.
      - name: Finish the Mac app build
        id: finish
        run: |
          reserve=42
          bash scripts/with-timeout.sh @$((JOB_END - reserve)) bash .github/mac-release-prebuild.sh wait || {
              status=$?
              echo "::error::the Mac app's build not done $(( $(date +%s) - $(stat -f %m "$RUNNER_TEMP/start") )) s after it started; where it had got to:"
              tail -80 "$RUNNER_TEMP/mac-prebuild/log" 2>/dev/null || true
              # (moon's build says nothing till it ends: what it had done, and what was running as it was cut)
              echo "moon's build: $(find apps/mbui/_build/native/release/build -name '*.core' -newer apps/mbui/out/moon.start 2>/dev/null | wc -l | tr -d ' ') packages' .core made since it started, $(find apps/mbui/_build -name '*.o' -path '*.mbc/*' 2>/dev/null | wc -l | tr -d ' ') of mbc's units' objects there"
              tail -20 apps/mbui/out/moon.log 2>/dev/null | sed 's/^/  moon.log: /' || true
              cat apps/mbui/out/mbc.log 2>/dev/null | sed 's/^/  mbc.log: /' || true
              ps -axo etime=,pcpu=,args= | grep -E 'moonc|moon |mbc|clang' | grep -v grep | cut -c1-200 | head -15 | sed 's/^/  running: /' || true
              exit "$status"
          }
      - name: Stop a prebuild whose preparation failed
        if: ${{ always() && steps.start.outcome != '' && steps.start.outcome != 'skipped' && steps.finish.outcome == 'skipped' }}
        run: |
          mkdir -p "$RUNNER_TEMP/mac-prebuild"
          : > "$RUNNER_TEMP/mac-prebuild/store-pending.failed"
          bash .github/mac-release-prebuild.sh stop
      # Hand over the same build to the signing job; mac-app.sh checks its build and beta face when taking it back.
      - name: Bundle the beta Mac app for signing
        id: bundle
        env:
          POSTHOG_JSON: ""
        run: |
          set -eu
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog.json")
            export STILLFAIL_POSTHOG="$RUNNER_TEMP/posthog.json"
          fi
          unset POSTHOG_JSON
          trap 'rm -f "$RUNNER_TEMP/posthog.json"' EXIT
          # (the prebuild's app and core.hbc as it made them, where it says it built them whole: mac-release-prebuild.sh)
          [ ! -f "$RUNNER_TEMP/mac-prebuild/built" ] || export MBUI_BUILT=1
          # (main's: core.hbc made again here, where the prebuild did not build it whole, says when it was built as the
          # prebuild's would; the number is mac-app.sh's own, its Info.plist's, main's history fetched by now)
          [ "$GITHUB_REF" != refs/heads/main ] || export MBUI_BUILD="$(git rev-list --count HEAD)"
          MBUI_VARIANT=beta MBUI_SIGN_AFTER_BUILD=1 bash apps/mbui/scripts/mac-app.sh build
          mkdir -p "$RUNNER_TEMP/mac-unsigned"
          ditto -c -k --sequesterRsrc --keepParent apps/mbui/out/mac/youdid.wtf.app "$RUNNER_TEMP/mac-unsigned/bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/mac-unsigned/bundle.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # (main's, when it built the shell here)
      - if: github.ref == 'refs/heads/main' && steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      - if: github.ref == 'refs/heads/main' && steps.shell.outputs.cache-hit != 'true' && hashFiles('apps/mbui/out/core-target*/native/shell-apple/**/libstillfail_shell.a') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
      # (main's, when it compiled the engine here: a build that went through, the app handed over above)
      - if: github.ref == 'refs/heads/main' && steps.apple-native.outputs.cache-hit != 'true' && hashFiles('apps/mbui/out/core/aarch64-apple-darwin/libmbui_core.a') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: |
            apps/mbui/out/core/aarch64-apple-darwin/libmbui_core.a
            ~/Library/Caches/stillfail-native/ghostty-vt
          key: ${{ steps.native-keys.outputs.apple-native }}
      # (a cut build's log and its compilers stopped on main and a branch alike; a branch's store saved only of a build
      # that went through: a job that needs longer is made faster, never finished over several pushes, .github/AGENTS.md;
      # main's cut keeps what it compiled, as above)
      - name: The cache's key, by what it holds
        if: always() && steps.finish.outcome != 'skipped'
        run: |
          # (what the build did not use taken out only of a whole build: one cut in its bundling left compilers writing
          # units as used.sh took out all it had not seen used yet, and main's store was 24 MB after, 2026-11-17)
          if [ "${{ steps.finish.outcome }}" != success ] || [ "${{ steps.bundle.outcome }}" != success ]; then
            bash .github/mac-release-prebuild.sh stop
          fi
          mkdir -p .ci
          [ ! -d "$MBC_STORE" ] || mv "$MBC_STORE" .ci/mbc-store
          [ ! -d "$HBC_CACHE" ] || mv "$HBC_CACHE" .ci/hbc
          if [ "${{ steps.finish.outcome }}" = success ] && [ "${{ steps.bundle.outcome }}" = success ]; then
            sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
            # (the app built, bundled and handed over: its store not saved where too little is left for it, rather
            # than the save carrying the job past its five minutes, its release skipped; a cut build's is always saved)
            left=$(( JOB_END - $(date +%s) ))
            [ "$left" -ge 10 ] || { echo "the store not saved: ${left} s left"; exit 0; }
          else
            # (where the build was as it was cut: its worker's log is said only as it ends, so a cut said nothing of what
            # it had come to, main 6a896dd6, 202a54dc and 0ff80373 on 2026-11-16)
            tail -40 "$RUNNER_TEMP/mac-prebuild/log" 2>/dev/null || true
            find .ci/mbc-store -name '*.lock' -delete 2>/dev/null || true
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "a branch's build that did not go through: its store not saved"; exit 0; }
          fi
          echo "STORE_KEY=mbui-mac-cc-${{ github.ref != 'refs/heads/main' && 'b-' || '' }}${{ steps.mac-cc.outputs.key }}-$(sh apps/mbui/scripts/held.sh .ci/mbc-store .ci/hbc)" >> "$GITHUB_ENV"
      - if: always() && env.STORE_KEY != '' && env.STORE_KEY != steps.store.outputs.cache-matched-key && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}
      # Moon's build kept once moonc has made the app's C (stillfail.c), whatever came after it: kept only of a build that
      # went through, main's cut in its C (the units of -O2, at its JOB_END - 60) kept none, and every run did moonc's
      # 120 s again before its C, cut again (2026-11-17). Keyed by that C, as next-mac-cache.yml's: one the same is not
      # saved again. (The compilers the step before stopped; mbc's objects are not moon's: not kept.)
      - name: Moon's build, once moonc made the app's C
        if: always() && github.ref == 'refs/heads/main' && steps.finish.outcome != 'skipped'
        run: |
          c=apps/mbui/_build/native/release/build/stillfail/stillfail/stillfail.c
          [ -s "$c" ] || { echo "moonc had not made the app's C: moon's build not kept"; exit 0; }
          # (keyed by whether the app was linked too: a cut build's _build, of that C and no stillfail.exe, matched the
          # key of the whole one after it, which was not saved, and every run after restored the cut one and linked the
          # app again, ~61 s, main 45294094905. The state goes into the hash, not after it: cache-prune's kind_of takes a
          # last part of 16 hex digits as the id)
          exe=apps/mbui/_build/native/release/build/stillfail/stillfail/stillfail.exe
          state=cut
          [ "${{ steps.finish.outcome }}" != success ] || [ ! -x "$exe" ] || state=built
          key="mbui-mac-moon-$( (printf '%s\n' "$state"; shasum -a 256 "$c") | shasum -a 256 | cut -c1-16)"
          # (one the same as restored not saved: said before the .mbc are taken out, 9 s that carried main 45268661113
          # past its five minutes with nothing to save)
          [ "$key" != "${{ steps.moon.outputs.cache-matched-key }}" ] || { echo "moon's build unchanged ($key)"; exit 0; }
          # (its save takes ~16 s, 4 to make ready, 8 to upload, the post steps 2-4, as preview.yml's ios moon-room: main
          # 136452385742 began it with 8 s left, its app already handed over, and was cut at 300 s, desktop skipped;
          # and the .mbc taken out first)
          left=$(( JOB_END - $(date +%s) ))
          [ "$left" -ge 20 ] || { echo "moon's build not kept: ${left} s left"; exit 0; }
          find apps/mbui/_build -type d -name '*.mbc' -prune -exec rm -rf {} +
          echo "MOON_KEY=$key" >> "$GITHUB_ENV"
      - if: always() && github.ref == 'refs/heads/main' && env.MOON_KEY != '' && env.MOON_KEY != steps.moon.outputs.cache-matched-key
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
            !apps/mbui/_build/**/*.mbc/**
          key: ${{ env.MOON_KEY }}
      # Keep pnpm-macOS-* updated on main after lockfile changes, but only when >=30 s remain before JOB_END.
      - name: Room for pnpm store save
        id: pnpm-save-room
        if: github.ref == 'refs/heads/main' && steps.hbc.outputs.kept != 'true' && env.PNPM_CACHE_HIT != 'true' && env.PNPM_CACHE_KEY != ''
        run: |
          left=$(( JOB_END - $(date +%s) ))
          if [ "$left" -ge 30 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "pnpm store not saved: ${left} s left"
          fi
      - if: steps.pnpm-save-room.outputs.ok == '1'
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ env.PNPM_CACHE_KEY }}
  # The expensive build is already handed over; keep signing, notarization and release checks in their own budget.
