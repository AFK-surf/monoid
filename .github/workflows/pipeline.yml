name: Check monoid access to the office Mac runners

on:
  push:
    branches: [diag/monoid-office-mac-availability]

permissions: {}

jobs:
  tokyo:
    runs-on:
      group: Default
      labels: tartelet
    timeout-minutes: 2
    steps: &probe
      - name: Report the guest's build and graphics support
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          xcodebuild -version
          xcrun simctl list runtimes available
          system_profiler SPDisplaysDataType -detailLevel mini
          curl -q -fsS --connect-timeout 4 --max-time 8 -o /dev/null https://app.monoid.build/healthz
  shanghai:
    runs-on:
      group: mac-mini-ci
      labels: tartelet
    timeout-minutes: 2
    steps: *probe
