name: Linux native toolchains
description: Set up tools for native builds on GitHub's x64 Ubuntu runner
inputs:
  parts:
    description: Space-separated part and target pairs to build
    required: true
runs:
  using: composite
  steps:
    - if: contains(inputs.parts, ':linux-') || contains(inputs.parts, ':win32-')
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/zig-0.16.0
        key: zig-linux-x64-0.16.0
    - if: contains(inputs.parts, ':android-arm64')
      uses: actions/cache/restore@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/28.2.13676358
        key: android-ndk-28.2.13676358-${{ runner.os }}-${{ runner.arch }}
    - shell: bash
      env:
        PARTS: ${{ inputs.parts }}
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-target" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        tools="$RUNNER_TEMP/native-tools"
        mkdir -p "$tools"
        echo "$tools" >> "$GITHUB_PATH"
        if [[ "$PARTS" == *:linux-* || "$PARTS" == *:win32-* ]]; then
          dir="$RUNNER_TOOL_CACHE/zig-0.16.0/zig-x86_64-linux-0.16.0"
          if [ ! -x "$dir/zig" ]; then
            mkdir -p "$(dirname "$dir")"
            archive="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$archive" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c --quiet
            tar -xf "$archive" -C "$(dirname "$dir")"
          fi
          test "$("$dir/zig" version)" = 0.16.0
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$dir" "$dir" > "$tools/zig"
          chmod +x "$tools/zig"

          # The station's Rust parts and the static shell use cargo-zigbuild.
          archive="$RUNNER_TEMP/cargo-zigbuild.tar.xz"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 -o "$archive" https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          echo "32581c8e13f27a807bb244aaaac870522f5b51263c766cf77b1a99771ce9fa5c  $archive" | sha256sum -c --quiet
          tar -xf "$archive" -C "$tools" --strip-components 1 cargo-zigbuild-x86_64-unknown-linux-gnu/cargo-zigbuild
        fi
        if [[ "$PARTS" == *:wasm32* ]]; then
          llvm=/usr/lib/llvm-18/bin
          if [ ! -x "$llvm/clang" ] || [ ! -x "$llvm/llvm-ar" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends clang-18 llvm-18
          fi
          echo "LLVM_BIN=$llvm" >> "$GITHUB_ENV"
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("client/Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          asset="wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz"
          digest=$(gh api "repos/wasm-bindgen/wasm-bindgen/releases/tags/$version" --jq ".assets[] | select(.name == \"$asset\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 -o "$archive" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$asset"
          echo "${digest#sha256:}  $archive" | sha256sum -c --quiet
          tar -xzf "$archive" -C "$tools" --strip-components 1 "${asset%.tar.gz}/wasm-bindgen"
        fi
        if [[ "$PARTS" == *:android-arm64* ]]; then
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" ]; then
            "$sdkmanager" 'ndk;28.2.13676358'
          fi
          ls "$ANDROID_HOME/cmake" 2>/dev/null | grep -q . || "$sdkmanager" 'cmake;3.31.6'
        fi
