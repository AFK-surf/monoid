# Ubuntu's packages for a Linux job, their .debs kept in GitHub's cache between runs. Fetched from the runner's mirror
# (azure.archive.ubuntu.com) they came at 12 MB/s one run and 67 kB/s the next: GTK 4's 22.7 MB in 5 min 38 s (the
# release's linux job, run 40255577144, 481 s of its 10 minutes' timeout; 215 and 387 s in others, 25 s when the
# mirror is quick). apt takes what is in its archive directory as fetched, so only a .deb Ubuntu has updated since is
# fetched again; what no version installed any longer is put away (autoclean). Kept from main's runs, as the other
# caches are: a branch's runs take main's.
name: apt
description: Ubuntu's packages installed, their .debs kept in the cache
inputs:
  packages:
    description: the packages, as apt-get install takes them
    required: true
  name:
    description: the cache's name (the jobs that install the same packages share it)
    required: true
runs:
  using: composite
  steps:
    # What the kept .debs were fetched for: the runner's image (ImageOS, ImageVersion) and the packages asked. Where the
    # cache matched it, they are what apt would install again, so they are installed from the cache with nothing asked
    # of any mirror: apt-get update alone, of every list the image names (GitHub's third parties' among them), took 74 s
    # of preview's linux (x64) build with every .deb in the cache (run 44340331135, cancelled at its time, exit 124).
    # v2: kept since what this run did not install is put away (a cache kept every .deb it was ever given, the image's
    # own packages upgraded among them, and every run unpacked them all again). A cache from before is still taken
    # where there is no v2 one, so that what it holds is not fetched again from a slow mirror (preview's linux (x64)
    # with none: 31 MB at under 300 kB/s, cut at its 120 s, run 44359009201); what of it is not installed goes.
    - shell: bash
      run: |
        echo "APT_SPEC=$(printf 'v2\n%s\n' "${ImageOS:-linux}-${ImageVersion:-0}" "${{ inputs.packages }}" | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v4
      id: debs
      with:
        path: .ci/apt
        key: apt-${{ inputs.name }}-${{ env.APT_SPEC }}-${{ github.sha }}
        restore-keys: |
          apt-${{ inputs.name }}-${{ env.APT_SPEC }}-
          apt-${{ inputs.name }}-
    - shell: bash
      run: |
        d="$GITHUB_WORKSPACE/.ci/apt"
        mkdir -p "$d/partial"
        matched="${{ steps.debs.outputs.cache-matched-key }}"
        # Nothing of the packages' manuals, docs and translations is unpacked, and man-db does not index what was: the
        # -dev packages' tens of thousands of small files and man-db's trigger took 25-35 s of 66 (preview's linux (x64),
        # run 44356246478). These runners are GitHub's, made anew for each job, so dpkg does not sync each file it
        # unpacks either (force-unsafe-io): 26 s of unpacking with it, preview 44464002952's linux (x64).
        sudo rm -f /var/lib/man-db/auto-update
        printf '%s\n' \
          'force-unsafe-io' \
          'path-exclude=/usr/share/man/*' \
          'path-exclude=/usr/share/doc/*' \
          'path-exclude=/usr/share/gtk-doc/*' \
          'path-exclude=/usr/share/locale/*' \
          | sudo tee /etc/dpkg/dpkg.cfg.d/99-ci-nodoc > /dev/null
        # Of the packages asked, those the image has not installed: one it has is not upgraded with all it depends on.
        # Every one installed already: nothing to do.
        installed() { [ "$(dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null)" = installed ]; }
        want=
        for p in ${{ inputs.packages }}; do installed "$p" || want="$want $p"; done
        if [ -z "$want" ]; then
          echo "apt: every package asked is installed already"
          echo "APT_KEY=$matched" >> "$GITHUB_ENV"
          exit 0
        fi
        # What the .debs installed must have installed: dpkg forced past what they lack, or a cache cut short, is not
        # taken as done.
        complete() {
          for p in $want; do installed "$p" || { echo "apt: $p is not installed"; return 1; }; done
        }
        # The cache kept for this image and these packages: installed as it is, no mirror asked. Where dpkg refuses it
        # (a package the image updated since), apt is asked as below.
        case "$matched" in
          "apt-${{ inputs.name }}-$APT_SPEC-"*)
            if ls "$d"/*.deb > /dev/null 2>&1 &&
              sudo dpkg --install --force-depends --skip-same-version "$d"/*.deb &&
              sudo dpkg --configure --pending && complete; then
              echo "apt: installed the .debs kept for $APT_SPEC"
              echo "APT_KEY=$matched" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "apt: the .debs kept for $APT_SPEC did not install; asking apt" ;;
        esac
        # The lists are given a minute and what is to be fetched two: apt waits 20 s on a mirror that does not answer
        # for every list and every .deb before it takes the next (its Acquire timeouts did not shorten that), and where
        # there is no next (arm64's ports.ubuntu.com) again and again. 2026-11-11, an hour and more: Ubuntu's mirrors
        # silent to GitHub's runners, every job here cancelled at its 5 minutes with all but five .debs in the cache.
        # Where they do not come in that time, the .debs the cache keeps are installed as they are (a package Ubuntu
        # updated since is the cache's older one for this run, and the cache is left as it was).
        # That minute is not waited where the mirror says nothing at all: its release file is asked for first, 5 s, and
        # with no answer and .debs in the cache they are installed at once. The minute and the 20 s of installing them
        # left the preview's Linux build (3 minutes) no room in its 5: of eight such jobs that evening two were
        # cancelled as they uploaded what they had built (#5550's, #5572's, 5 min 4 s), the rest took 4:09 to 4:36.
        # (the mirror: the first the runner's list names, or the sources' own where they name one, arm64's; none found,
        # apt is asked as before)
        mirror=$(awk 'NF { print $1; exit }' /etc/apt/apt-mirrors.txt 2>/dev/null || true)
        [ -n "$mirror" ] || mirror=$(sed -n 's/^URIs: *\(https\{0,1\}:[^ ]*\).*/\1/p' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | head -1 || true)
        answers() {
          [ -n "$mirror" ] || return 0
          curl -fsS -m 5 -o /dev/null "${mirror%/}/dists/$(. /etc/os-release && echo "$VERSION_CODENAME")/InRelease" && echo "apt: $mirror answers" ||
            { echo "apt: $mirror did not answer in 5 s"; return 1; }
        }
        # (each connection given 15 s and two tries, beside update's and install's own limits)
        apt_opts=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2)
        # A mirror that did not answer, with no .debs kept to install instead, is put out of the runner's list and
        # Ubuntu's own archive put first: apt went on asking it, 8 of 125 .debs in install's 120 s (side 44457653376's
        # x11, us-east-2.ec2.archive.ubuntu.com, 2026-11-19).
        mirror_ok=0
        answers && mirror_ok=1
        if [ "$mirror_ok" != 1 ] && ! ls "$d"/*.deb > /dev/null 2>&1 && [ -f /etc/apt/apt-mirrors.txt ]; then
          {
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' 'http://security.ubuntu.com/ubuntu/'
            if [ -z "$mirror" ]; then cat /etc/apt/apt-mirrors.txt; else grep -vF "$mirror" /etc/apt/apt-mirrors.txt || true; fi
          } | awk '!seen[$0]++' > "$RUNNER_TEMP/apt-mirrors.txt"
          sudo cp "$RUNNER_TEMP/apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          echo "apt: $mirror left out of /etc/apt/apt-mirrors.txt, Ubuntu's own archive first"
        fi
        # Only Ubuntu's own lists where the image names them apart (the packages are all Ubuntu's): the third parties'
        # lists the image adds are most of update's time. Where that fails, every list as before.
        update() {
          u=/etc/apt/sources.list.d/ubuntu.sources
          if [ -f "$u" ] && sudo timeout 60 apt-get "${apt_opts[@]}" update -q -o APT::Update::Error-Mode=any \
            -o Dir::Etc::sourcelist="$u" -o Dir::Etc::sourceparts=-; then
            return 0
          fi
          sudo timeout 60 apt-get "${apt_opts[@]}" update -q -o APT::Update::Error-Mode=any
        }
        # shellcheck disable=SC2086 # the packages are words, split on purpose
        if { [ "$mirror_ok" = 1 ] || ! ls "$d"/*.deb > /dev/null 2>&1; } && update &&
          sudo timeout 120 apt-get "${apt_opts[@]}" install -f -y -q --no-install-recommends -o Dir::Cache::Archives="$d" $want; then
          sudo apt-get autoclean -q -o Dir::Cache::Archives="$d"
          # Only what is installed now, at that version, is kept: a .deb of a cache from before that this run did not
          # install (an upgrade of the image's own packages) would be unpacked by every run that installs the cache.
          for f in "$d"/*.deb; do
            # shellcheck disable=SC2016 # dpkg-deb's own fields
            read -r pkg arch ver < <(dpkg-deb --show --showformat='${Package} ${Architecture} ${Version}\n' "$f")
            [ "$arch" = all ] && q=$pkg || q=$pkg:$arch
            [ "$(dpkg-query -W -f='${db:Status-Status} ${Version}' "$q" 2>/dev/null)" = "installed $ver" ] || sudo rm -f "$f"
          done
          sudo chown -R "$(id -u)" "$d"
          echo "APT_KEY=apt-${{ inputs.name }}-$APT_SPEC-$(cd "$d" && ls *.deb | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
        else
          echo "::warning::apt: Ubuntu's mirrors did not answer in time; the .debs kept in the cache are installed as they are"
          ls "$d"/*.deb > /dev/null
          sudo dpkg --install --force-depends --skip-same-version "$d"/*.deb
          sudo dpkg --configure --pending
          complete
          echo "APT_KEY=$matched" >> "$GITHUB_ENV"
        fi
    - if: github.ref == 'refs/heads/main' && env.APT_KEY != steps.debs.outputs.cache-matched-key
      uses: actions/cache/save@v4
      with:
        path: .ci/apt
        key: ${{ env.APT_KEY }}
