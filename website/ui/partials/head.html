<!doctype html>
<html lang="en" data-lang="en" data-title-en="{{title}}" data-title-zh="{{title-zh}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.classList.add("js");try{var q=new URLSearchParams(location.search).get("lang"),l=(q==="zh"||q==="en")?q:localStorage.getItem("ui.monoid.lang");if(l==="zh")document.documentElement.dataset.lang="zh";}catch(e){}</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{origin}}{{here}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ui.monoid">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{origin}}{{here}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/InterDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/demo.css">
{{page-style}}
<script src="/assets/site.js" defer></script>
</head>
